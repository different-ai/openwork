version = 1

# Security and confidentiality review. warden-clearance.yml approves clean PRs;
# see .warden/README.md.
[defaults]
defaultBranch = "dev"
reportOn = "low"
ignorePaths = ["**/node_modules/**", "**/pnpm-lock.yaml", "**/dist/**", "**/*.min.js"]

[defaults.scan]
maxFileLines = 5000
# Warden's defaults (150 files, 10,000 changed lines) left big PRs half
# reviewed, and a partial review never clears. PRs beyond these still come
# back incomplete: split them.
maxFiles = 400
maxChangedLines = 60000

[defaults.agent]
model = "openai/gpt-6-luna"

[defaults.auxiliary]
model = "openai/gpt-6-luna"

[[skills]]
name = "diff-security-review"

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened", "ready_for_review"]

[[skills.triggers]]
type = "local"
failOn = "info"
minConfidence = "low"

# Keep the public-repository confidentiality rule in AGENTS.md.
[[skills]]
name = "confidentiality-review"

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened", "ready_for_review"]

[[skills.triggers]]
type = "local"
failOn = "info"
minConfidence = "low"
