version = 1

# Security review only. GitHub's admin-team rule owns merge approval.
[defaults]
defaultBranch = "dev"
reportOn = "low"
ignorePaths = ["**/node_modules/**", "**/pnpm-lock.yaml", "**/dist/**", "**/*.min.js"]

[defaults.scan]
maxFileLines = 5000

[defaults.agent]
model = "openai/gpt-5.6-luna"

[defaults.auxiliary]
model = "openai/gpt-5.6-luna"

[[skills]]
name = "diff-security-review"

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened", "ready_for_review"]

[[skills.triggers]]
type = "local"
failOn = "info"
minConfidence = "low"

# Keep the public-repository confidentiality rule in AGENTS.md.
[[skills]]
name = "confidentiality-review"

[[skills.triggers]]
type = "pull_request"
actions = ["opened", "synchronize", "reopened", "ready_for_review"]

[[skills.triggers]]
type = "local"
failOn = "info"
minConfidence = "low"
