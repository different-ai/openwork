directories:
  output: dist-electron
toolsets:
  appimage: "1.0.3"
extraResources:
  - from: .electron-runtime/openwork-sentry.json
    to: openwork-sentry.json
  - from: ../app/dist
    to: app-dist
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "*.wasm"
  - from: ../../packages/docs
    to: openwork-docs
    filter:
      - "**/*.md"
      - "**/*.mdx"
      - "docs.json"
asar: true
asarUnpack:
  # Keep Windows native code outside ASAR so it can be signed and audited.
  - "**/*.exe"
  - "**/*.dll"
  - "**/*.node"
  # External tar cannot read an archive through Electron's virtual ASAR paths.
  - server/dist/opencode-plugin-deps-*.tgz
  - node_modules/.pnpm/@lydell+node-pty*/**
  - node_modules/node-pty/**
  # Blender loads computer use's script bridge from a real file.
  - electron/computer-scripting/**
npmRebuild: false
afterPack: scripts/electron-after-pack.cjs
afterSign: scripts/electron-after-sign.cjs
publish:
  - provider: github
    owner: different-ai
    repo: openwork
    releaseType: release
mac:
  # Filter both dependency-collector and explicitly staged runtime copies.
  files:
    - electron/**/*
    - server/**/*
    - "!server/dist/opencode-plugins/**"
    - package.json
    - &macSqlite "!**/better-sqlite3/prebuilds/!(darwin-${arch}).node"
    - &macPty "!**/@lydell/node-pty-!(darwin-${arch}){,/**}"
    - &macPnpmPty "!**/.pnpm/@lydell+node-pty-!(darwin-${arch})@*/**"
    - from: .electron-runtime/node_modules
      to: node_modules
      filter: ["**/*", *macSqlite, *macPty, *macPnpmPty]
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: OpenWork uses the microphone when you allow a page to access audio input.
    NSAppleEventsUsageDescription: OpenWork controls this app with a script when you approve a computer use task.
  extraResources:
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-apple-darwin
        - opencode2-aarch64-apple-darwin
        - opencode-x86_64-apple-darwin
        - opencode2-x86_64-apple-darwin
        - versions.json
        - versions.json-aarch64-apple-darwin
        - versions.json-x86_64-apple-darwin
    - from: resources/helpers
      to: helpers
      filter:
        - "OpenWork Computer Use.app/**"
  target:
    - dmg
    - zip
linux:
  files:
    - electron/**/*
    - server/**/*
    - "!server/dist/opencode-plugins/**"
    - package.json
    # Preserve both libc variants; the SQLite loader selects at runtime.
    - &linuxSqlite "!**/better-sqlite3/prebuilds/!(linux-${arch}|linuxmusl-${arch}).node"
    - &linuxPty "!**/@lydell/node-pty-!(linux-${arch}){,/**}"
    - &linuxPnpmPty "!**/.pnpm/@lydell+node-pty-!(linux-${arch})@*/**"
    - from: .electron-runtime/node_modules
      to: node_modules
      filter: ["**/*", *linuxSqlite, *linuxPty, *linuxPnpmPty]
  icon: resources/icons/linux
  syncDesktopName: true
  extraResources:
    - from: resources/icons/linux
      to: icons/linux
      filter:
        - "*.png"
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode
        - opencode2
        - opencode-aarch64-unknown-linux-gnu
        - opencode2-aarch64-unknown-linux-gnu
        - opencode-x86_64-unknown-linux-gnu
        - opencode2-x86_64-unknown-linux-gnu
        - versions.json
        - versions.json-aarch64-unknown-linux-gnu
        - versions.json-x86_64-unknown-linux-gnu
  target:
    - AppImage
    - tar.gz
win:
  files:
    - electron/**/*
    - server/**/*
    - "!server/dist/opencode-plugins/**"
    - package.json
    - &winSqlite "!**/better-sqlite3/prebuilds/!(win32-${arch}).node"
    - &winPty "!**/@lydell/node-pty-!(win32-${arch}){,/**}"
    - &winPnpmPty "!**/.pnpm/@lydell+node-pty-!(win32-${arch})@*/**"
    - from: .electron-runtime/node_modules
      to: node_modules
      filter: ["**/*", *winSqlite, *winPty, *winPnpmPty]
  icon: resources/icons/icon.ico
  signExts: [".dll", ".node"]
  signtoolOptions:
    sign: scripts/windows-sign.cjs
    signingHashAlgorithms: [sha256]
  extraResources:
    - from: resources/icons/icon.png
      to: icons/icon.png
    - from: resources/sidecars
      to: sidecars
      filter:
        - opencode.exe
        - opencode2.exe
        - opencode-aarch64-pc-windows-msvc.exe
        - opencode2-aarch64-pc-windows-msvc.exe
        - opencode-x86_64-pc-windows-msvc.exe
        - opencode2-x86_64-pc-windows-msvc.exe
        - versions.json
        - versions.json-aarch64-pc-windows-msvc
        - versions.json-x86_64-pc-windows-msvc
  target:
    - nsis
nsis:
  include: build/installer.nsh
