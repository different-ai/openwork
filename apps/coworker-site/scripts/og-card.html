<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background:
      radial-gradient(760px 420px at 8% -8%, rgb(91 141 255 / 0.16), transparent 60%),
      radial-gradient(640px 400px at 100% 40%, rgb(62 213 166 / 0.06), transparent 60%),
      #090c12;
    color: #f5f7fb;
    font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card { position: relative; width: 1200px; height: 630px; padding: 72px 80px; box-sizing: border-box; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  h1 { margin: 52px 0 0; font-size: 84px; line-height: 0.98; letter-spacing: -0.045em; font-weight: 600; max-width: 760px; }
  p.lead { margin: 30px 0 0; font-size: 26px; line-height: 1.35; color: #8d98a9; max-width: 600px; }
  .team { position: absolute; right: 80px; bottom: 72px; display: flex; gap: 22px; align-items: flex-end; }
  .foot { position: absolute; left: 80px; bottom: 72px; display: flex; align-items: center; gap: 14px; font-size: 18px; color: #8d98a9; }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: rgb(141 152 169 / 0.5); }
</style>
</head>

<div class="card">
