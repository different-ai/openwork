appId: com.differentai.opencoworker
productName: Open Coworker
artifactName: open-coworker-${os}-${arch}-${version}.${ext}
protocols:
  - name: Open Coworker
    schemes:
      - opencoworker
directories:
  output: dist-electron
files:
  - electron-dist/**/*
  - dist/**/*
  # Keep debugging output in the build tree, not every downloaded copy.
  - "!dist/**/*.map"
  - server/**/*
  - "!server/**/*.test.js"
  - "!server/**/*.test.js.map"
  - "!server/dist/opencode-plugins/**"
  # The main process reads one window/dock PNG at run time; the .icns/.ico and
  # the Linux icon set are consumed by electron-builder from the project tree.
  - resources/icons/icon.png
  - resources/icons/icon-macos.png
  - package.json
  # Dependency build artifacts nothing loads at run time. Declarations with the
  # classic .d.ts extension are already excluded by default; these are the
  # module-flavoured declarations, source maps, and shipped TypeScript sources
  # of packages whose exports point at compiled output. Keep every *.ts that a
  # package exports directly (workspace types) by not excluding *.ts broadly.
  - "!**/node_modules/**/*.map"
  - "!**/node_modules/**/*.d.mts"
  - "!**/node_modules/**/*.d.cts"
  - "!**/node_modules/**/*.tsbuildinfo"
  - "!**/node_modules/zod/src/**"
  - "!**/node_modules/ajv/lib/**/*.ts"
extraMetadata:
  main: electron-dist/main.mjs
extraResources:
  - from: resources/sidecars
    to: sidecars
    # beforePack narrows this to the builder target and its version metadata.
    filter:
      - opencode-*
      - versions.json-*
  # The embedded server resolves its OpenWork engine plugins from
  # Resources/opencode-plugins when it runs from an asar, as the desktop does.
  - from: server/dist/opencode-plugins
    to: opencode-plugins
    filter:
      - "*.js"
      - "*.wasm"
      - "!*.test.js"
asar: true
npmRebuild: false
# Notarization runs in the after-sign hook only when a release asks for it
# (MACOS_NOTARIZE=true with Apple API key credentials); electron-builder's own
# notarize step stays off so local unsigned builds are unaffected.
# The build module's hook validates the actual packaged helper CPU and signature.
beforePack: scripts/electron-build.mjs
afterPack: scripts/electron-build.mjs
afterSign: ../desktop/scripts/electron-after-sign.cjs
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Open Coworker uses the microphone when you hold the voice control to record a message.
  extraResources:
    - from: resources/helpers
      to: helpers
      filter:
        - "OpenWork Computer Use.app/**"
  target:
    - dmg
    - zip
dmg:
  title: Open Coworker
  background: resources/installer/dmg-background.png
  icon: resources/icons/icon.icns
  iconSize: 118
  iconTextSize: 13
  window:
    width: 760
    # Keep the final launch step visible even when Finder shows tabs/path/status bars.
    height: 600
  contents:
    - x: 180
      y: 285
    - x: 580
      y: 285
      type: link
      path: /Applications
linux:
  executableName: open-coworker
  icon: resources/icons/linux
  syncDesktopName: true
  target:
    - AppImage
    - tar.gz
win:
  icon: resources/icons/icon.ico
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  installerIcon: resources/icons/icon.ico
  uninstallerIcon: resources/icons/icon.ico
  installerHeaderIcon: resources/icons/icon.ico
  shortcutName: Open Coworker
  uninstallDisplayName: Open Coworker
  createDesktopShortcut: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
