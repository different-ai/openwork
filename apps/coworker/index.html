<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090c12" />
    <link rel="icon" href="/open-coworker.svg" type="image/svg+xml" />
    <title>Open Coworker</title>
    <style>
      html, body, #root { height: 100%; }
      body { margin: 0; background: #090c12; color: #f5f7fb; font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .boot-splash { display: flex; height: 100%; align-items: center; justify-content: center; background: #090c12; }
      .boot-splash__content { display: flex; align-items: center; flex-direction: column; color: #8d98a9; font-size: 12px; }
      .boot-splash__icon { width: 82px; height: 82px; animation: boot-float 2.8s ease-in-out infinite; }
      .boot-splash__name { margin-top: 14px; color: #f5f7fb; font-size: 17px; font-weight: 650; letter-spacing: -.025em; }
      .boot-splash__line { position: relative; width: 72px; height: 1px; margin-top: 18px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.1); }
      .boot-splash__line::after { position: absolute; inset-block: 0; left: 0; width: 32%; border-radius: inherit; background: #f5f7fb; content: ""; animation: boot-line 1.45s cubic-bezier(.65,0,.35,1) infinite; }
      @keyframes boot-float { 50% { transform: translateY(-2px); } }
      @keyframes boot-line { 0% { transform: translateX(-115%); } 52% { transform: translateX(105%); } 100% { transform: translateX(315%); } }
      @media (prefers-reduced-motion: reduce) { .boot-splash__icon, .boot-splash__line::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-label="Starting Open Coworker">
        <div class="boot-splash__content">
          <img class="boot-splash__icon" src="/open-coworker.svg" alt="" />
          <span class="boot-splash__name">Open Coworker</span>
          <span class="boot-splash__line" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
