<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Open Coworker app icon. One centered white coworker on the blue tile.
    A restrained surface gradient and offset shadows add depth while keeping
    the mark crisp across renderers.
    Rasters are regenerated with the icons:render script of @openwork/coworker.
  -->
  <defs>
    <linearGradient id="avatar-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#f8f9fb"/>
      <stop offset="100%" stop-color="#edf0f4"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="224" fill="#5b8dff"/>
  <rect x="65" y="65" width="894" height="894" rx="223" fill="none" stroke="#8aa9ff" stroke-opacity=".58" stroke-width="2"/>

  <!-- Compact contact shadow beneath the centered coworker. -->
  <path data-layer="front-shadow" d="M26 8h65c15 0 23 10 23 26v46c0 15-8 24-23 24H57l-15 9c-5 3-10 0-10-6v-3h-5C12 104 5 95 5 80V34C5 18 12 8 26 8Z" fill="#11141a" opacity=".16" transform="translate(161 169) scale(5.9) rotate(-6.5 59.5 56)"/>

  <!-- One centered coworker, tilted just enough to keep the mark personable. -->
  <g data-layer="front-coworker" transform="translate(161 160) scale(5.9) rotate(-6.5 59.5 56)">
    <path d="M26 8h65c15 0 23 10 23 26v46c0 15-8 24-23 24H57l-15 9c-5 3-10 0-10-6v-3h-5C12 104 5 95 5 80V34C5 18 12 8 26 8Z" fill="url(#avatar-surface)" stroke="#ffffff" stroke-width="1.1"/>
    <g data-layer="pupils" fill="#0b0e14">
      <rect x="34.5" y="50" width="6" height="14" rx="3"/>
      <rect x="79.5" y="50" width="6" height="14" rx="3"/>
    </g>
    <g data-layer="glasses" fill="none" stroke="#11151d" stroke-linecap="round" stroke-width="5">
      <circle cx="37.5" cy="57" r="17.5"/>
      <circle cx="82.5" cy="57" r="17.5"/>
      <path d="M57.5 57c1.25-4 3.75-4 5 0"/>
      <path d="M15 57h4.5M100.5 57h4.5" stroke-width="7"/>
    </g>
  </g>
</svg>
