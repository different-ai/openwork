<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Open Coworker app icon. One blue tile, one charcoal card behind, one white
    speech-bubble coworker in front with round glasses and two vertical pupils.
    Solid colours only; shadows are offset shapes so every renderer agrees.
    Rasters are regenerated with the icons:render script of @openwork/coworker.
  -->
  <rect x="64" y="64" width="896" height="896" rx="224" fill="#5b8dff"/>
  <rect x="65" y="65" width="894" height="894" rx="223" fill="none" stroke="#8aa9ff" stroke-opacity=".58" stroke-width="2"/>

  <!-- Soft shadow beneath the whole card stack. -->
  <g data-layer="stack-shadow" opacity=".16">
    <rect x="288" y="184" width="640" height="576" rx="150" fill="#11141a" transform="rotate(6 608 472)"/>
    <path d="M26 8h65c15 0 23 10 23 26v46c0 15-8 24-23 24H57l-15 9c-5 3-10 0-10-6v-3h-5C12 104 5 95 5 80V34C5 18 12 8 26 8Z" fill="#11141a" transform="translate(122 210) scale(6.25) rotate(-1.5 59.5 56)"/>
  </g>

  <!-- Charcoal card: up and to the right, turned a few degrees, no face. -->
  <g data-layer="back-card" transform="rotate(6 601 444)">
    <rect x="281" y="156" width="640" height="576" rx="150" fill="#202126"/>
  </g>

  <!-- Contact shadow between the white coworker and the charcoal card. -->
  <path data-layer="front-shadow" d="M26 8h65c15 0 23 10 23 26v46c0 15-8 24-23 24H57l-15 9c-5 3-10 0-10-6v-3h-5C12 104 5 95 5 80V34C5 18 12 8 26 8Z" fill="#11141a" opacity=".24" transform="translate(122 196) scale(6.25) rotate(-1.5 59.5 56)"/>

  <!-- White coworker in front: slightly lower and left, nearly upright. -->
  <g data-layer="front-coworker" transform="translate(122 188) scale(6.25) rotate(-1.5 59.5 56)">
    <path d="M26 8h65c15 0 23 10 23 26v46c0 15-8 24-23 24H57l-15 9c-5 3-10 0-10-6v-3h-5C12 104 5 95 5 80V34C5 18 12 8 26 8Z" fill="#f7f8fa" stroke="#ffffff" stroke-width="1.1"/>
    <g data-layer="pupils" fill="#0b0e14">
      <rect x="34.5" y="50" width="6" height="14" rx="3"/>
      <rect x="79.5" y="50" width="6" height="14" rx="3"/>
    </g>
    <g data-layer="glasses" fill="none" stroke="#11151d" stroke-linecap="round" stroke-width="5">
      <circle cx="37.5" cy="57" r="17.5"/>
      <circle cx="82.5" cy="57" r="17.5"/>
      <path d="M57.5 57c1.25-4 3.75-4 5 0"/>
      <path d="M15 57h4.5M100.5 57h4.5" stroke-width="7"/>
    </g>
  </g>
</svg>
