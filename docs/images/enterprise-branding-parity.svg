<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Branding parity across installer JSON, MDM, and signed links</title>
  <desc id="desc">Three delivery paths map company app name, wordmark, native icon, server, and sign-in settings into the same canonical desktop bootstrap configuration.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg2)"/>
  <text x="100" y="95" font-family="Inter, Arial, sans-serif" font-size="50" font-weight="750" fill="#0f172a">One branding contract, three delivery choices</text>
  <text x="100" y="143" font-family="Inter, Arial, sans-serif" font-size="24" fill="#475569">The signed-link proposal preserves the side-file JSON solution; it does not create a competing brand system.</text>

  <g filter="url(#shadow2)" font-family="Inter, Arial, sans-serif">
    <rect x="85" y="230" width="395" height="165" rx="24" fill="#ffffff" stroke="#fdba74"/>
    <rect x="85" y="430" width="395" height="165" rx="24" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="85" y="630" width="395" height="165" rx="24" fill="#ffffff" stroke="#86efac"/>
    <rect x="645" y="320" width="380" height="390" rx="30" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="1190" y="260" width="330" height="500" rx="30" fill="#0f172a"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="120" y="275" font-size="25" font-weight="700" fill="#9a3412">Preconfigured installer</text>
    <text x="120" y="313" font-size="19" fill="#475569">openwork-installer.json</text>
    <text x="120" y="348" font-size="17" fill="#64748b">appName · logoUrl · iconUrl</text>
    <text x="120" y="376" font-size="17" fill="#64748b">webUrl · apiUrl · requireSignin</text>

    <text x="120" y="475" font-size="25" font-weight="700" fill="#075985">Managed fleet (MDM)</text>
    <text x="120" y="513" font-size="19" fill="#475569">desktop-bootstrap.json</text>
    <text x="120" y="548" font-size="17" fill="#64748b">brandAppName · brandLogoUrl</text>
    <text x="120" y="576" font-size="17" fill="#64748b">brandIconUrl · baseUrl · apiBaseUrl</text>

    <text x="120" y="675" font-size="25" font-weight="700" fill="#166534">Signed connect link</text>
    <text x="120" y="713" font-size="19" fill="#475569">openwork://connect?token=…</text>
    <text x="120" y="748" font-size="17" fill="#64748b">brand.appName · logoUrl · iconUrl</text>
    <text x="120" y="776" font-size="17" fill="#64748b">den.baseUrl · apiBaseUrl · requireSignin</text>

    <text x="835" y="375" text-anchor="middle" font-size="25" font-weight="700" fill="#5b21b6">Canonical local contract</text>
    <text x="835" y="414" text-anchor="middle" font-size="20" fill="#475569">desktop-bootstrap.json</text>
    <line x1="700" y1="448" x2="970" y2="448" stroke="#e2e8f0" stroke-width="2"/>
    <text x="705" y="492" font-size="18" fill="#334155">brandAppName</text>
    <text x="705" y="530" font-size="18" fill="#334155">brandLogoUrl</text>
    <text x="705" y="568" font-size="18" fill="#334155">brandIconUrl</text>
    <text x="705" y="606" font-size="18" fill="#334155">baseUrl + apiBaseUrl</text>
    <text x="705" y="644" font-size="18" fill="#334155">requireSignin</text>
    <rect x="700" y="666" width="270" height="36" rx="18" fill="#f5f3ff"/>
    <text x="835" y="690" text-anchor="middle" font-size="16" font-weight="650" fill="#6d28d9">normalized once in Electron main</text>

    <text x="1355" y="316" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Acme Work</text>
    <rect x="1250" y="355" width="210" height="75" rx="18" fill="#ffffff" opacity="0.10"/>
    <text x="1355" y="386" text-anchor="middle" font-size="18" font-weight="650" fill="#ffffff">ACME ROBOTICS</text>
    <text x="1355" y="412" text-anchor="middle" font-size="15" fill="#cbd5e1">company wordmark</text>
    <rect x="1295" y="468" width="120" height="120" rx="28" fill="#4f46e5"/>
    <text x="1355" y="540" text-anchor="middle" font-size="42" font-weight="750" fill="#ffffff">A</text>
    <text x="1355" y="624" text-anchor="middle" font-size="18" fill="#cbd5e1">native app icon</text>
    <text x="1355" y="667" text-anchor="middle" font-size="18" fill="#cbd5e1">company server</text>
    <text x="1355" y="699" text-anchor="middle" font-size="18" fill="#cbd5e1">company SSO</text>
    <rect x="1242" y="720" width="226" height="42" rx="21" fill="#22c55e"/>
    <text x="1355" y="748" text-anchor="middle" font-size="17" font-weight="700" fill="#052e16">Same branded result</text>
  </g>

  <path d="M480 312 C560 312 565 410 632 438" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M480 512 H632" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M480 712 C560 712 565 615 632 590" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow2)"/>
  <path d="M1025 515 H1175" fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#arrow2)"/>
</svg>
