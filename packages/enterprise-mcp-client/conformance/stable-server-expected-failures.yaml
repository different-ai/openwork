# The production /mcp/agent endpoint intentionally exposes only
# search_capabilities and execute_capability. The official server framework's
# tools/call scenarios require diagnostic fixture tools that must never be
# registered on this customer-facing endpoint. These scenario-level failures
# are expected until the framework supports an external fixture adapter.
#
# The active suite also runs scenarios for optional capabilities even when the
# server does not advertise them. Record those method-not-found results here so
# the baseline matches the exact two-tool contract. A passing entry is treated
# as stale and fails the run. Do not add auth, transport, initialization,
# catalog, or DNS-rebinding failures here.
server:
  - logging-set-level
  - completion-complete
  - tools-call-image
  - tools-call-audio
  - tools-call-embedded-resource
  - tools-call-mixed-content
  - tools-call-with-logging
  - tools-call-with-progress
  - tools-call-sampling
  - tools-call-elicitation
  - json-schema-2020-12
  - elicitation-sep1034-defaults
  - elicitation-sep1330-enums
  - server-sse-multiple-streams
  - resources-list
  - resources-read-text
  - resources-read-binary
  - resources-templates-read
  - resources-subscribe
  - resources-unsubscribe
  - prompts-list
  - prompts-get-simple
  - prompts-get-with-args
  - prompts-get-embedded-resource
  - prompts-get-with-image
