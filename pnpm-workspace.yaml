allowBuilds:
  # @stoplight/spectral-cli -> @scarf/scarf is install analytics; never run it.
  "@scarf/scarf": false
  "@sentry/cli": true
  "@whiskeysockets/baileys": true
  better-sqlite3: true
  # posthog-js -> core-js: skip the optional funding-message postinstall.
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  # Wrangler's local runtime installs its platform-specific workerd executable.
  workerd: true
  # effect -> msgpackr -> msgpackr-extract ships an optional native accelerator;
  # msgpackr falls back to pure JS, so skip compiling it in CI and images.
  msgpackr-extract: false
  msw: false
  node-pty: true
  protobufjs: true
  sharp: true
patchedDependencies:
  '@better-auth/cimd@1.7.0-beta.10': patches/@better-auth__cimd@1.7.0-beta.10.patch
  '@better-auth/drizzle-adapter@1.7.0-beta.10': patches/@better-auth__drizzle-adapter@1.7.0-beta.10.patch
