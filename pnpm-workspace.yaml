allowBuilds:
  "@sentry/cli": true
  "@whiskeysockets/baileys": true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: true
  # effect -> msgpackr -> msgpackr-extract ships an optional native accelerator;
  # msgpackr falls back to pure JS, so skip compiling it in CI and images.
  msgpackr-extract: false
  msw: false
  node-pty: true
  protobufjs: true
  sharp: true
patchedDependencies:
