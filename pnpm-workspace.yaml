  - "acorn"
  - "enhanced-resolve"
  - "postcss"

packages:
  - "apps/*"
  - "packages/*"
  - "ee/apps/*"
  - "ee/packages/*"

catalog:
  react: 19.2.8
  react-dom: 19.2.8

catalogs:
  react18:
    react: 18.2.0
    react-dom: 18.2.0
linkWorkspacePackages: true
preferWorkspacePackages: true
overrides:
