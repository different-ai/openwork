config:
  openworkDevMode: "1"
  denApiNodeOptions: --use-openssl-ca
  tenancy:
    mode: single_org
    singleOrgName: Acme Robotics
    singleOrgSlug: default
    allowPublicSignup: "true"
    requireEmailVerification: "false"
  public:
    webOrigin: http://127.0.0.1:3005
    apiOrigin: http://127.0.0.1:8790
    mcpResourceUrl: http://127.0.0.1:8790/mcp
    desktopDenBaseUrl: http://localhost:8790
    corsOrigins: http://127.0.0.1:3005,http://localhost:3005,http://127.0.0.1:8790,http://localhost:8790,http://127.0.0.1:5173,http://localhost:5173
    betterAuthTrustedOrigins: http://127.0.0.1:3005,http://localhost:3005,http://127.0.0.1:8790,http://localhost:8790,http://127.0.0.1:5173,http://localhost:5173
    webAppHosts: 127.0.0.1,localhost
    authCallbackUrl: http://127.0.0.1:3005
  provisioner:
    mode: stub
secret:
  values:
    databaseUrl: mysql://openwork:openwork@openwork-mysql:3306/openwork_den
    betterAuthSecret: local-dev-secret-not-for-production-use!!
    denDbEncryptionKey: local-dev-db-encryption-key-please-change-1234567890
denApi:
  probes:
    liveness:
      initialDelaySeconds: 10
    readiness:
      initialDelaySeconds: 5
denWeb:
  probes:
    liveness:
      initialDelaySeconds: 20
    readiness:
      initialDelaySeconds: 5
