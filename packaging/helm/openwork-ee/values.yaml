    dsnSecret:
      existingSecret: ""
      key: SENTRY_DSN
    tracesSampleRate: "0.01"
    environment: ""
    release: ""
    dist: ""

customCa:
  enabled: false
  existingSecret: ""
  existingConfigMap: ""
  key: ca.crt

redis:
