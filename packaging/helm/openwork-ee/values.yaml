  hostPath: ""
  mountPath: /var/lib/openwork/installer-artifacts

denApi:
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-den-api
    tag: ""
  service:
    type: ClusterIP
    port: 8788
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8788
  # Daily audit usage refresh. Audit writes never update an organization's usage
  # totals (retained operations, events, bytes); this CronJob recomputes them by
  # calling den-api POST /internal/audit/usage/refresh. Same pattern as
  # inference.retention. Needs a maintenance token: set secret.values.maintenanceToken,
  # or tokenSecret/tokenKey to read it from your own Secret. The token is also given
  # to den-api as DEN_MAINTENANCE_TOKEN. Without it, audit usage keeps its last totals.
  auditUsage:
    enabled: false
    schedule: "30 3 * * *"
    timeZone: "Etc/UTC"
    tokenSecret: ""
    tokenKey: DEN_MAINTENANCE_TOKEN
  # GitHub connector reconcile. Checks due GitHub connector targets for new
  # commits and queues a resync, by calling den-api POST /internal/github/reconcile/run
  # every few minutes. Each run reads due targets in small pages, so it never loads
  # every target at once. Push webhooks still sync without it; it is the backstop
  # for webhooks that never arrived, and nothing else runs the check.
  # Uses the same maintenance token as auditUsage: secret.values.maintenanceToken,
  # or tokenSecret/tokenKey (here or under auditUsage; if both are set they must match).
  githubReconcile:
    enabled: false
    schedule: "*/5 * * * *"
    timeZone: "Etc/UTC"
    tokenSecret: ""
    tokenKey: DEN_MAINTENANCE_TOKEN
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

denWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-den-web
    tag: ""
  service:
    type: ClusterIP
    port: 3005
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 3005
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 10
      failureThreshold: 18

# Sparse canonical overrides. Do not add defaults here: they would mask legacy
# inference values. Only explicit enabled: true advertises the Gateway capability.
# Same structural keys as inference; nonempty maps merge recursively, empty maps
# and lists clear inherited values. See README for admin/webhook opt-in.
gateway: {}

# Legacy runtime defaults. Resource names, selectors and image repo stay stable.
inference:
  enabled: false
  # Opt-in after applying the accounting migration. This is product retention,
  # not a member Automation. Non-Helm deployments must supply their own caller.
  # Hourly, like the hosted deployment: each run folds closed request-log hours
  # into usage rollups and deletes the folded rows. One run handles up to
  # maxBucketsPerRun hours x maxSourceRowsPerBucket rows (Gateway limits:
  # 1-1000 and 1-5000); a larger hour finishes over the next runs.
  retention:
    enabled: false
    schedule: "5 * * * *"
    timeZone: "Etc/UTC"
    maxBucketsPerRun: 48
    maxSourceRowsPerBucket: 5000
    adminTokenSecret: ""
    adminTokenKey: "INFERENCE_ADMIN_TOKEN"
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-inference
    tag: ""
  service:
    type: ClusterIP
    port: 8791
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8791
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

migrations:
  # Bootstrap always needs TCP DATABASE_URL from secret.keys/values.databaseUrl,
  # even when config.databaseMode=planetscale (runtime HTTP credentials alone
  # lack the database name needed for the committed-migration phase).
  enabled: true
  hook: true
  # Recovery uses this normal policy in both Secret modes; no retention override.
  # Capture the result DURING the upgrade in a second terminal as the Job appears:
  # kubectl --namespace my-openwork get jobs -w
  # kubectl --namespace my-openwork logs -f job/<name-ending-in-migrate> > recovery.log
  # Keep recovery.log privately. With this default policy, a refused/failed Job
  # stays available with its log until the next upgrade.
  hookDeletePolicy: before-hook-creation,hook-succeeded
  writersStoppedFor0097: false
  backoffLimit: 2
  # Counts from Job creation and includes pulling the den-api image (~800 MB),
  # so it must cover a cold pull on the slowest node. Pass a matching Helm
  # --timeout (default 5m) or the release fails before this deadline.
  activeDeadlineSeconds: 1800
  podAnnotations: {}
  resources: {}
  command:
    - node
  args:
    - /app/ee/packages/den-db/dist/scripts/bootstrap.js

ingress:
  enabled: false
  className: ""
  annotations: {}
  web:
    host: openwork.example.com
    path: /
    pathType: Prefix
  api:
    enabled: true
    host: api.openwork.example.com
    path: /
    pathType: Prefix
  tls: []
