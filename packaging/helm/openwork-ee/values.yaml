nameOverride: ""
fullnameOverride: ""

# Kubernetes namespace where every namespaced resource (Deployments, Services,
# ConfigMap, Secret, Ingress, migration Job, ...) is deployed. The chart sets
# metadata.namespace explicitly so `helm template | kubectl apply` pipelines do
# not fall back to the kubectl context namespace (e.g. kube-system). When using
# `helm install`, keep this aligned with `--namespace` / the release namespace.
namespace: openwork

# Render a Namespace object for the namespace above, so GitOps flows (ArgoCD
# runs helm template and does not create namespaces unless CreateNamespace=true)
# manage it as a resource from git. Set false only when the platform team
# provisions namespaces out of band.
createNamespace: true

image:
  # Blank pins every image to the chart appVersion, which the publish workflow
  # stamps with the release version, so `--version X` deploys the X images.
  # Set a tag only to deviate from the chart version (for example a repository
  # checkout, whose appVersion is a placeholder, or a mirrored image).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  databaseMode: mysql
  openworkDevMode: "0"
  # Passed to the den-api Node.js process as NODE_OPTIONS at container startup.
  denApiNodeOptions: ""
  tenancy:
    mode: single_org
    singleOrgName: OpenWork
    singleOrgSlug: default
    ownerEmails: ""
    allowPublicSignup: "false"
    requireEmailVerification: "false"
  auth:
    passwordBreachScreeningEnabled: "false"
  githubConnector:
    appId: ""
    clientId: ""
  public:
    # Single public Den web origin. The chart passes this as DEN_BASE_URL; den-api
    # derives Better Auth, CORS/trusted origins, web-app hosts, API defaults, and
    # MCP resource defaults from it unless the compatibility overrides below are set.
    webOrigin: https://openwork.example.com
    # Compatibility overrides for split-origin or migration deployments.
    apiOrigin: ""
    mcpResourceUrl: ""
    mcpAdditionalResources: ""
    # Leave blank to keep External MCP URL SSRF protection enabled.
    # Set "1" only for trusted private-network MCP servers.
    allowPrivateMcpUrls: ""
    mcpClaimNamespace: ""
    desktopDenBaseUrl: ""
    corsOrigins: ""
    betterAuthCookieDomain: ""
    betterAuthTrustedOrigins: ""
    webAppHosts: ""
    bootstrapAdminEmails: ""
    installLinksGatingEnabled: "false"
    # Self-hosted Automations are opt-in. Hosted OpenWork Cloud enables them.
    automationsEnabled: "false"
    # Self-hosted Dashboards are opt-in. Hosted environments use the same Den flag.
    dashboardsEnabled: "false"
    # OpenWork Web is hosted-only by default. OpenWork Cloud enables it explicitly.
    openworkWebEnabled: "false"
    # Preserve the Den runtime for published legacy Desktops during upgrades.
    # Set false only after every Desktop is v0.18.35+ to hard-disable Automations.
    automationsRuntimeEnabled: "true"
    # Enable only after compatible Desktop MCP Apps hosts are deployed.
    generatedArtifactViewsEnabled: "false"
    connectLinkMode: exchange
    connectLinkKeyId: ""
    openworkAppConnectUrl: ""
    openworkWebUrl: ""
    installerReleaseTag: ""
    installerReleaseRepo: ""
    authCallbackUrl: https://openwork.example.com
  internal:
    apiBaseUrl: ""
    authFallbackBaseUrl: ""
    inferenceProxyBaseUrl: ""
  provisioner:
    mode: stub
    reconcileIntervalMs: "60000"
    reconcileStaleMs: "1200000"
    reconcileBatchSize: "10"
    workerUrlTemplate: ""
  daytona:
    apiUrl: ""
    target: ""
    snapshot: ""
    sandboxImage: ""
    sandboxCpu: ""
    sandboxMemory: ""
    sandboxDisk: ""
    sandboxPublic: ""
    sandboxAutoStopInterval: ""
    sandboxAutoArchiveInterval: ""
    sandboxAutoDeleteInterval: ""
    signedPreviewExpiresSeconds: "86400"
    sandboxNamePrefix: ""
    sharedVolumeName: ""
    volumeNamePrefix: ""
    workspaceMountPath: ""
    dataMountPath: ""
    runtimeWorkspacePath: ""
    runtimeDataPath: ""
    sidecarDir: ""
    openworkPort: ""
    opencodePort: ""
    createTimeoutSeconds: ""
    deleteTimeoutSeconds: ""
    healthcheckTimeoutMs: ""
  polar:
    featureGateEnabled: "false"
    apiBase: ""
    productId: ""
    benefitId: ""
    successUrl: ""
    returnUrl: ""
  inference:
    openRouterWorkspaceId: ""
    stripeInferencePriceId: ""
    openRouterUpstreamUrl: ""
    creditsPerDollar: ""
  web:
    posthogKey: ""
    posthogHost: ""

observability:
  backend: none
  serviceNames:
    denApi: den-api
    denWeb: den-web
  otel:
    endpoint: ""
    tracesEndpoint: ""
    metricsEndpoint: ""
    logsEndpoint: ""
    protocol: http/protobuf
    exporters:
      traces: otlp
      metrics: otlp
      logs: otlp
    tracesSampler: parentbased_always_on
    tracesSamplerArg: ""
    headers:
      existingSecret: ""
      key: OTEL_EXPORTER_OTLP_HEADERS
  sentry:
    dsn: ""
    dsnSecret:
      existingSecret: ""
      key: SENTRY_DSN
    tracesSampleRate: "0.01"
    environment: ""
    release: ""
    dist: ""

customCa:
  enabled: false
  existingSecret: ""
  existingConfigMap: ""
  key: ca.crt

redis:
  # Prefer rediss:// DATABASE_REDIS_URL values. Set this to true only for
  # trusted private, non-public Redis endpoints that do not support TLS, such as
  # some managed internal Redis URLs exposed by hosting platforms.
  allowInsecureInternal: false

secret:
  # How this deployment manages secrets. One of:
  #   inline:         the chart renders a v1/Secret from secret.values.
  #                   Local evaluation only — the values live wherever this
  #                   values file lives, so never commit real credentials.
  #   existingSecret: workloads consume a pre-created Secret named by
  #                   secret.existingSecret; the chart renders nothing.
  #   externalSecrets: the chart renders an ExternalSecret (ESO) that
  #                   materializes the workload Secret from an external provider
  #                   — the GitOps/ArgoCD-safe path; git holds only store
  #                   references and remote key paths.
  secretsMode: inline
  # Must be true when secretsMode: inline and false in every other mode; the
  # render fails otherwise. Exception: legacy values files upgraded from
  # before secretsMode that set create: false with the untouched placeholder
  # values below are auto-corrected to existingSecret mode (using the
  # chart-created secret name when existingSecret is blank) — real values with
  # create: false still fail the render.
  create: true
  # REQUIRED when secretsMode: existingSecret — must be populated, not blank
  # or empty (the render fails otherwise). Must stay empty in other modes.
  existingSecret: ""
  keys:
    databaseUrl: DATABASE_URL
    databaseRedisUrl: DATABASE_REDIS_URL
    betterAuthSecret: BETTER_AUTH_SECRET
    denDbEncryptionKey: DEN_DB_ENCRYPTION_KEY
    daytonaApiKey: DAYTONA_API_KEY
    polarAccessToken: POLAR_ACCESS_TOKEN
    openRouterManagementApiKey: OPENROUTER_MANAGEMENT_API_KEY
    inferenceAdminToken: INFERENCE_ADMIN_TOKEN
    inferenceWebhookSecret: INFERENCE_WEBHOOK_SECRET
    emailFrom: EMAIL_FROM
    smtpHost: SMTP_HOST
    smtpPort: SMTP_PORT
    smtpUser: SMTP_USER
    smtpPass: SMTP_PASS
    smtpSecure: SMTP_SECURE
    githubConnectorAppClientSecret: GITHUB_CONNECTOR_APP_CLIENT_SECRET
    githubConnectorAppPrivateKey: GITHUB_CONNECTOR_APP_PRIVATE_KEY
    githubConnectorAppWebhookSecret: GITHUB_CONNECTOR_APP_WEBHOOK_SECRET
    connectLinkPrivateKey: DEN_CONNECT_LINK_PRIVATE_KEY
    initialAdminBootstrapCode: DEN_INITIAL_ADMIN_BOOTSTRAP_CODE
  # Used ONLY when secretsMode: inline; ignored otherwise. REQUIRED then:
  # databaseUrl, betterAuthSecret, denDbEncryptionKey (the workloads cannot
  # start without them). Never commit real credentials here — use
  # externalSecrets mode for anything beyond local evaluation.
  values:
    databaseUrl: mysql://openwork:change-me@mysql:3306/openwork_den
    databaseRedisUrl: ""
    betterAuthSecret: CHANGE_ME_32_CHARS_MINIMUM_BETTER_AUTH
    denDbEncryptionKey: CHANGE_ME_32_CHARS_MINIMUM_DB_ENCRYPTION
    daytonaApiKey: ""
    polarAccessToken: ""
    openRouterManagementApiKey: ""
    inferenceAdminToken: ""
    inferenceWebhookSecret: ""
    emailFrom: ""
    smtpHost: ""
    smtpPort: "587"
    smtpUser: ""
    smtpPass: ""
    smtpSecure: "false"
    githubConnectorAppClientSecret: ""
    githubConnectorAppPrivateKey: ""
    githubConnectorAppWebhookSecret: ""
    connectLinkPrivateKey: ""
    initialAdminBootstrapCode: ""

# External Secrets Operator (ESO) configuration. Active only when
# secretsMode: externalSecrets; the chart renders an ExternalSecret that
# materializes the workload Secret from the provider. Requires ESO and a
# SecretStore/ClusterSecretStore on the destination cluster.
externalSecrets:
  # ATTENTION: the three boot-critical keys (DATABASE_URL, BETTER_AUTH_SECRET,
  # DEN_DB_ENCRYPTION_KEY) and every key you list under optionalKeys must exist
  # in your provider under pathPrefix — the chart pulls each rendered key by
  # name from <pathPrefix>/<KEY_NAME> and a missing rendered key fails the
  # ExternalSecret. Keys you neither need nor list are not pulled.
  # How often ESO re-syncs the Secret from the provider.
  refreshInterval: 1h
  # Store holding the remote keys. For AWS Secrets Manager the store's
  # spec.provider.aws is configured on the (Cluster)SecretStore itself; the
  # chart only references it by name.
  secretStoreRef:
    # REQUIRED when secretsMode: externalSecrets — must be populated, not
    # blank or empty (the render fails otherwise), and must match the name of
    # your SecretStore/ClusterSecretStore. Without it ESO has no provider to
    # read from.
    name: "external-secrets"
    kind: ClusterSecretStore
  target:
    # Owner deletes the Secret with the ExternalSecret; Merge keeps it.
    creationPolicy: Owner
    # Retain keeps the Secret if the ExternalSecret is deleted.
    deletionPolicy: Retain
  # Remote path trunk: keys are pulled from <pathPrefix>/<KEY_NAME>. The chart
  # renders spec.data for the three boot-critical keys (DATABASE_URL,
  # BETTER_AUTH_SECRET, DEN_DB_ENCRYPTION_KEY) plus the entries explicitly
  # selected in optionalKeys. The optional list is opt-in and maintained by
  # hand — if a future feature starts consuming a new secret key, add its
  # secret.keys.* name to optionalKeys and create the provider entry.
  # REQUIRED when secretsMode: externalSecrets (render fails if blank).
  # Example (AWS Secrets Manager): pathPrefix: "eks/openwork/prod/den"
  pathPrefix: ""
  # Optional keys to also pull from the provider. Entries are secret.keys
  # property names (camelCase, e.g. smtpPass, databaseRedisUrl); the provider
  # path and target Secret key use the corresponding value (SMTP_PASS).
  # Only listed keys get a spec.data entry — ESO's remoteRef has no "skip if
  # missing", so keys you do not list here need not exist in the provider and
  # simply do not land in the Secret.
  optionalKeys: []
  # Seconds the workload init container waits for an optional key to appear in
  # the materialized Secret before starting without it. envFrom snapshots keys
  # at pod start, so a pod that boots before ESO reconciles a newly added
  # optional key would otherwise hold a stale environment until its next
  # restart. Required keys always block indefinitely. Set 0 to skip waiting
  # for optional keys entirely.
  optionalKeyWaitSeconds: 60
  # Strategy fields applied uniformly to every pulled key (ESO defaults,
  # matching the external-secrets.io/v1 schema).
  conversionStrategy: Default
  decodingStrategy: None
  metadataPolicy: None

installerArtifacts:
  enabled: false
  existingClaim: ""
  hostPath: ""
  mountPath: /var/lib/openwork/installer-artifacts

denApi:
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-den-api
    tag: ""
  service:
    type: ClusterIP
    port: 8788
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8788
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

denWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-den-web
    tag: ""
  service:
    type: ClusterIP
    port: 3005
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 3005
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 10
      failureThreshold: 18

inference:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-inference
    tag: ""
  service:
    type: ClusterIP
    port: 8791
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8791
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

migrations:
  enabled: true
  hook: true
  hookDeletePolicy: before-hook-creation,hook-succeeded
  backoffLimit: 2
  # Counts from Job creation and includes pulling the den-api image (~800 MB),
  # so it must cover a cold pull on the slowest node. Pass a matching Helm
  # --timeout (default 5m) or the release fails before this deadline.
  activeDeadlineSeconds: 1800
  podAnnotations: {}
  resources: {}
  # Pinned kubectl image for the wait-for-secret init container (non-inline
  # secretsModes). Keep this at a specific patch version (or digest); avoid
  # floating tags so installs are reproducible.
  kubectlImage:
    repository: bitnami/kubectl
    tag: "1.33.4"
  command:
    - node
  args:
    - /app/ee/packages/den-db/dist/scripts/bootstrap.js

ingress:
  enabled: false
  className: ""
  annotations: {}
  web:
    host: openwork.example.com
    path: /
    pathType: Prefix
  api:
    enabled: true
    host: api.openwork.example.com
    path: /
    pathType: Prefix
  tls: []
