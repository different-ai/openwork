nameOverride: ""
fullnameOverride: ""

image:
  # Blank pins every image to the chart appVersion, which the publish workflow
  # stamps with the release version, so `--version X` deploys the X images.
  # Set a tag only to deviate from the chart version (for example a repository
  # checkout, whose appVersion is a placeholder, or a mirrored image).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  databaseMode: mysql
  openworkDevMode: "0"
  # Passed to the den-api Node.js process as NODE_OPTIONS at container startup.
  denApiNodeOptions: ""
  # Which product this install is. Only OpenWork Cloud sets "cloud"; features
  # declared unavailable for self-hosted cannot be turned on here. Renders DEN_DEPLOYMENT.
  deployment: self_hosted
  # BEGIN GENERATED features (pnpm features:sync; source: packages/features/src/registry.ts)
  # Operator locks for this install. Each key renders DEN_FEATURE_<KEY>.
  #   ""      follow /admin: on or off for everyone, plus per-organization overrides
  #   "true"  on for everyone; /admin shows "Set by deployment config"
  #   "false" off for everyone; /admin shows "Set by deployment config"
  # The /admin kill switch still turns a feature off, even when locked on.
  features:
    googleDocumentTools: ""        # default off · Connected assistants inspect document tabs and headings, read or search bounded passages, and replace text against the revision they read.
    offlineRecovery: ""            # default off · Show compact App connection failures and a discreet offline indicator in OpenCode v2 conversations.
    rememberLastOrganization: ""   # default off · Return to the last organization used by the same account on this server after signing in again. Invite and installation links keep their selected organization.
    secureSecretFields: ""         # default off · When an agent sets up a connection, plugin or AI Gateway provider that needs keys, people enter them in private fields in the chat and the agent continues once they are saved. Key fields across OpenWork and OpenWork Cloud can be shown while typing and show saved keys as Replace rows.
    memberListToolbars: ""         # default off · Filter members, teams and roles beside their add action, with compact member rows and secondary actions in the list menu.
    appBuildProgress: ""           # default off · While an agent creates or changes an MCP App, the chat shows each stage it goes through (finding and checking tools, writing the App, building and verifying it) as a checklist with a progress bar.
    modelsAnalyticsUi: ""          # default off · Organization admins can view Models & usage analytics and shared model usage limits. Deprecated 2026-10-14: UI hidden behind modelsAnalyticsUi (default off). Most likely delete within 4 weeks (by 2026-11-11) unless an org depends on it.
    taskAnalyticsUi: ""            # default off · Members with analytics access can view task activity and consumption, and admins can configure analytics integrations. Deprecated 2026-10-14: UI hidden behind taskAnalyticsUi (default off). Most likely delete within 4 weeks (by 2026-11-11) unless an org depends on it.
    desktopPolicyScreenRemoval: "" # default off · Manage prompt suggestions in Everyone and team Desktop tabs instead of Advanced Desktop policies. Requires team page tabs; turning off restores the policy screens without changing stored policies.
    teamMembershipCache: ""        # default off · Reduce repeated team lookups while keeping access changes immediate. Enable only after every API instance runs revision-aware team writes.
    managedDeploymentsGcp: ""      # default off (cloud only) · Organization admins approve OpenWork installations in their own Google Cloud project and track health and updates.
    managedDeploymentsMcp: ""      # default off (cloud only) · Agents connected to OpenWork can check deployment readiness, create deployments, prepare the cloud approval link or command, and follow progress until the deployment is ready.
    managedDeployments: ""         # default off (cloud only) · Organization admins install OpenWork in their own cloud account (AWS first) and see its health and updates in OpenWork.
    slackAssistant: ""             # default off · Answers Slack mentions and DMs for the organization after the Slack connector is set up.
    slackWorkbotReplies: ""        # default off · OpenWork in Slack writes its reply as it works, reacts to messages with an emoji, and takes bigger jobs into the background, posting the result in the thread when done.
    workbot: ""                    # default off · Members can use Workbot, with side chats, a Calendar tab of its scheduled work and the option to run stopped tasks again, and organization admins choose the default model Workbot, the Slack assistant and cloud Automations answer with. Needs the deployment's Workbot app.
    workbotDocuments: ""           # default off · Members browse recent Google Drive files and folders in Workbot, open documents in tabs, and save supported text and spreadsheet edits to Drive.
    workbotWorkspaceAssistant: ""  # default off · Members ask Workbot about the document or calendar view they have open, chat without leaving their work, and navigate from a compact sidebar.
    automationCalendar: ""         # default off · Members see a Calendar in the desktop app with their Automations next to meetings from their connected Google or Outlook calendar.
    permissions: ""                # default off · Organization admins choose what members, admins and each team can do, instead of the fixed Member and Admin defaults.
    teamRoles: ""                  # default off · Members › Teams shows each team's role (Member, Admin or Custom) with one Change role action, and Members gets a Roles tab to see and create roles.
    sharedRoles: ""                # default off · A custom role can be given to more than one team: Change role lists every role, each role's page lists its teams, and a role can be created before any team has it. Needs Team roles and Permissions.
    agentPermissions: ""           # default off · Organization admins choose what agents can do on members' computers: run commands, edit files, open websites and use local skills and MCP servers, for everyone or per team.
    engineV2Upgrade: ""            # default off · Desktop members still on OpenCode v1 see a short notice offering to upgrade: their chats are copied to v2 with a backup, then OpenWork switches engines.
    remoteSessionEvents: ""        # default off · MCP clients can subscribe to changes in their remote session receipts and read the current state after reconnecting.
    backgroundShellTasks: ""       # default off · The desktop chat shows how many commands the agent left running in the background, and adds a short row when each one finishes.
    orgDefaultModel: ""            # default off · Organization admins choose the model new desktop chats start with, for everyone or per team. Applies to the OpenCode v2 engine only; members can still change the model in each chat.
    gatewayProviderUsageLimits: "" # default off · Admins can attach a spend limit to one AI provider. Spend on that provider counts toward its own limit instead of the default limit, and members see which provider ran out.
    teamAccessRows: ""             # default off · Team plugin access shows compact rows with clear access sources and a confirmation before revoking a team grant.
    teamPageTabs: ""               # default off · Each team's page, and Everyone's, gets a Browser tab for the pages agents and the built-in browser can open, and a Models tab with the AI providers the team can use, its spend limits and its default model.
    computerUse: ""                # default off · Let agents use Mac apps or a managed cloud desktop directly, with a live view and Take over and Stop controls. Enabling this rollout provides access without chat or window consent prompts. GUI access is experimental and is not sandboxed by structured-tool permission rules.
    browserFloatingView: ""        # default off · The built-in browser can float as a small live card over the chat, sit beside it, or fill the window, with a Browser button in the chat header that shows when it needs the person.
    remoteComputers: ""            # default off · Use a Linux cloud computer with its browser and desktop in OpenWork Web, or connect a VM from Desktop. Access starts directly when the rollout is enabled; Take over and Stop stay available.
    inviteLinkVerifiesEmail: ""    # default off · Creating an account from an invitation link, emailed or shared by an admin, counts as verifying that email, so the invited person joins without entering an emailed code.
    remoteSessionSubagents: ""     # default off · A task the agent starts on the cloud or another computer shows in the chat like a sub-agent: whether it is working, needs an answer or finished, and its conversation, which people can open, follow up on and stop.
  # END GENERATED features
  tenancy:
    mode: single_org
    singleOrgName: OpenWork
    singleOrgSlug: default
    ownerEmails: ""
    allowPublicSignup: "false"
    requireEmailVerification: "false"
  audit:
    # Grant availability without a Cloud plan. Never turns org capture on by itself.
    selfHostedEnabled: "false"
    # Rollout gates; org admins separately control capture on their initialized policy.
    # Default-on deployment switches; explicit false disables globally.
    # Also requires the auditLogs feature per org (/admin or config.features) plus entitlement.
    # Ready orgs auto-provision 6M retained operations, capture ON, no cap enforcement.
    # Existing policy values and explicit capture OFF choices are preserved.
    captureEnabled: "true"
    visibilityEnabled: "true"
  auth:
    passwordBreachScreeningEnabled: "false"
  githubConnector:
    appId: ""
    clientId: ""
  public:
    # Required, explicit desktop-reachable HTTPS origin when gateway.enabled=true.
    gatewayPublicBaseUrl: ""
    # Single public Den web origin. The chart passes this as DEN_BASE_URL; den-api
    # derives Better Auth, CORS/trusted origins, web-app hosts, API defaults, and
    # MCP resource defaults from it unless the compatibility overrides below are set.
    webOrigin: https://openwork.example.com
    # Compatibility overrides for split-origin or migration deployments.
    apiOrigin: ""
    mcpResourceUrl: ""
    mcpAdditionalResources: ""
    # Leave blank to keep External MCP URL SSRF protection enabled.
    # Set "1" only for trusted private-network MCP servers.
    allowPrivateMcpUrls: ""
    mcpClaimNamespace: ""
    desktopDenBaseUrl: ""
    corsOrigins: ""
    betterAuthCookieDomain: ""
    betterAuthTrustedOrigins: ""
    webAppHosts: ""
    bootstrapAdminEmails: ""
    # Self-hosted Automations are opt-in. Hosted OpenWork Cloud enables them.
    automationsEnabled: "false"
    # Self-hosted Dashboards are opt-in. Hosted environments use the same Den flag.
    dashboardsEnabled: "false"
    # OpenWork Web is hosted-only by default. OpenWork Cloud enables it explicitly.
    openworkWebEnabled: "false"
    # Preserve the Den runtime for published legacy Desktops during upgrades.
    # Set false only after every Desktop is v0.18.35+ to hard-disable Automations.
    automationsRuntimeEnabled: "true"
    # Enable only after compatible Desktop MCP Apps hosts are deployed.
    generatedArtifactViewsEnabled: "false"
    appMcpServersEnabled: "true"
    openworkWebUrl: ""
    installerReleaseTag: ""
    installerReleaseRepo: ""
    authCallbackUrl: https://openwork.example.com
  internal:
    # gatewayProxyBaseUrl is intentionally absent: when present (even ""), it
    # overrides inferenceProxyBaseUrl. Gateway opt-in requires an explicit origin.
    apiBaseUrl: ""
    authFallbackBaseUrl: ""
    inferenceProxyBaseUrl: ""
  provisioner:
    mode: stub
    reconcileIntervalMs: "60000"
    reconcileStaleMs: "1200000"
    reconcileBatchSize: "10"
    workerUrlTemplate: ""
  daytona:
    apiUrl: ""
    target: ""
    snapshot: ""
    sandboxClass: "container"
    sandboxImage: ""
    sandboxCpu: ""
    sandboxMemory: ""
    sandboxDisk: ""
    sandboxPublic: ""
    sandboxAutoStopInterval: ""
    sandboxAutoPauseInterval: "5"
    sandboxAutoArchiveInterval: ""
    sandboxAutoDeleteInterval: ""
    signedPreviewExpiresSeconds: "86400"
    sandboxNamePrefix: ""
    sharedVolumeName: ""
    volumeNamePrefix: ""
    workspaceMountPath: ""
    dataMountPath: ""
    runtimeWorkspacePath: ""
    runtimeDataPath: ""
    sidecarDir: ""
    openworkPort: ""
    opencodePort: ""
    createTimeoutSeconds: ""
    deleteTimeoutSeconds: ""
    healthcheckTimeoutMs: ""
  inference:
    openRouterWorkspaceId: ""
    stripeInferencePriceId: ""
    openRouterUpstreamUrl: ""
    creditsPerDollar: ""
  web:
    posthogKey: ""
    posthogHost: ""

observability:
  backend: none
  serviceNames:
    denApi: den-api
    denWeb: den-web
  otel:
    endpoint: ""
    tracesEndpoint: ""
    metricsEndpoint: ""
    logsEndpoint: ""
    protocol: http/protobuf
    exporters:
      traces: otlp
      metrics: otlp
      logs: otlp
    tracesSampler: parentbased_always_on
    tracesSamplerArg: ""
    headers:
      existingSecret: ""
      key: OTEL_EXPORTER_OTLP_HEADERS
  sentry:
    dsn: ""
    dsnSecret:
      existingSecret: ""
      key: SENTRY_DSN
    tracesSampleRate: "0.01"
    environment: ""
    release: ""
    dist: ""

customCa:
  enabled: false
  existingSecret: ""
  existingConfigMap: ""
  key: ca.crt

redis:
  # Prefer rediss:// DATABASE_REDIS_URL values. Set this to true only for
  # trusted private, non-public Redis endpoints that do not support TLS, such as
  # some managed internal Redis URLs exposed by hosting platforms.
  allowInsecureInternal: false

secret:
  create: true
  existingSecret: ""
  keys:
    databaseUrl: DATABASE_URL
    databaseHost: DATABASE_HOST
    databaseUsername: DATABASE_USERNAME
    databasePassword: DATABASE_PASSWORD
    databaseRedisUrl: DATABASE_REDIS_URL
    betterAuthSecret: BETTER_AUTH_SECRET
    denDbEncryptionKey: DEN_DB_ENCRYPTION_KEY
    daytonaApiKey: DAYTONA_API_KEY
    openRouterManagementApiKey: OPENROUTER_MANAGEMENT_API_KEY
    inferenceAdminToken: INFERENCE_ADMIN_TOKEN
    inferenceWebhookSecret: INFERENCE_WEBHOOK_SECRET
    emailFrom: EMAIL_FROM
    smtpHost: SMTP_HOST
    smtpPort: SMTP_PORT
    smtpUser: SMTP_USER
    smtpPass: SMTP_PASS
    smtpSecure: SMTP_SECURE
    githubConnectorAppClientSecret: GITHUB_CONNECTOR_APP_CLIENT_SECRET
    githubConnectorAppPrivateKey: GITHUB_CONNECTOR_APP_PRIVATE_KEY
    githubConnectorAppWebhookSecret: GITHUB_CONNECTOR_APP_WEBHOOK_SECRET
    initialAdminBootstrapCode: DEN_INITIAL_ADMIN_BOOTSTRAP_CODE
    maintenanceToken: DEN_MAINTENANCE_TOKEN
  values:
    databaseUrl: mysql://openwork:change-me@mysql:3306/openwork_den
    databaseHost: ""
    databaseUsername: ""
    databasePassword: ""
    databaseRedisUrl: ""
    betterAuthSecret: CHANGE_ME_32_CHARS_MINIMUM_BETTER_AUTH
    denDbEncryptionKey: CHANGE_ME_32_CHARS_MINIMUM_DB_ENCRYPTION
    daytonaApiKey: ""
    openRouterManagementApiKey: ""
    inferenceAdminToken: ""
    inferenceWebhookSecret: ""
    emailFrom: ""
    smtpHost: ""
    smtpPort: "587"
    smtpUser: ""
    smtpPass: ""
    smtpSecure: "false"
    githubConnectorAppClientSecret: ""
    githubConnectorAppPrivateKey: ""
    githubConnectorAppWebhookSecret: ""
    initialAdminBootstrapCode: ""
    # 24+ characters. Only rendered when set; used by denApi.auditUsage.
    maintenanceToken: ""

installerArtifacts:
  enabled: false
  existingClaim: ""
  hostPath: ""
  mountPath: /var/lib/openwork/installer-artifacts

denApi:
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-den-api
    tag: ""
  service:
    type: ClusterIP
    port: 8788
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8788
  # Daily audit usage refresh. Audit writes never update an organization's usage
  # totals (retained operations, events, bytes); this CronJob recomputes them by
  # calling den-api POST /internal/audit/usage/refresh. Same pattern as
  # inference.retention. Needs a maintenance token: set secret.values.maintenanceToken,
  # or tokenSecret/tokenKey to read it from your own Secret. The token is also given
  # to den-api as DEN_MAINTENANCE_TOKEN. Without it, audit usage keeps its last totals.
  auditUsage:
    enabled: false
    schedule: "30 3 * * *"
    timeZone: "Etc/UTC"
    tokenSecret: ""
    tokenKey: DEN_MAINTENANCE_TOKEN
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

denWeb:
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-den-web
    tag: ""
  service:
    type: ClusterIP
    port: 3005
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 3005
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 60
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 20
      periodSeconds: 5
      timeoutSeconds: 10
      failureThreshold: 18

# Sparse canonical overrides. Do not add defaults here: they would mask legacy
# inference values. Only explicit enabled: true advertises the Gateway capability.
# Same structural keys as inference; nonempty maps merge recursively, empty maps
# and lists clear inherited values. See README for admin/webhook opt-in.
gateway: {}

# Legacy runtime defaults. Resource names, selectors and image repo stay stable.
inference:
  enabled: false
  # Opt-in after applying the accounting migration. This is product retention,
  # not a member Automation. Non-Helm deployments must supply their own caller.
  # Hourly, like the hosted deployment: each run folds closed request-log hours
  # into usage rollups and deletes the folded rows. One run handles up to
  # maxBucketsPerRun hours x maxSourceRowsPerBucket rows (Gateway limits:
  # 1-1000 and 1-5000); a larger hour finishes over the next runs.
  retention:
    enabled: false
    schedule: "5 * * * *"
    timeZone: "Etc/UTC"
    maxBucketsPerRun: 48
    maxSourceRowsPerBucket: 5000
    adminTokenSecret: ""
    adminTokenKey: "INFERENCE_ADMIN_TOKEN"
  replicaCount: 1
  image:
    repository: ghcr.io/different-ai/openwork-inference
    tag: ""
  service:
    type: ClusterIP
    port: 8791
    annotations: {}
    loadBalancerClass: ""
    loadBalancerSourceRanges: []
  containerPort: 8791
  env: {}
  podAnnotations: {}
  podLabels: {}
  resources: {}
  probes:
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 12

migrations:
  # Bootstrap always needs TCP DATABASE_URL from secret.keys/values.databaseUrl,
  # even when config.databaseMode=planetscale (runtime HTTP credentials alone
  # lack the database name needed for the committed-migration phase).
  enabled: true
  hook: true
  hookDeletePolicy: before-hook-creation,hook-succeeded
  writersStoppedFor0097: false
  backoffLimit: 2
  # Counts from Job creation and includes pulling the den-api image (~800 MB),
  # so it must cover a cold pull on the slowest node. Pass a matching Helm
  # --timeout (default 5m) or the release fails before this deadline.
  activeDeadlineSeconds: 1800
  podAnnotations: {}
  resources: {}
  command:
    - node
  args:
    - /app/ee/packages/den-db/dist/scripts/bootstrap.js

ingress:
  enabled: false
  className: ""
  annotations: {}
  web:
    host: openwork.example.com
    path: /
    pathType: Prefix
  api:
    enabled: true
    host: api.openwork.example.com
    path: /
    pathType: Prefix
  tls: []
