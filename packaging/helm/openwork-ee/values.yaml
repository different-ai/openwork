nameOverride: ""
fullnameOverride: ""

image:
  # Blank pins every image to the chart appVersion, which the publish workflow
  # stamps with the release version, so `--version X` deploys the X images.
  # Set a tag only to deviate from the chart version (for example a repository
  # checkout, whose appVersion is a placeholder, or a mirrored image).
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

config:
  databaseMode: mysql
  openworkDevMode: "0"
  # Passed to the den-api Node.js process as NODE_OPTIONS at container startup.
  denApiNodeOptions: ""
  # Which product this install is. Only OpenWork Cloud sets "cloud"; features
  # declared unavailable for self-hosted cannot be turned on here. Renders DEN_DEPLOYMENT.
  deployment: self_hosted
  # BEGIN GENERATED features (pnpm features:sync; source: packages/features/src/registry.ts)
  # Operator locks for this install. Each key renders DEN_FEATURE_<KEY>.
  #   ""      follow /admin: on or off for everyone, plus per-organization overrides
  #   "true"  on for everyone; /admin shows "Set by deployment config"
  #   "false" off for everyone; /admin shows "Set by deployment config"
  # The /admin kill switch still turns a feature off, even when locked on.
  features:
    claudeAgentProvider: ""       # default off · Connect Claude through the Claude Code login on this computer, without an Anthropic API key.
    configBlobs: ""               # default off · Admins export all or part of the organization's configuration as JSON and import it again, here or into another OpenWork. Each import is a change request: it is matched against what exists, reviewed, then applied, and can be reverted. Off: no Config page and no config-blob API.
    webPerMember: ""              # default off · Admins choose which members get OpenWork Web from the Members page, and the organization pays for Web only for them. Members without it can't open a Web computer. Off: every member and pending invitation has Web and is billed for it.
    googleCalendarRecurrence: ""  # default off · Create and change recurring meeting series through the native Google Calendar capabilities.
    googleDrivePdfText: ""        # default off · Agents read the text of PDFs in Google Drive, up to 50 MB, instead of being told the file is too large.
    autoRouter: ""                # default off (cloud only) · Admins create Smart Routers for everyone, teams or people, listing AI Gateway models and the tasks each handles. Members pick "Smart: <name>": each prompt goes to the model whose tasks fit it best, at the thinking level it needs.
    gatewayCustomProviders: ""    # default off · Admins add any OpenAI-compatible provider to AI Gateway with a name, an API URL and one key, pick its models (fetched from the provider and matched to models.dev), test one, then save and edit it later.
    gatewayMemberApiKeys: ""      # default off · Admins allow members, in AI Gateway › API Keys, to create their own AI Gateway API keys and use the Gateway's models from 3rd party tools and harnesses. After creating a key (or from a key's Set up), members pick a tool (Cursor, OpenAI Codex, Claude Code, another tool) and get its steps with their key and models filled in; Cursor reaches every model through /api/v1/cursor. Members manage their keys in Library › Models; admins see and revoke every key on the same tab.
    plainFreeModel: ""            # default off · The free model shows in the model picker under its own name (GPT-6 Luna) with the same row as every other model, stays selectable when its usage limit is used up, and the limit message appears in the chat after sending.
    settledSessions: ""           # default off · A Feed view in the sidebar lists every workspace's sessions, the last one interacted with first. Rows can be dragged into a new order and have an Archive button next to More. Finished work is archived, not settled.
    appToolRepair: ""             # default off · When a connected tool an App uses changes at its provider, so OpenWork blocks the App's call to it, the App's managers see a Fix with agent button in Artifacts that starts a conversation to update the App.
    publicApps: ""                # default off · An App's editor, or their agent, can mark an App that has no tools as public. Anyone can then add its public MCP URL to an MCP client and open it without signing in to OpenWork.
    appSites: ""                  # default off · An App its author made a site also opens as a web page: a browser that opens the App's MCP URL shows the App full page. Signed-in members use its tools there; an App marked public opens for anyone.
    composerBackgroundTasks: ""   # default off · Commands the agent leaves running in the background are listed on top of the composer, under the Agents list, with how long each has run, instead of a count in the chat.
    agentQuestions: ""            # default off · Agents ask in chat instead of ending a turn to wait for your reply. A question that the rest of the work does not depend on stays open while the agent keeps going, and your answer reaches it even after its turn has ended.
    steadyLiveTurn: ""            # default off · While a reply runs, its steps and messages stay in the order they arrive and the chat keeps its place: nothing jumps and no empty gap opens between steps. The steps fold into “Worked for…” once the reply finishes. Turning this off restores the previous live layout.
    ssoPerOrganization: ""        # default off · An organization with SSO set up offers "Continue with SSO" at sign-in but still lets people on its domain use their password or Google and join other organizations, for example from an invitation. Turning on "Require SSO" enforces it when someone opens that organization, and "Restrict this domain to our SSO" brings back sign-in-wide enforcement for the whole domain. Off: any email on the organization's verified domain must sign in with its SSO.
    ssoSettingsOnSsoPage: ""      # default off · The "Require SSO" and "Restrict this domain to our SSO" settings move from Org settings to the top of the SSO page, next to the SSO connection they depend on. Off: they stay in Org settings under Authentication.
    signInEmailSync: ""           # default off · When someone's email changes at Google or at their company's identity provider, their OpenWork account moves to the new email the next time they sign in that way, so signing in with the new email opens the same account instead of creating a second one. Off: the account keeps the email it was created with.
    multipleSsoConnections: ""    # default off · An organization can set up more than one SSO connection: several identity providers, and each one covering one or more email domains. Each connection is verified, tested and turned on by itself, and sign-in shows one button per identity provider. Off: the SSO page manages a single connection.
    featureIntros: ""             # default off · Den pages, sub-pages and tabs explain themselves while nothing is set up: a full-screen intro, info box or banner with one action that leads straight to setup, a quiet dot on tabs not viewed yet, and a ? button to reopen the intro. Turning it off restores the previous empty states.
    authSecuritySettings: ""      # default off · Settings shows one Auth & Security page with Single sign-on (SSO) and User provisioning (SCIM) tabs instead of separate SSO and SCIM pages; old SSO and SCIM links open the matching tab. Turning it off restores the separate pages.
    teamSettingsSidebar: ""       # default off · On Members › Teams, a team's page and Everyone's page list their sections (Role, Members, Access, Agents, Browser, Models, Workbot, Prompts, Desktop) in a grouped sidebar on the left instead of a row of tabs across the top. The Role, Agents and Browser sections get a heading with a tooltip that explains them, and a role that adds nothing says so. Turning it off restores the tabs and the earlier sections.
    sessionSecuritySettings: ""   # default off · Auth & Security gets a General tab where admins choose how long sign-ins last without activity (12 hours to 7 days), how long they last at most however active (1 to 90 days, 30 by default), on the web and in the desktop app, and how recently an admin must have signed in before sensitive changes (15 minutes by default, up to 1 day, or never). Needs Auth & Security settings on. Off: sessions last 7 days without activity with no maximum, and sensitive changes ask admins to sign in again after 2 hours.
    administratorRecovery: ""     # default off · Run a one-time, operator-selected Admin-team permission repair at deployment; disabling stops future repairs, not existing grants.
    superAdminPermissionSet: ""   # default off · Super admins get their permissions from an editable Super admin role, seeded with every permission, beside Member and Admin. Off: super admins hold every permission and the role is hidden.
    nativeDictation: ""           # default off · Dictate editable prompts in OpenWork and Workbot using native desktop dictation or live browser speech recognition.
    connectionMcpServers: ""      # default off · Members can add one connected service, such as Gmail or Linear, to an agent like Claude Code as its own MCP server that lists only that service's tools.
    desktopPersonalConnectors: "" # default off · Members can add a custom MCP server from the desktop app's Library and sign in with their own account, the same way they can from My Library on the web. Without it, the desktop only lets owners and admins finish connector setup.
    opencodeV2Only: ""            # default off · Desktop chats always run on OpenCode v2: switching to OpenCode v1 is turned off and earlier chats are copied to v2 in the background.
    managedDeployments: ""        # default off (cloud only) · Organization admins install OpenWork in their own AWS account or Google Cloud project and see its health and updates in OpenWork, and agents connected to OpenWork can create and follow those deployments.
    workbotDocuments: ""          # default off · Members browse recent Google Drive files and folders in Workbot, open documents in tabs, and save supported text and spreadsheet edits to Drive.
    workbotDocumentEditing: ""    # default off · Members choose Edit from a document preview. Full Office editing starts their Cloud workspace only when requested. Requires Workbot Documents.
    workbotDocumentMedia: ""      # default off · Members play video and audio files from Drive and OneDrive in the document's tab, with seeking, instead of only a link to the original. Requires Workbot Documents.
    workbotWorkspaceAssistant: "" # default off · Members ask Workbot about the document they have open (Ask Workbot brings it into the chat) and navigate from a compact sidebar. Workbot offers to open the documents it mentions. The chat itself stays on its own page.
    workbotDriveFiles: ""         # default off · Workbot reads PDFs, Office files and large files from Google Drive or OneDrive on its computer instead of saying they are too large. When it has no computer (and in Slack) it says plainly when a file is too large and asks the person to send the file instead.
    workbotAccountMenu: ""        # default off · The avatar in Workbot's header opens a menu with the signed-in account and workspace, Switch workspace, Your dashboard and Sign out, instead of only linking to the dashboard.
    workbotBrowserChat: ""        # default off · On wide screens, Workbot's Browser and Computer views keep the conversation docked beside the live page, with the open tab shared as context, so people can direct browser-heavy work without switching back to Home. Narrow screens use the floating chat. Needs browser use.
    workbotInstantOpen: ""        # default off · Workbot keeps the newest messages of each chat on the person's device and shows them the moment a chat opens, while it reads the conversation again. Nothing is kept while a reply is being written; kept messages are cleared on sign-out and after a week.
    workbotScrollToBottom: ""     # default off · People reading earlier messages keep their place while Workbot replies, with a button to return to the latest messages.
    workbotBrowserRecovery: ""    # default off (cloud only) · Retries a read once when a loading page changes, reconnects a lost browser connection, and tells Workbot when a consent dialog or human-verification check is in the way. Never repeats clicks, typing or submissions.
    workbotQuickReply: ""         # default off · Workbot answers work requests with a concise acknowledgment before discovery, reactions or browser work. Accepted explicit long requests can show a temporary receipt while waiting for the first model words. Does not promise a response-time SLA.
    workbotWorkingStatus: ""      # default off · While Workbot works, a quiet status line under its name says what it is doing; tapping the name opens a task sheet with its steps and each background task's steps. The chat keeps only what Workbot says: no typing dots during work, no computer or task cards unless Workbot is showing its screen. Its first reply stands on its own instead of "give me a sec", and it can say how a background task is going.
    workbotCenteredProfile: ""    # default off · A centred OpenWork avatar with Workbot's name and live status in a pill; tapping opens tasks, permissions, computer, schedules and identity. Requires the profile sheet and working status.
    workbotBrowserPreview: ""     # default off · Live browser/computer work offers a passive thumbnail and one Open browser button in the reply, reusing its last real frame while reconnecting. Never automatically opens the full view.
    workbotProfileSheet: ""       # default off · Tapping Workbot's name opens its profile: what it is working on and its background tasks, what it can use (connected apps, browser, computer, files) with a link to manage connections, and what it remembers about the person, read-only.
    workbotRemoteTasks: ""        # default off · Shows recent tasks started on another computer in Workbot's profile and working status, from stored create receipts and member-authorized live status. De-duplicates pure status watchers by explicit task ids; never approves or stops remote work automatically.
    workbotProfileNav: ""         # default off · The left navigation lists only full pages (Chats, Documents, Calendar). Files and Apps, which open beside the chat rather than as pages, move into Workbot's profile as tabs; the logo at the top of the navigation opens that profile. Requires the profile sheet.
    workbotApps: ""               # default off · An App that Workbot builds, changes or opens with OpenWork's App tools shows as a card under its reply, like a file it made, and opens beside the chat as the App itself. Off: the App is made but nothing shows in the chat.
    workbotQuietCalendar: ""      # default off · Calendar where meetings own the week and Workbot's automation runs are small dots at their time instead of chips that fight meetings for space. Each day says how many runs it had; a run that needs the person stands out, and what Workbot did this week opens on demand. Narrow windows and phones get an agenda list.
    workbotProactive: ""          # default off · Every member gets a read-only background agent that checks Gmail and Google Calendar each morning and about every three working hours, sending a short Workbot Slack DM only when needed. Members review checks and messages in My bot, tell it what they care about, narrow its hours and limits, undo changes, snooze or mute it. Admins choose its responsibilities and see aggregate 7-day health in Manage › Workbot, without member names or content. It never sends email, accepts invitations or edits data for them.
    workbotAgentBrief: ""         # default off · With Your agent on, it checks on one rhythm (every 2 hours in working hours by default, plus up to 3 extra checks it asks for) instead of four fixed message types, and follows a plain-text brief: the organization's default plus each member's own lines, set in Manage › Workbot, My bot or chat. Each check researches first and then writes at most a few short messages, each one finding with a lock-screen first sentence. Messages per day and hours stay hard limits.
    workbotAgentCheckGate: ""     # default off (cloud only) · With Your agent's brief on, admins can turn on Skip checks when nothing new arrived in Manage › Workbot. Before a scheduled check, Workbot looks at what reached the member's Gmail and Google Calendar since the agent last looked. With nothing new, or only routine mail, the agent doesn't run for that check. The first check of the day, checks the agent asked for, and a check after two skipped in a row always run.
    workbotAgentSendCheck: ""     # default off (cloud only) · With Your agent's brief on, admins can turn on Check each message before sending in Manage › Workbot. A fast second model then reads each message Your agent wrote against the brief and what the member was already told today, and holds a message the brief says to skip or that repeats one from today. It never writes, changes or adds a message, and when it can't answer the message is sent as before.
    workbotSlackAnswerReply: ""   # default off · In Slack, Workbot's notes while it works ("Let me check your calendar.") stay in one message that updates in place, and its final answer is posted as a new reply that notifies the person, written in its own words. Replaces the fixed "Done:" ping that quoted the first line of the reply.
    workbotSettingsTabs: ""       # default off · Workbot's settings are split into three tabs, General, Agents and Data sources, instead of one long page: in Manage › Workbot and on the Workbot section of a team's page and Everyone's page. With Your agent's brief on, the Agents tab groups its rows (Messages, Schedule), uses switches for yes or no choices and explains each row in a tooltip. Turning it off restores the single page and its rows.
    workbotStepLimit: ""          # default off · Admins choose in Manage › Workbot how many steps Workbot may take on one request before it stops and asks for a smaller piece: the deployment's default, a number, or no limit. Applies to each member's chats from their next message.
    workbotTeamSettings: ""       # default off · Admins can give a team its own Workbot default model and its own Workbot name, and turn Workbot on or off for everyone or for a team; teams without their own use the organization's. A member on several teams whose settings differ gets the organization's.
    workbotUsageAnalytics: ""     # default off · Admins see what Workbot spent on models over the last 30 days in Analytics › Workbot: the total, per day, per person, per model, and split between chats, members' agents, and Slack and automations.
    browserUploadPermissions: ""  # default off · Admins set Allow, Ask first or Block for browser uploads, with website exceptions. Members can remember permission for one website and a folder on this computer across chats and Slack-started tasks, and revoke it in Settings.
    agentHarnessPermissions: ""   # default off · Admins choose Allow, Ask first or Block for computer use, Mac app scripting and folders outside the workspace on the Agents tab, and members' desktop apps apply them.
    computerUse: ""               # default off · Let agents use Mac apps or a managed cloud desktop with a live view and Take over and Stop controls. On Mac, supported app windows stay in the background without moving your cursor; agents read controls first and take screenshots only when needed. Canvas apps such as Blender still come to the front. Requested apps open without additional OpenWork approval prompts. GUI access is experimental and is not sandboxed by structured-tool permission rules.
    computerSessionHistory: ""    # default off · Computer actions share one compact session card in chat, with captured views to browse or replay. Turning it off restores individual actions and screenshots.
    parallelComputerUse: ""       # default off · On a Mac, agents a chat starts work in their own apps at the same time, as part of that chat: one Stop, Take over and output folder for all of them, a cursor name and color for each, and their windows in view while you watch the chat. Turning it off returns each agent to working on its own.
    browserUse: ""                # default off · Workbot uses the browser on its cloud computer with a live Browser view people can watch and take over. It streams the page only when it changes, with Workbot tabs to switch and close; takeover controls the page without Chrome's toolbar. Needs remote computers. Computer use separately controls other desktop apps.
    browserDemonstrations: ""     # default off · Demonstrate a browser task with explanations, save it as a private reusable skill, and run it with new inputs.
    remoteComputers: ""           # default off · Use a Linux cloud computer with its browser and desktop in OpenWork Web, or connect a VM from Desktop. Configured and conversation-owned desktops open directly when enabled, including follow-ups and internal session renewal. Take over and Stop stay available.
    remoteSessionPush: ""         # default off · A task sent to this person's desktop from another computer, Workbot or an agent starts within a second or two instead of up to a minute later. Den tells the desktop the moment the task is queued over the runner's event stream; the desktop still checks every minute as a fallback.
    sandboxGateway: ""            # default off · Workbot's cloud computers for this organization run through the runner's sandbox gateway (Differently), which holds the provider keys and picks the provider, instead of the runner's own Freestyle or Daytona account. Needs a runner with SANDBOX_GATEWAY set; without one, or while it is down, new computers use the runner's own provider.
    sandboxMicrosoft365: ""       # default off (cloud only) · New sandbox organizations get one Microsoft 365 connector for the sample Outlook, Calendar and Drive instead of three separate ones, so Workbot chat, Calendar, Documents and the first hello read each person's own sample mail, calendar and files. Each person approves once in their own browser. Only sandbox organizations are affected; every other organization keeps Microsoft's real sign-in. Turning it off stops the sample connector without sending anything to Microsoft.
    connectStandardTools: ""      # default off · Claude Code and standalone OpenCode discover connected actions, Workflows and Apps as individual tools; OpenWork Desktop, Web and automation runs keep capability search. Capability search uses MCP tool schemas with older fields kept for compatibility. Turning this off restores the previous search view and schemas.
    connectEngineTools: ""        # default off · OpenWork Desktop, Web and automation runs get each connected action, Workflow and App as its own tool, found with their engine's Code Mode search; capability search stays for OpenWork's own operations and skills. Other clients are unaffected. Turning this off restores capability search.
    standardCodeMode: ""          # default off · Workflows written from now on, Workflow tests, and computer-use programs on the desktop app and cloud computers run as standard JavaScript (ECMAScript, checked against test262), calling tools described the MCP way with JSON Schema. The engine is @opencode/codemode. Workflows saved before keep running as they always have. Turning this off returns new Workflows and computer programs to OpenWork's original Code Mode; Workflows saved as standard JavaScript stop with a message rather than switching interpreter, and run again when it is back on.
    outlookAttachments: ""        # default off · Agents read the files attached to Outlook messages and create Outlook drafts and replies with workspace files attached, after the member approves each draft. Drafts are never sent.
  # END GENERATED features
  administratorRecovery:
    # Processed only with config.features.administratorRecovery on. Flag off is a
    # silent recovery no-op; normal database upgrades remain unchanged.
    # Flag on defaults to read-only check. Use apply only for the chosen team;
    # the normal application/database upgrade must already have completed.
    mode: check
    # Optional active roster count. Mismatch refuses before any recovery writes.
    # Count does not detect a same-size swap; exact roster binding is still pending.
    expectedMembers: null
    # Organization ID or exact slug. May be empty only when exactly one org exists.
    organization: ""
    # Existing designated non-SCIM Admin team ID or exact name. Check prints its ID;
    # pin that ID for apply, because names can be renamed. No roster fingerprint yet.
    team: ""
    # Alternative batch/legacy form: organization ID or slug -> team ID or exact name.
    # Use this map OR organization/team above, never both. Apply needs the feature on.
    teams: {}
  tenancy:
    mode: single_org
    singleOrgName: OpenWork
    singleOrgSlug: default
    ownerEmails: ""
    allowPublicSignup: "false"
    requireEmailVerification: "false"
  audit:
    # Grant availability without a Cloud plan. Never turns org capture on by itself.
    selfHostedEnabled: "false"
    # Rollout gates; org admins separately control capture on their initialized policy.
    # Default-on deployment switches; explicit false disables globally.
    # Also requires the auditLogs feature per org (/admin or config.features) plus entitlement.
    # Ready orgs auto-provision 6M retained operations, capture ON, no cap enforcement.
    # Existing policy values and explicit capture OFF choices are preserved.
    captureEnabled: "true"
    visibilityEnabled: "true"
  auth:
    passwordBreachScreeningEnabled: "false"
  email:
    # Where replies to invitation emails and their "Report abuse" link go, such as
    # your IT help desk. Leave blank to send replies to the person who invited them.
    # Renders EMAIL_SUPPORT_ADDRESS.
    supportAddress: ""
  githubConnector:
    appId: ""
    clientId: ""
  public:
    # Required, explicit desktop-reachable HTTPS origin when gateway.enabled=true.
    gatewayPublicBaseUrl: ""
    # Single public Den web origin. The chart passes this as DEN_BASE_URL; den-api
    # derives Better Auth, CORS/trusted origins, web-app hosts, API defaults, and
    # MCP resource defaults from it unless the compatibility overrides below are set.
    webOrigin: https://openwork.example.com
    # Compatibility overrides for split-origin or migration deployments.
    apiOrigin: ""
    mcpResourceUrl: ""
    mcpAdditionalResources: ""
    # Leave blank to keep External MCP URL SSRF protection enabled.
    # Set "1" only for trusted private-network MCP servers.
    allowPrivateMcpUrls: ""
    mcpClaimNamespace: ""
    desktopDenBaseUrl: ""
    corsOrigins: ""
    betterAuthCookieDomain: ""
    betterAuthTrustedOrigins: ""
    webAppHosts: ""
    bootstrapAdminEmails: ""
    # Automations are on. Organization admins turn Desktop or Cloud Automations
    # off in Settings; set "false" to turn them off for the whole install.
    automationsEnabled: "true"
    # Self-hosted Dashboards are opt-in. Hosted environments use the same Den flag.
    dashboardsEnabled: "false"
    # OpenWork Web is hosted-only by default. OpenWork Cloud enables it explicitly.
    openworkWebEnabled: "false"
    # Preserve the Den runtime for published legacy Desktops during upgrades.
    # Set false only after every Desktop is v0.18.35+ to hard-disable Automations.
    automationsRuntimeEnabled: "true"
    # Enable only after compatible Desktop MCP Apps hosts are deployed.
    generatedArtifactViewsEnabled: "false"
    appMcpServersEnabled: "true"
    openworkWebUrl: ""
    installerReleaseTag: ""
    installerReleaseRepo: ""
    authCallbackUrl: https://openwork.example.com
  internal:
    # gatewayProxyBaseUrl is intentionally absent: when present (even ""), it
    # overrides inferenceProxyBaseUrl. Gateway opt-in requires an explicit origin.
    apiBaseUrl: ""
    authFallbackBaseUrl: ""
    inferenceProxyBaseUrl: ""
  provisioner:
    mode: stub
    reconcileIntervalMs: "60000"
    reconcileStaleMs: "1200000"
    reconcileBatchSize: "10"
    workerUrlTemplate: ""
  daytona:
