{{- if and .Values.brandAssets.enabled (not .Values.brandAssets.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-brand-assets" (include "openwork-ee.fullname" .) }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "den-api") | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.brandAssets.accessModes | nindent 4 }}
  {{- with .Values.brandAssets.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.brandAssets.size | quote }}
{{- end }}
