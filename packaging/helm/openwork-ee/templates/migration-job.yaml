{{- include "openwork-ee.customCa.validate" . }}
{{- /* Runs the legacy create=false shim before any secretsMode check below. */}}
{{- include "openwork-ee.secretsMode.validate" . }}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openwork-ee.fullname" . }}-migrate
  namespace: {{ include "openwork-ee.namespace" . }}
  labels:
    {{- include "openwork-ee.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  {{- if .Values.migrations.hook }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    {{- with .Values.migrations.hookDeletePolicy }}
    "helm.sh/hook-delete-policy": {{ . | quote }}
    {{- end }}
  {{- end }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "openwork-ee.componentSelectorLabels" (dict "root" . "component" "migration") | nindent 8 }}
      {{- with .Values.migrations.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: Never
      {{- if ne .Values.secret.secretsMode "inline" }}
      serviceAccountName: {{ include "openwork-ee.fullname" . }}-migrate
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.customCa.enabled }}
      volumes:
        {{- include "openwork-ee.customCa.volume" . | nindent 8 }}
      {{- end }}
      {{- /*
        When the Secret is materialized asynchronously (ESO or out-of-band
        creation), the Job must not fail on a missing Secret before it exists.
        Block in an init container until it appears (and, in externalSecrets
        mode, holds the expected keys) instead of erroring on the env
        secretKeyRef.
      */}}
      {{- if ne .Values.secret.secretsMode "inline" }}
      initContainers:
        {{- include "openwork-ee.waitForSecretInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.denApi.image.repository }}:{{ include "openwork-ee.imageTag" (dict "root" . "componentTag" .Values.denApi.image.tag) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.customCa.enabled }}
          volumeMounts:
            {{- include "openwork-ee.customCa.volumeMount" . | nindent 12 }}
          {{- end }}
          command:
            {{- toYaml .Values.migrations.command | nindent 12 }}
          args:
            {{- toYaml .Values.migrations.args | nindent 12 }}
          env:
            - name: DB_MODE
              value: {{ .Values.config.databaseMode | quote }}
            - name: DATABASE_URL
              {{- if eq .Values.secret.secretsMode "inline" }}
              value: {{ .Values.secret.values.databaseUrl | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "openwork-ee.secretName" . }}
                  key: {{ .Values.secret.keys.databaseUrl | quote }}
              {{- end }}
            - name: DEN_DB_ENCRYPTION_KEY
              {{- if eq .Values.secret.secretsMode "inline" }}
              value: {{ .Values.secret.values.denDbEncryptionKey | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "openwork-ee.secretName" . }}
                  key: {{ .Values.secret.keys.denDbEncryptionKey | quote }}
              {{- end }}
            {{- if .Values.customCa.enabled }}
            {{- include "openwork-ee.customCa.env" . | nindent 12 }}
            {{- end }}
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
