name: Setup OpenWork tests
description: Install the pinned runtimes, engine, and both workspaces
inputs:
  engine:
    description: Install the pinned OpenCode CLI and Bun ("false" for jobs that only typecheck or run Node tests)
    required: false
    default: "true"
  evals:
    description: Install the eval workspace ("false" when no eval package or spec runs)
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: 24.22.1

    - name: Setup pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 11.4.0

    - name: Install OpenCode CLI
      if: inputs.engine == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        repo="${OPENCODE_GITHUB_REPO:-anomalyco/opencode}"
        version="$(node -e "const fs=require('fs'); const parsed=JSON.parse(fs.readFileSync('constants.json','utf8')); process.stdout.write(String(parsed.opencodeVersion||'').trim().replace(/^v/,''));")"
        version="$(echo "$version" | tr -d '\r\n' | sed 's/^v//')"

        if [ -z "$version" ]; then
          echo "Unable to resolve OpenCode version from constants.json." >&2
          exit 1
        fi

        arch="$(uname -m)"
        case "${RUNNER_OS}" in
          Linux)
            if [ "$arch" = "aarch64" ] || [ "$arch" = "arm64" ]; then
              opencode_asset="opencode-linux-arm64.tar.gz"
            else
              opencode_asset="opencode-linux-x64-baseline.tar.gz"
            fi
            ;;
          macOS)
            if [ "$arch" = "arm64" ]; then
              opencode_asset="opencode-darwin-arm64.zip"
            else
              opencode_asset="opencode-darwin-x64-baseline.zip"
            fi
            ;;
          *)
            echo "Unsupported OS: ${RUNNER_OS}" >&2
            exit 1
            ;;
        esac

        url="https://github.com/${repo}/releases/download/v${version}/${opencode_asset}"
        tmp_dir="$RUNNER_TEMP/opencode"
        extract_dir="$tmp_dir/extracted"
        rm -rf "$tmp_dir"
        mkdir -p "$extract_dir"

        curl_headers=()
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          curl_headers+=( -H "Authorization: Bearer ${GITHUB_TOKEN}" )
        fi

        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "${curl_headers[@]}" -o "$tmp_dir/$opencode_asset" "$url"

        node --input-type=module - "$tmp_dir/$opencode_asset" "$version" "$opencode_asset" "$repo" <<'NODE'
        import { readFileSync } from "node:fs";
        import { createHash } from "node:crypto";
        import { opencodeV1Pin } from "./apps/desktop/scripts/prepare-opencode-v1.mjs";
        const [archive, version, asset, repo] = process.argv.slice(2);
        const pin = opencodeV1Pin(`v${version}`, asset, repo);
        if (createHash("sha256").update(readFileSync(archive)).digest("hex") !== pin.sha256) {
          throw new Error(`OpenCode v1 archive integrity mismatch: ${asset}`);
        }
        NODE

        if [[ "$opencode_asset" == *.tar.gz ]]; then
          tar -xzf "$tmp_dir/$opencode_asset" -C "$extract_dir"
        else
          unzip -q "$tmp_dir/$opencode_asset" -d "$extract_dir"
        fi

        if [ -f "$extract_dir/opencode" ]; then
          bin_path="$extract_dir/opencode"
        elif [ -f "$extract_dir/opencode.exe" ]; then
          bin_path="$extract_dir/opencode.exe"
        else
          echo "OpenCode binary not found in archive" >&2
          ls -la "$extract_dir"
          exit 1
        fi

        install_dir="$HOME/.opencode/bin"
        mkdir -p "$install_dir"
        cp "$bin_path" "$install_dir/opencode"
        chmod 755 "$install_dir/opencode"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Verify OpenCode
      if: inputs.engine == 'true'
      shell: bash
      run: opencode --version

    - name: Setup Bun
      if: inputs.engine == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'evals/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    # pnpm records each lockfile it has checked against the supply-chain policy
    # (minimumReleaseAge) by content hash and policy, and re-checks only a
    # lockfile or policy it has not seen (~9s of registry lookups otherwise).
    # The key covers both, so a changed lockfile or policy is always re-checked.
    - name: Cache pnpm's lockfile policy check
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      continue-on-error: true
      with:
        path: |
          ~/.cache/pnpm/lockfile-verified.jsonl
          ~/Library/Caches/pnpm/lockfile-verified.jsonl
        key: ${{ runner.os }}-pnpm-lockfile-verified-${{ hashFiles('pnpm-lock.yaml', 'evals/pnpm-lock.yaml', 'pnpm-workspace.yaml', 'evals/pnpm-workspace.yaml') }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Install eval workspace
      if: inputs.evals == 'true'
      shell: bash
      run: pnpm --dir evals install --frozen-lockfile --prefer-offline
