name: Setup OpenWork tests
description: Install the pinned runtimes, engine, and both workspaces
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 11.4.0

    # The pinned OpenCode engine (constants.json `opencodeV2Version`), checked
    # against the integrity apps/server/src/opencode-v2-artifacts.json records.
    # On PATH, openwork-server uses it instead of downloading it for every profile.
    - name: Install OpenCode
      shell: bash
      run: |
        set -euo pipefail
        install_dir="$HOME/.opencode2/bin"
        node scripts/install-opencode2.mjs --outdir "$install_dir"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Verify OpenCode
      shell: bash
      run: opencode2 --version

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v5
      continue-on-error: true
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'evals/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Install eval workspace
      shell: bash
      run: pnpm --dir evals install --frozen-lockfile --prefer-offline
