name: Setup desktop build environment
description: Prepare Node, pnpm, Bun, and Electron packaging dependencies for desktop release builds.

inputs:
  os-type:
    description: Target operating system family.
    required: true
  rust-target:
    description: Deprecated input kept for workflow compatibility.
    required: false
    default: ""
  node-version:
    description: Node.js version to install.
    required: false
    default: "20"
  pnpm-version:
    description: pnpm version to install.
    required: false
    default: "10.27.0"
  bun-version:
    description: Bun version to install.
    required: false
    default: "1.3.6"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Get pnpm store path
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Cache pnpm store
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prefer-offline

    - name: Install Linux Electron packaging dependencies
      if: ${{ inputs.os-type == 'linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          rpm \
          libarchive-tools \
          libfuse2 \
          libsecret-1-dev
