name: npm release smoke check

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/npm-release-smoke-check.yml
      - .github/workflows/release-macos-aarch64.yml
      - .github/workflows/release-daytona-snapshot.yml
      - apps/server/scripts/npm-web-smoke.mjs
      - apps/server/scripts/npm-web-smoke.test.mjs
  push:
    branches: [dev]
    paths:
      - .github/workflows/npm-release-smoke-check.yml
      - .github/workflows/release-macos-aarch64.yml
      - .github/workflows/release-daytona-snapshot.yml
      - apps/server/scripts/npm-web-smoke.mjs
      - apps/server/scripts/npm-web-smoke.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-script:
    name: Test npm release verification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - run: node --test apps/server/scripts/npm-web-smoke.test.mjs
