name: Den Contract Conflicts

# PRs that change Den routes commit the regenerated contract
# (packages/docs/openapi.json and packages/sdk/src/gen). Any two of them
# conflict on those files as soon as one merges, and the fix is always the
# same: merge dev and run `pnpm den:contract`. For same-repo PRs whose only
# conflicts are generated contract files, this workflow merges dev with dev's
# copy of those files and pushes the merge. The PR's own den-contract check
# then regenerates the contract, and Den Contract Regenerated pushes the
# result. Every other conflict is left to the author.
#
# This runs in dev's context with the diff-warden key, so it only runs git on
# PR code: installing or generating here could poison dev's caches.
# pull_request_target (not pull_request) because GitHub skips pull_request
# workflows while a PR has conflicts.

on:
  push:
    branches:
      - dev
    paths:
      - "packages/docs/openapi.json"
      - "packages/sdk/src/gen/**"
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - dev
    paths:
      - "packages/docs/openapi.json"
      - "packages/sdk/src/gen/**"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to resolve (empty checks every open PR into dev)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: den-contract-conflicts-${{ github.event.pull_request.number || inputs.pr || github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Find PRs whose only conflicts are the generated contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      base_sha: ${{ steps.plan.outputs.base_sha }}
      prs: ${{ steps.plan.outputs.prs }}
    steps:
      - name: Checkout dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: dev
          fetch-depth: 0
          filter: blob:none

      - name: Classify each PR's merge with dev
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD)"
          if [ -n "$INPUT_PR" ]; then
            numbers="$INPUT_PR"
          else
            numbers="$(gh pr list --repo "$GITHUB_REPOSITORY" --base dev --state open --limit 300 --json number --jq '.[].number')"
          fi

          prs='[]'
          for number in $numbers; do
            IFS=$'\t' read -r state base head_repo head_ref < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" \
              --jq '[.state, .base.ref, .head.repo.full_name // "", .head.ref] | @tsv')
            if [ "$state" != "open" ] || [ "$base" != "dev" ] || [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
              echo "#$number: skipped, not an open same-repo PR into dev"
              continue
            fi
            if ! git fetch --quiet --no-tags origin "refs/heads/$head_ref"; then
              echo "#$number: skipped, could not fetch $head_ref"
              continue
            fi
            head_sha="$(git rev-parse FETCH_HEAD)"
            verdict="$(node scripts/ci/den-contract-conflicts.mjs --base "$base_sha" --head "$head_sha")"
            echo "#$number ($head_ref): $verdict"
            if [ "$(jq -r .status <<<"$verdict")" = "generated" ]; then
              prs="$(jq -c --argjson number "$number" --arg ref "$head_ref" --arg sha "$head_sha" \
                '. + [{number: $number, ref: $ref, sha: $sha}]' <<<"$prs")"
            fi
          done

          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          printf '## Den contract conflicts\n\nMerging dev %s into: %s\n' "$base_sha" "$prs" >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: "Merge dev into #${{ matrix.pr.number }}"
    needs: plan
    if: needs.plan.outputs.prs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: warden-clearance
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.plan.outputs.prs) }}
    steps:
      # Unscoped permissions on purpose: when dev changed workflow files, the
      # merge commit touches them and the push needs the workflows permission.
      - name: Mint push token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.WARDEN_APP_ID }}
          private-key: ${{ secrets.WARDEN_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}

      - name: Checkout dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.plan.outputs.base_sha }}
          token: ${{ steps.app.outputs.token }}
          fetch-depth: 0
          filter: blob:none

      - name: Merge dev with dev's generated contract and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          HEAD_SHA: ${{ matrix.pr.sha }}
          REF: ${{ matrix.pr.ref }}
          PR: ${{ matrix.pr.number }}
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags origin "refs/heads/$REF"
          if [ "$(git rev-parse FETCH_HEAD)" != "$HEAD_SHA" ]; then
            echo "#$PR moved since planning; its next push or dev change retries."
            printf -- '- #%s: head moved, skipped\n' "$PR" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git checkout --quiet --detach "$HEAD_SHA"

          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git merge --no-ff --no-commit "$BASE_SHA" || true
          git checkout "$BASE_SHA" -- packages/docs/openapi.json packages/sdk/src/gen
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "::error::Conflicts outside the generated contract:"$'\n'"$unresolved"
            exit 1
          fi

          # Den Contract Regenerated keys on this subject line.
          git commit --quiet \
            -m "chore: merge dev, Den API contract regenerates next" \
            -m "Only packages/docs/openapi.json and packages/sdk/src/gen conflicted with dev. This merge takes dev's copy; the den-contract check regenerates both from the merged route source and Den Contract Regenerated pushes them."
          # Not forced: if the author pushed meanwhile, this is rejected and the next run retries.
          git push origin "HEAD:refs/heads/$REF"
          printf -- '- #%s: merged dev %s; the contract regenerates in the PR checks\n' "$PR" "$BASE_SHA" >> "$GITHUB_STEP_SUMMARY"
