name: Publish EE Artifacts

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push images and the Helm chart to GHCR
        required: false
        default: false
        type: boolean
      chart_version:
        description: Helm chart version for manual publishes, for example 0.17.1
        required: false
        default: ""
        type: string
  # Not on PRs. Nightly (and manual runs with push off) build all six images
  # from dev without publishing and run the health and migration assertions on
  # them; dev pushes and v* tags build and publish.
  schedule:
    - cron: "41 6 * * *"
  push:
    branches:
      - "dev"
    tags:
      - "v*"

# Do not cancel an API publication because an unrelated Workbot push arrived.
# Mutable :dev writes are serialized per target below, not per whole workflow.

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  artifact-version:
    name: Resolve artifact version
    runs-on: ubuntu-latest
    outputs:
      chart_version: ${{ steps.version.outputs.chart_version }}
      publish: ${{ steps.version.outputs.publish }}
      publication_channel: ${{ steps.version.outputs.publication_channel }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_CHART_VERSION: ${{ inputs.chart_version }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          publish="false"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            publish="true"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$INPUT_PUSH" = "true" ]; then
            publish="true"
          fi

          chart_version="$INPUT_CHART_VERSION"
          if [[ "${GITHUB_REF_TYPE}" = "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            chart_version="${GITHUB_REF_NAME#v}"
          fi

          if [ "$publish" = "true" ] && [ -z "$chart_version" ] && [ "${GITHUB_EVENT_NAME}" != "push" ]; then
            echo "chart_version is required when manually publishing from a non-tag ref" >&2
            exit 1
          fi

          publication_channel="publish"
          if [ "$publish" = "false" ]; then
            if ! [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
              echo "Non-publishing runs require a unique run ID and attempt" >&2
              exit 1
            fi
            publication_channel="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi

          {
            echo "chart_version=$chart_version"
            echo "publish=$publish"
            echo "publication_channel=$publication_channel"
          } >> "$GITHUB_OUTPUT"

  image-inputs:
    name: Select unpublished image inputs
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.inputs.outputs.images }}
      gateway: ${{ steps.inputs.outputs.gateway }}
      publisher_version: ${{ steps.inputs.outputs.publisher_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1

      - name: Compare each image with its successfully published dev inputs
        id: inputs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/ee-image-inputs.mjs select

  helm-chart:
    name: Validate Helm chart
    runs-on: ubuntu-latest
    needs: artifact-version
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1

      - name: Select Helm inputs independently of image builds
        id: inputs
        run: node .github/scripts/ee-image-inputs.mjs helm

      - name: Set up Helm
        if: ${{ steps.inputs.outputs.affected == 'true' }}
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Check Node security baseline and Helm runtime probe
        if: ${{ steps.inputs.outputs.affected == 'true' }}
        run: node --test scripts/tests/node-runtime-baseline.test.mjs packaging/helm/openwork-ee/tests/node-runtime.mjs

      - name: Lint chart
        if: ${{ steps.inputs.outputs.affected == 'true' }}
        run: helm lint packaging/helm/openwork-ee

      - name: Render chart
        if: ${{ steps.inputs.outputs.affected == 'true' }}
        run: helm template openwork-ee packaging/helm/openwork-ee --set ingress.enabled=true --set inference.enabled=true

      - name: Run chart tests
        if: ${{ steps.inputs.outputs.affected == 'true' }}
        run: |
          for test in packaging/helm/openwork-ee/tests/*.sh; do
            bash "$test"
          done

      - name: Package chart
        if: ${{ steps.inputs.outputs.affected == 'true' && needs.artifact-version.outputs.chart_version != '' }}
        run: |
          helm package packaging/helm/openwork-ee \
            --version "${{ needs.artifact-version.outputs.chart_version }}" \
            --app-version "${{ needs.artifact-version.outputs.chart_version }}" \
            --destination dist/charts

      - name: Log in to GHCR for Helm
        if: ${{ steps.inputs.outputs.affected == 'true' && needs.artifact-version.outputs.publish == 'true' && needs.artifact-version.outputs.chart_version != '' }}
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login "${{ env.REGISTRY }}" \
            --username "${{ github.actor }}" \
            --password-stdin

      - name: Publish chart
        if: ${{ steps.inputs.outputs.affected == 'true' && needs.artifact-version.outputs.publish == 'true' && needs.artifact-version.outputs.chart_version != '' }}
        run: helm push "dist/charts/openwork-ee-${{ needs.artifact-version.outputs.chart_version }}.tgz" "oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts"

  ee-images:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [artifact-version, image-inputs]
    if: ${{ needs.image-inputs.outputs.images != '[]' }}
    concurrency: &image-publish-lock
      # Build-only runs cannot evict a pending publisher; superseded publisher
      # implementations cannot evict the current implementation's job either.
      group: ee-${{ needs.artifact-version.outputs.publication_channel }}-${{ matrix.target }}-${{ github.ref }}-${{ needs.image-inputs.outputs.publisher_version }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-inputs.outputs.images) }}

    steps: &image-build-steps
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1

      # GitHub retains only one pending job. If an older selector evicted a
      # newer one, this lock holder must build the newest desired source instead
      # of rejecting its own stale commit and leaving :dev unpublished.
      - name: Resolve current source under the target lock
        id: source
        env:
          PUBLISHER_VERSION: ${{ needs.image-inputs.outputs.publisher_version }}
          PUBLISH_IMAGES: ${{ needs.artifact-version.outputs.publish }}
        run: node .github/scripts/ee-image-inputs.mjs source

      - name: Recheck published inputs under the target lock
        id: inputs
        if: ${{ steps.source.outputs.current == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/ee-image-inputs.mjs check "${{ matrix.target }}"

      - name: Resolve image configuration locally
        id: config
        if: ${{ steps.inputs.outputs.build == 'true' }}
        run: node .github/scripts/ee-image-inputs.mjs config "${{ matrix.target }}"

      - name: Set up QEMU
        if: ${{ steps.inputs.outputs.build == 'true' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        if: ${{ steps.inputs.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: ${{ steps.inputs.outputs.build == 'true' && needs.artifact-version.outputs.publish == 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        if: ${{ steps.inputs.outputs.build == 'true' }}
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ steps.config.outputs.image }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=sha-${{ steps.source.outputs.source_short_sha }}
            type=raw,value=build-${{ steps.source.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          # :dev is never a build tag. Promote the successful immutable digest
          # below only if this target still matches the latest dev inputs.
          # Override event-derived revision metadata when this lock holder has
          # reconciled a newer checkout: provenance must name the built source.
          labels: |
            org.opencontainers.image.title=${{ steps.config.outputs.image }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.source_sha }}
            io.openwork.build-inputs=${{ steps.inputs.outputs.fingerprint }}
            io.openwork.build-target=${{ matrix.target }}

      - name: Resolve Sentry source-map upload
        id: sentry_sourcemaps
        if: ${{ steps.inputs.outputs.build == 'true' && needs.artifact-version.outputs.publish == 'true' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ secrets.SENTRY_RELEASE }}
        run: |
          set -euo pipefail

          has_value() {
            [[ "$1" =~ [^[:space:]] ]]
          }

          den_api_upload=false
          den_web_upload=false

          if has_value "$SENTRY_AUTH_TOKEN" && has_value "$SENTRY_ORG" && has_value "$SENTRY_PROJECT" && has_value "$SENTRY_RELEASE"; then
            den_api_upload=true
          else
            echo "Den API Sentry source-map upload disabled: configure SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT, and SENTRY_RELEASE to enable it."
          fi

          if has_value "$SENTRY_AUTH_TOKEN" && has_value "$SENTRY_ORG" && has_value "$SENTRY_PROJECT"; then
            den_web_upload=true
          else
            echo "Den Web Sentry source-map upload disabled: configure SENTRY_AUTH_TOKEN, SENTRY_ORG, and SENTRY_PROJECT to enable it."
          fi

          echo "den_api_upload=$den_api_upload" >> "$GITHUB_OUTPUT"
          echo "den_web_upload=$den_web_upload" >> "$GITHUB_OUTPUT"

      - name: Build and optionally push without Sentry source-map upload
        id: build
        # Build every selected image except the Sentry-enabled steps' owners.
        # The exclusion keeps new matrix entries from silently skipping builds.
        if: ${{ steps.inputs.outputs.build == 'true' && !((steps.config.outputs.image == 'openwork-den-api' && steps.sentry_sourcemaps.outputs.den_api_upload == 'true') || (steps.config.outputs.image == 'openwork-den-web' && steps.sentry_sourcemaps.outputs.den_web_upload == 'true')) }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: ${{ (needs.artifact-version.outputs.publish != 'true' || github.ref == 'refs/heads/dev') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          load: ${{ needs.artifact-version.outputs.publish != 'true' }}
          push: ${{ needs.artifact-version.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.config.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.config.outputs.image }}
          build-args: |
            ${{ steps.config.outputs.image == 'openwork-den-api' && format('DEN_API_VERSION={0}', needs.artifact-version.outputs.chart_version || steps.source.outputs.source_sha) || '' }}
            ${{ steps.config.outputs.image == 'openwork-den-gateway' && format('DEN_GATEWAY_VERSION={0}', needs.artifact-version.outputs.chart_version || steps.source.outputs.source_sha) || '' }}
            ${{ steps.config.outputs.image == 'openwork-den-api' && 'DEN_UPLOAD_SENTRY_SOURCEMAPS=0' || '' }}
            ${{ steps.config.outputs.image == 'openwork-den-web' && 'DEN_WEB_UPLOAD_SENTRY_SOURCEMAPS=0' || '' }}

      - name: Build and push with Sentry source-map upload
        id: build_sentry
        if: ${{ steps.inputs.outputs.build == 'true' && ((steps.config.outputs.image == 'openwork-den-api' && steps.sentry_sourcemaps.outputs.den_api_upload == 'true') || (steps.config.outputs.image == 'openwork-den-web' && steps.sentry_sourcemaps.outputs.den_web_upload == 'true')) }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ steps.config.outputs.dockerfile }}
          platforms: ${{ (needs.artifact-version.outputs.publish != 'true' || github.ref == 'refs/heads/dev') && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ steps.config.outputs.image }}
          cache-to: type=gha,mode=max,scope=${{ steps.config.outputs.image }}
          build-args: |
            ${{ steps.config.outputs.image == 'openwork-den-api' && format('DEN_API_VERSION={0}', needs.artifact-version.outputs.chart_version || steps.source.outputs.source_sha) || '' }}
            ${{ steps.config.outputs.image == 'openwork-den-gateway' && format('DEN_GATEWAY_VERSION={0}', needs.artifact-version.outputs.chart_version || steps.source.outputs.source_sha) || '' }}
            ${{ steps.config.outputs.image == 'openwork-den-api' && 'DEN_UPLOAD_SENTRY_SOURCEMAPS=1' || '' }}
            ${{ steps.config.outputs.image == 'openwork-den-web' && 'DEN_WEB_UPLOAD_SENTRY_SOURCEMAPS=1' || '' }}
            ${{ steps.config.outputs.image == 'openwork-den-api' && format('DEN_SENTRY_UPLOAD_BUILD_ID={0}-{1}', github.run_id, github.run_attempt) || '' }}
            ${{ steps.config.outputs.image == 'openwork-den-web' && format('DEN_WEB_SENTRY_UPLOAD_BUILD_ID={0}-{1}', github.run_id, github.run_attempt) || '' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
            sentry_org=${{ secrets.SENTRY_ORG }}
            sentry_project=${{ secrets.SENTRY_PROJECT }}
            sentry_url=${{ secrets.SENTRY_URL }}
            sentry_release=${{ secrets.SENTRY_RELEASE }}
            sentry_dist=${{ secrets.SENTRY_DIST }}

      - name: Assert Den DB migration assets
        if: ${{ steps.inputs.outputs.build == 'true' && needs.artifact-version.outputs.publish != 'true' && steps.config.outputs.image == 'openwork-den-api' }}
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image_tag="${IMAGE_TAGS%%$'\n'*}"
          docker run --rm --entrypoint sh "$image_tag" -lc '
            test -s /app/ee/packages/den-db/dist/scripts/bootstrap.js
            test -s /app/ee/packages/den-db/dist/current-schema.sql
            test -s /app/ee/packages/den-db/dist/drizzle/meta/_journal.json
          '

      - name: Smoke health endpoint
        if: ${{ steps.inputs.outputs.build == 'true' && needs.artifact-version.outputs.publish != 'true' }}
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          image_tag="${IMAGE_TAGS%%$'\n'*}"
          read -r -a smoke_args <<< "$EE_IMAGE_SMOKE_ENV"
          smoke_args+=("$image_tag")
          container_name="openwork-smoke-${{ steps.config.outputs.image }}"
          mysql_container=""
          network_name=""

          # shellcheck disable=SC2329 # Invoked by the EXIT trap.
          cleanup() {
            status=$?
            trap - EXIT
            set +e

            if [ "$status" -ne 0 ]; then
              if docker inspect "$container_name" >/dev/null 2>&1; then
                echo "Smoke container logs:"
                docker logs "$container_name" || true
              fi
              if [ -n "$mysql_container" ] && docker inspect "$mysql_container" >/dev/null 2>&1; then
                echo "MySQL container logs:"
                docker logs "$mysql_container" || true
              fi
            fi

            docker rm -f "$container_name" >/dev/null 2>&1 || true
            if [ -n "$mysql_container" ]; then
              docker rm -f "$mysql_container" >/dev/null 2>&1 || true
            fi
            if [ -n "$network_name" ]; then
              docker network rm "$network_name" >/dev/null 2>&1 || true
            fi

            exit "$status"
          }
          trap cleanup EXIT

          if [ "${{ steps.config.outputs.image }}" = "openwork-den-api" ]; then
            network_name="openwork-den-api-smoke"
            mysql_container="openwork-den-api-smoke-mysql"
            database_url="mysql://smoke:smoke@${mysql_container}:3306/smoke"

            docker network create "$network_name" >/dev/null
            docker run -d \
              --name "$mysql_container" \
              --network "$network_name" \
              -e MYSQL_ROOT_PASSWORD=smoke-root-password \
              -e MYSQL_DATABASE=smoke \
              -e MYSQL_USER=smoke \
              -e MYSQL_PASSWORD=smoke \
              mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb >/dev/null

            mysql_ready="false"
            for _ in {1..30}; do
              if docker exec \
                -e MYSQL_PWD=smoke-root-password \
                "$mysql_container" \
                mysqladmin ping --host=127.0.0.1 --user=root --silent >/dev/null 2>&1; then
                mysql_ready="true"
                echo "MySQL is ready"
                break
              fi
              sleep 2
            done
            if [ "$mysql_ready" != "true" ]; then
              echo "MySQL did not become ready" >&2
              exit 1
            fi

            docker run --rm \
              --network "$network_name" \
              -e DATABASE_URL="$database_url" \
              -e DEN_DB_ENCRYPTION_KEY=ci-den-db-encryption-key-value-123456 \
              --entrypoint node \
              "$image_tag" \
              /app/ee/packages/den-db/dist/scripts/bootstrap.js

            container_id="$(docker run -d \
              --name "$container_name" \
              --network "$network_name" \
              -P \
              -e DATABASE_URL="$database_url" \
              "${smoke_args[@]}")"
          else
            container_id="$(docker run -d --name "$container_name" -P "${smoke_args[@]}")"
          fi

          host_port=""
          for _ in {1..10}; do
            host_port="$(docker port "$container_id" "${{ steps.config.outputs.port }}/tcp" 2>/dev/null | awk -F: 'NR == 1 { print $NF }')"
            if [ -n "$host_port" ]; then
              break
            fi
            sleep 1
          done
          if [ -z "$host_port" ]; then
            docker logs "$container_id" || true
            exit 1
          fi

          url="http://127.0.0.1:${host_port}${{ steps.config.outputs.health_path }}"

          for _ in {1..30}; do
            if node -e "fetch(process.argv[1]).then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))" "$url"; then
              echo "Health endpoint is ready: $url"
              exit 0
            fi
            sleep 2
          done

          docker logs "$container_id" || true
          exit 1

      - name: Promote current dev inputs by immutable digest
        id: promote
        if: ${{ steps.inputs.outputs.build == 'true' && needs.artifact-version.outputs.publish == 'true' && github.ref == 'refs/heads/dev' }}
        env:
          BUILD_FINGERPRINT: ${{ steps.inputs.outputs.fingerprint }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest || steps.build_sentry.outputs.digest }}
        run: node .github/scripts/ee-image-inputs.mjs promote "${{ matrix.target }}" "$BUILD_DIGEST"

  # Reuse exactly the same build/assertion/smoke steps, but give this target its
  # own completion boundary so the source-deploy hook never waits for a matrix.
  den-gateway-image:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [artifact-version, image-inputs]
    if: ${{ needs.image-inputs.outputs.gateway != '[]' }}
    outputs:
      published: ${{ steps.promote.outputs.published }}
    concurrency: *image-publish-lock
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.image-inputs.outputs.gateway) }}
    steps: *image-build-steps

  # Only this target's actual, current :dev publication can request a source
  # deploy. Render builds client-web FROM SOURCE, not from this GHCR image.
  redeploy-den-gateway:
    needs: den-gateway-image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.den-gateway-image.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    # Preserve the existing hook's environment/authorization boundary. Image
    # builds (including tag/manual releases) do not need this environment.
    environment:
      name: den-production
      deployment: false
    steps:
      - name: Redeploy den-gateway on Render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_DEN_GATEWAY_SERVICE_ID: ${{ secrets.RENDER_DEN_GATEWAY_SERVICE_ID }}
        run: |
          set -euo pipefail

          if [ -z "${RENDER_DEN_GATEWAY_SERVICE_ID:-}" ] || [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::notice::Render gateway credentials unavailable; skipping redeploy..."
            echo "Render gateway redeploy skipped because credentials are unavailable." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          response="$(curl -s -w '\n%{http_code}' -X POST \
            "https://api.render.com/v1/services/${RENDER_DEN_GATEWAY_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')"
          code="$(printf '%s' "$response" | tail -1)"
          body="$(printf '%s' "$response" | sed '$d')"
          if [ "$code" -ge 400 ]; then
            echo "::error::POST /deploys returned HTTP $code: $body"
            exit 1
          fi

          {
            echo
            echo "Requested the existing Render gateway source deploy after publishing its matching dev artifact. Render builds from source, not this GHCR image."
          } >> "$GITHUB_STEP_SUMMARY"
