# Confidentiality tripwire.
#
# Blocks a PR when its branch name, title, body, commit messages, or added
# lines contain a confidential term (customer/prospect/partner names, held in
# the CONFIDENTIAL_TERMS repository secret — never in the tree) or a structural
# leak (email outside allowed domains, shared Slack channel, Slack link).
# Findings name the surface and line only; the confidential value is never
# echoed. Runs on `edited` too, because PR text is rewritten after checks pass.
#
# Fork PRs receive no secrets, so only the structural checks run there.
name: Confidentiality

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: confidentiality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  confidentiality-tripwire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Self-test the scanner
        run: node --test scripts/confidentiality-tripwire.test.mjs

      - name: Scan branch, PR text, commits, and added lines
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
          CONFIDENTIAL_ALLOWED_EMAIL_DOMAINS: ${{ vars.CONFIDENTIAL_ALLOWED_EMAIL_DOMAINS }}
        run: node scripts/confidentiality-tripwire.mjs ci
