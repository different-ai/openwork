name: Stage Release Desktop Artifacts

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact signed release source commit to build
        required: true
        type: string
      notarize:
        description: Sign and notarize macOS artifacts
        required: true
        type: boolean
      sign_windows:
        description: Sign Windows installers with SignPath
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

jobs:
  stage-electron:
    name: Stage Electron (${{ matrix.artifact }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    env:
      MACOS_NOTARIZE: ${{ inputs.notarize }}
      SIGN_WINDOWS: ${{ inputs.sign_windows }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID || vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG || vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG || vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ secrets.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            os_type: macos
            artifact: electron-macos-arm64
            builder_config: electron-builder.yml
            asset_prefix: openwork
            manifest_pattern: latest*.yml
            electron_args: "--mac --arm64"
            target_triple: aarch64-apple-darwin
          - platform: macos-14
            os_type: macos
            artifact: electron-macos-x64
            builder_config: electron-builder.yml
            asset_prefix: openwork
            manifest_pattern: latest*.yml
            electron_args: "--mac --x64"
            target_triple: x86_64-apple-darwin
          - platform: ubuntu-22.04
            os_type: linux
            artifact: electron-linux-x64
            builder_config: electron-builder.yml
            asset_prefix: openwork
            manifest_pattern: latest*.yml
            electron_args: "--linux --x64"
            target_triple: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            os_type: linux
            artifact: electron-linux-arm64
            builder_config: electron-builder.yml
            asset_prefix: openwork
            manifest_pattern: latest*.yml
            electron_args: "--linux --arm64"
            target_triple: aarch64-unknown-linux-gnu
          - platform: windows-2022
            os_type: windows
            artifact: electron-windows-x64
            builder_config: electron-builder.yml
            asset_prefix: openwork
            manifest_pattern: latest*.yml
            electron_args: "--win --x64"
            target_triple: x86_64-pc-windows-msvc
          - platform: windows-11-arm
            os_type: windows
            artifact: electron-windows-arm64
            builder_config: electron-builder.yml
            asset_prefix: openwork
            manifest_pattern: latest*.yml
            electron_args: "--win --arm64"
            target_triple: aarch64-pc-windows-msvc
          - platform: macos-14
            os_type: macos
            artifact: electron-cloud-macos-arm64
            builder_config: electron-builder.cloud.yml
            asset_prefix: openwork-cloud
            manifest_pattern: cloud*.yml
            electron_args: "--mac --arm64"
            target_triple: aarch64-apple-darwin
          - platform: macos-14
            os_type: macos
            artifact: electron-cloud-macos-x64
            builder_config: electron-builder.cloud.yml
            asset_prefix: openwork-cloud
            manifest_pattern: cloud*.yml
            electron_args: "--mac --x64"
            target_triple: x86_64-apple-darwin
          - platform: ubuntu-22.04
            os_type: linux
            artifact: electron-cloud-linux-x64
            builder_config: electron-builder.cloud.yml
            asset_prefix: openwork-cloud
            manifest_pattern: cloud*.yml
            electron_args: "--linux --x64"
            target_triple: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            os_type: linux
            artifact: electron-cloud-linux-arm64
            builder_config: electron-builder.cloud.yml
            asset_prefix: openwork-cloud
            manifest_pattern: cloud*.yml
            electron_args: "--linux --arm64"
            target_triple: aarch64-unknown-linux-gnu
          - platform: windows-2022
            os_type: windows
            artifact: electron-cloud-windows-x64
            builder_config: electron-builder.cloud.yml
            asset_prefix: openwork-cloud
            manifest_pattern: cloud*.yml
            electron_args: "--win --x64"
            target_triple: x86_64-pc-windows-msvc
          - platform: windows-11-arm
            os_type: windows
            artifact: electron-cloud-windows-arm64
            builder_config: electron-builder.cloud.yml
            asset_prefix: openwork-cloud
            manifest_pattern: cloud*.yml
            electron_args: "--win --arm64"
            target_triple: aarch64-pc-windows-msvc
          - platform: macos-14
            os_type: macos
            artifact: electron-enterprise-macos-arm64
            builder_config: electron-builder.enterprise.yml
            asset_prefix: openwork-enterprise
            manifest_pattern: enterprise*.yml
            electron_args: "--mac --arm64"
            target_triple: aarch64-apple-darwin
          - platform: macos-14
            os_type: macos
            artifact: electron-enterprise-macos-x64
            builder_config: electron-builder.enterprise.yml
            asset_prefix: openwork-enterprise
            manifest_pattern: enterprise*.yml
            electron_args: "--mac --x64"
            target_triple: x86_64-apple-darwin
          - platform: ubuntu-22.04
            os_type: linux
            artifact: electron-enterprise-linux-x64
            builder_config: electron-builder.enterprise.yml
            asset_prefix: openwork-enterprise
            manifest_pattern: enterprise*.yml
            electron_args: "--linux --x64"
            target_triple: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            os_type: linux
            artifact: electron-enterprise-linux-arm64
            builder_config: electron-builder.enterprise.yml
            asset_prefix: openwork-enterprise
            manifest_pattern: enterprise*.yml
            electron_args: "--linux --arm64"
            target_triple: aarch64-unknown-linux-gnu
          - platform: windows-2022
            os_type: windows
            artifact: electron-enterprise-windows-x64
            builder_config: electron-builder.enterprise.yml
            asset_prefix: openwork-enterprise
            manifest_pattern: enterprise*.yml
            electron_args: "--win --x64"
            target_triple: x86_64-pc-windows-msvc
          - platform: windows-11-arm
            os_type: windows
            artifact: electron-enterprise-windows-arm64
            builder_config: electron-builder.enterprise.yml
            asset_prefix: openwork-enterprise
            manifest_pattern: enterprise*.yml
            electron_args: "--win --arm64"
            target_triple: aarch64-pc-windows-msvc

    steps:
      - name: Checkout signed release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact build source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]; then
            echo "Desktop build did not checkout exact source SHA $SOURCE_SHA." >&2
            exit 1
          fi

      - name: Enable git long paths (Windows)
        if: matrix.os_type == 'windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Get pnpm store path
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-electron-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Electron notary API key (macOS)
        if: matrix.os_type == 'macos' && env.MACOS_NOTARIZE == 'true'
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
          APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_CODESIGN_CERT_P12_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_NOTARY_API_KEY_P8_BASE64 APPLE_NOTARY_API_KEY_ID APPLE_NOTARY_API_ISSUER_ID APPLE_CODESIGN_CERT_P12_BASE64 APPLE_CODESIGN_CERT_PASSWORD; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Electron macOS signing secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          key_path="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "NOTARY_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Require notarized macOS release artifacts
        if: matrix.os_type == 'macos' && env.MACOS_NOTARIZE != 'true'
        run: |
          echo "Stable macOS release assets must be notarized." >&2
          exit 1

      - name: Build Electron app
        shell: bash
        env:
          TARGET: ${{ matrix.target_triple }}
        run: pnpm --filter @openwork/desktop build:electron

      - name: Package Electron (macOS)
        if: matrix.os_type == 'macos'
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        run: pnpm --dir apps/desktop exec electron-builder --config ${{ matrix.builder_config }} ${{ matrix.electron_args }} --publish never

      - name: Package Electron (Linux)
        if: matrix.os_type == 'linux'
        run: pnpm --dir apps/desktop exec electron-builder --config ${{ matrix.builder_config }} ${{ matrix.electron_args }} --publish never

      - name: Package Electron (Windows)
        if: matrix.os_type == 'windows'
        shell: bash
        run: pnpm --dir apps/desktop exec electron-builder --config ${{ matrix.builder_config }} ${{ matrix.electron_args }} --publish never

      - name: Validate SignPath configuration (Windows)
        if: matrix.os_type == 'windows' && env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_SIGNING_POLICY_SLUG; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing Windows SignPath configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Stage unsigned Windows installer for SignPath
        if: matrix.os_type == 'windows' && env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signpath-unsigned"
          shopt -s nullglob
          installers=(apps/desktop/dist-electron/${{ matrix.asset_prefix }}-win-*.exe)
          if [ "${#installers[@]}" -ne 1 ]; then
            echo "Expected exactly one unsigned Windows installer." >&2
            exit 1
          fi
          cp "${installers[0]}" "$RUNNER_TEMP/signpath-unsigned/"

      - name: Upload unsigned Windows installer for SignPath
        if: matrix.os_type == 'windows' && env.SIGN_WINDOWS == 'true'
        id: upload-unsigned-windows-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ matrix.artifact }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signpath-unsigned/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit Windows signing request to SignPath
        if: matrix.os_type == 'windows' && env.SIGN_WINDOWS == 'true' && env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG == ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Submit Windows signing request to SignPath (artifact configuration)
        if: matrix.os_type == 'windows' && env.SIGN_WINDOWS == 'true' && env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-windows-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Apply signed Windows installer
        if: matrix.os_type == 'windows' && env.SIGN_WINDOWS == 'true'
        shell: bash
        run: node scripts/release/apply-signpath-windows-artifact.mjs "$RUNNER_TEMP/signpath-signed" apps/desktop/dist-electron

      - name: Record unsigned Windows installer
        if: matrix.os_type == 'windows' && env.SIGN_WINDOWS != 'true'
        run: echo "::warning::Staging an unsigned Windows installer because sign_windows=false."

      - name: Normalize custom updater manifests
        if: matrix.asset_prefix != 'openwork'
        shell: bash
        run: |
          set -euo pipefail
          cd apps/desktop/dist-electron
          shopt -s nullglob
          channel="${{ matrix.asset_prefix }}"
          channel="${channel#openwork-}"
          for manifest in latest*.yml; do
            target="${channel}${manifest#latest}"
            if [ -e "$target" ]; then rm -f "$manifest"; else mv "$manifest" "$target"; fi
          done
          manifests=("${channel}"*.yml)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "${channel} build produced no updater manifest." >&2
            exit 1
          fi

      - name: Assemble immutable desktop stage
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          stage="$RUNNER_TEMP/release-stage"
          mkdir -p "$stage/assets" "$stage/manifests"
          assets=(apps/desktop/dist-electron/${{ matrix.asset_prefix }}-*)
          manifests=(apps/desktop/dist-electron/${{ matrix.manifest_pattern }})
          if [ "${#assets[@]}" -eq 0 ] || [ "${#manifests[@]}" -eq 0 ]; then
            echo "Expected release assets and updater manifests." >&2
            exit 1
          fi
          cp "${assets[@]}" "$stage/assets/"
          cp "${manifests[@]}" "$stage/manifests/"

      - name: Record and validate immutable stage identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/app/package.json').version")"
          node scripts/release/artifact-contract.mjs stage \
            --directory "$RUNNER_TEMP/release-stage" \
            --stage-id "${{ matrix.artifact }}" \
            --version "$version" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --artifact-name "release-desktop-${{ matrix.artifact }}-attempt-$GITHUB_RUN_ATTEMPT"

      - name: Upload immutable desktop stage
        uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ matrix.artifact }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-stage
          if-no-files-found: error
          retention-days: 90
