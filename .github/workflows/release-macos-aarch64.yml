name: Release App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v0.1.2). Leave empty to use current ref."
        required: false
        type: string
      release_name:
        description: "Release title (defaults to OpenWork <tag>)"
        required: false
        type: string
      release_body:
        description: "Release notes body in Markdown"
        required: false
        type: string
      draft:
        description: "Create the GitHub Release as a draft"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark the GitHub Release as a prerelease"
        required: false
        type: boolean
        default: false
      notarize:
        description: "Notarize macOS builds when signing secrets are configured"
        required: false
        type: boolean
        default: false
      build_desktop:
        description: "Build Electron desktop artifacts"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-release:
    name: Resolve Release Metadata
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_name: ${{ steps.resolve.outputs.release_name }}
      release_body: ${{ steps.resolve.outputs.release_body }}
      draft: ${{ steps.resolve.outputs.draft }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      notarize: ${{ steps.resolve.outputs.notarize }}
      build_desktop: ${{ steps.resolve.outputs.build_desktop }}
    steps:
      - name: Resolve metadata
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_RELEASE_NAME: ${{ github.event.inputs.release_name }}
          INPUT_RELEASE_BODY: ${{ github.event.inputs.release_body }}
          INPUT_DRAFT: ${{ github.event.inputs.draft }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
          INPUT_NOTARIZE: ${{ github.event.inputs.notarize }}
          INPUT_BUILD_DESKTOP: ${{ github.event.inputs.build_desktop }}
          DEFAULT_NOTARIZE: ${{ vars.MACOS_NOTARIZE }}
          DEFAULT_BUILD_DESKTOP: ${{ vars.RELEASE_BUILD_DESKTOP }}
        run: |
          set -euo pipefail

          TAG_INPUT="${INPUT_TAG:-}"
          if [ -n "$TAG_INPUT" ]; then
            if [[ "$TAG_INPUT" == v* ]]; then
              TAG="$TAG_INPUT"
            else
              TAG="v$TAG_INPUT"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG (expected vX.Y.Z)" >&2
            exit 1
          fi

          RELEASE_NAME="${INPUT_RELEASE_NAME:-OpenWork $TAG}"
          RELEASE_BODY="${INPUT_RELEASE_BODY:-See the assets to download this version and install.}"
          DRAFT="${INPUT_DRAFT:-false}"
          PRERELEASE="${INPUT_PRERELEASE:-false}"
          NOTARIZE="${INPUT_NOTARIZE:-${DEFAULT_NOTARIZE:-false}}"
          BUILD_DESKTOP="${INPUT_BUILD_DESKTOP:-${DEFAULT_BUILD_DESKTOP:-true}}"

          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "notarize=$NOTARIZE" >> "$GITHUB_OUTPUT"
          echo "build_desktop=$BUILD_DESKTOP" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<__OPENWORK_RELEASE_BODY_EOF__"
            printf '%s\n' "$RELEASE_BODY"
            echo "__OPENWORK_RELEASE_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY_FILE="$RUNNER_TEMP/release_body.md"
          printf '%s\n' "${{ steps.resolve.outputs.release_body }}" > "$BODY_FILE"

          if gh release view "${{ steps.resolve.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${{ steps.resolve.outputs.release_tag }} already exists; skipping create."
            exit 0
          fi

          DRAFT_FLAG=""
          PRERELEASE_FLAG=""
          if [ "${{ steps.resolve.outputs.draft }}" = "true" ]; then
            DRAFT_FLAG="--draft"
          fi
          if [ "${{ steps.resolve.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ steps.resolve.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.resolve.outputs.release_name }}" \
            --notes-file "$BODY_FILE" \
            $DRAFT_FLAG $PRERELEASE_FLAG

  verify-release:
    name: Verify Release Versions
    needs: resolve-release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches app versions
        run: node scripts/release/verify-tag.mjs --tag "${{ needs.resolve-release.outputs.release_tag }}"

      - name: Release review (strict)
        run: node scripts/release/review.mjs --strict

  publish-electron:
    name: Build + Package (${{ matrix.target }})
    needs: [resolve-release, verify-release]
    if: needs.resolve-release.outputs.build_desktop == 'true'
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_type: macos
            target: darwin-arm64
            runs_on: macos-latest
            args: --mac dmg zip --arm64
            artifact_name: desktop-release-darwin-arm64
          - os_type: macos
            target: darwin-x64
            runs_on: macos-13
            args: --mac dmg zip --x64
            artifact_name: desktop-release-darwin-x64
          - os_type: linux
            target: linux-x64
            runs_on: ubuntu-24.04
            args: --linux AppImage tar.gz --x64
            artifact_name: desktop-release-linux-x64
          - os_type: windows
            target: windows-x64
            runs_on: windows-2022
            args: --win nsis --x64
            artifact_name: desktop-release-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag }}
          fetch-depth: 0

      - name: Setup desktop build environment
        uses: ./.github/actions/setup-desktop-build-env
        with:
          os-type: ${{ matrix.os_type }}

      - name: Build Electron workflow artifacts
        uses: ./.github/actions/run-electron-release-build
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        with:
          os-type: ${{ matrix.os_type }}
          args: ${{ matrix.args }}
          artifact-name: ${{ matrix.artifact_name }}

  upload-electron-release-assets:
    name: Upload desktop release assets
    needs: [resolve-release, verify-release, publish-electron]
    if: needs.resolve-release.outputs.build_desktop == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-release.outputs.release_tag }}
          fetch-depth: 0

      - name: Download desktop workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: ${{ runner.temp }}/desktop-release-artifacts

      - name: Upload desktop assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/upload-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.resolve-release.outputs.release_tag }}" \
            --artifacts-dir "$RUNNER_TEMP/desktop-release-artifacts"
