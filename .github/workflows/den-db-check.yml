name: Den DB Check

on:
  pull_request:
    paths:
      - "ee/packages/den-db/src/schema.ts"
      - "ee/packages/den-db/src/schema/**"
      - "ee/packages/den-db/src/columns.ts"
      - "ee/packages/den-db/src/load-env.ts"
      - "ee/packages/den-db/src/mysql-config.ts"
      - "ee/packages/den-db/drizzle.config.ts"
      - "ee/packages/den-db/drizzle/**"
      - "ee/packages/den-db/scripts/check-migrations.mjs"
      - "ee/packages/den-db/package.json"
      - "ee/packages/utils/src/typeid.ts"
      - "ee/packages/utils/package.json"
      - "packages/types/src/den/**"
      - "packages/types/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/den-db-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations-in-sync:
    name: Schema and migrations in sync
    runs-on: blacksmith-4vcpu-ubuntu-2204
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter "@openwork-ee/den-db..."

      - name: Check committed migrations against the schema
        run: pnpm --filter @openwork-ee/den-db db:check
