name: PreRelease App

on:
  push:
    branches:
      - dev
      - feat/windows-sidecar

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    name: Prepare Prerelease
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.prerelease-meta.outputs.release_tag }}
      release_name: ${{ steps.prerelease-meta.outputs.release_name }}
      release_body: ${{ steps.prerelease-meta.outputs.release_body }}
    steps:
      - name: Set prerelease metadata
        id: prerelease-meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha=$(echo "$GITHUB_SHA" | cut -c1-7)
          tag="v${short_sha}-dev"
          name="OpenWork ${tag}"
          body="Automated Electron prerelease from ${GITHUB_REF_NAME} (${GITHUB_SHA})."
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "release_body<<__OPENWORK_RELEASE_BODY_EOF__"
            echo "$body"
            echo "__OPENWORK_RELEASE_BODY_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BODY_FILE="$RUNNER_TEMP/release_body.md"
          printf '%s\n' "${{ steps.prerelease-meta.outputs.release_body }}" > "$BODY_FILE"

          if gh release view "${{ steps.prerelease-meta.outputs.release_tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Prerelease already exists; skipping create."
            exit 0
          fi

          gh release create "${{ steps.prerelease-meta.outputs.release_tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "${{ steps.prerelease-meta.outputs.release_name }}" \
            --notes-file "$BODY_FILE" \
            --prerelease

  publish-electron:
    name: Build + Package (${{ matrix.target }})
    needs: prepare-release
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_type: macos
            target: darwin-arm64
            runs_on: macos-latest
            args: --mac dmg zip --arm64
            artifact_name: desktop-release-darwin-arm64
          - os_type: macos
            target: darwin-x64
            runs_on: macos-13
            args: --mac dmg zip --x64
            artifact_name: desktop-release-darwin-x64
          - os_type: linux
            target: linux-x64
            runs_on: ubuntu-24.04
            args: --linux AppImage tar.gz --x64
            artifact_name: desktop-release-linux-x64
          - os_type: windows
            target: windows-x64
            runs_on: windows-2022
            args: --win nsis --x64
            artifact_name: desktop-release-windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup desktop build environment
        uses: ./.github/actions/setup-desktop-build-env
        with:
          os-type: ${{ matrix.os_type }}

      - name: Build Electron workflow artifacts
        uses: ./.github/actions/run-electron-release-build
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          os-type: ${{ matrix.os_type }}
          args: ${{ matrix.args }}
          artifact-name: ${{ matrix.artifact_name }}

  upload-electron-release-assets:
    name: Upload desktop release assets
    needs: [prepare-release, publish-electron]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download desktop workflow artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: ${{ runner.temp }}/desktop-release-artifacts

      - name: Upload desktop assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release/upload-desktop-release-assets.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --tag "${{ needs.prepare-release.outputs.release_tag }}" \
            --artifacts-dir "$RUNNER_TEMP/desktop-release-artifacts"
