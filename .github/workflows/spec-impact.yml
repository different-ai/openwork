name: Spec Impact Snapshot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  advise:
    if: github.event.pull_request.draft == false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Compare implementation contracts with mapped specs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NO_RUNTIME_CHANGE: ${{ contains(github.event.pull_request.labels.*.name, 'no-runtime-change') }}
        run: |
          args=()
          if [[ "$NO_RUNTIME_CHANGE" != "true" ]]; then
            args+=(--strict-paths evals/specs/spec-impact-strict-paths.json)
          fi
          node evals/scripts/spec-impact.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --summary "$GITHUB_STEP_SUMMARY" \
            "${args[@]}"
