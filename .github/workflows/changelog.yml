name: Changelog

# The release workflow publishes releases with GITHUB_TOKEN, and GitHub never
# starts workflows from events created by that token, so `release: published`
# only fires when a human publishes by hand. The primary entry point is the
# `gh workflow run changelog.yml -f tag=...` dispatch issued by
# release-macos-aarch64.yml right after it flips the draft.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag to document (e.g. v0.18.13)
        required: true
        type: string

# The two jobs below state their own permissions. Only `changelog` can write.
permissions:
  contents: read

concurrency:
  group: changelog-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  # The agent reads pull request descriptions, which anyone who landed a change
  # can write and edit later, so it drafts in a job that can change nothing: a
  # read-only token, no stored git credentials, no environment secrets, and only
  # its model key. Its whole output is the artifact of drafted files, which the
  # `changelog` job checks before using.
  draft:
    if: github.repository == 'different-ai/openwork'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    outputs:
      base_sha: ${{ steps.base.outputs.sha }}

    steps:
      - name: Validate tag
        id: guard
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping changelog automation because $TAG is not a stable release tag."
          fi

      - name: Checkout
        if: steps.guard.outputs.stable == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Record the drafted revision
        if: steps.guard.outputs.stable == 'true'
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Skip if already documented
        if: steps.guard.outputs.stable == 'true'
        id: dedupe
        run: |
          if grep -Fq "[$TAG](https://github.com/different-ai/openwork/compare/" packages/docs/changelog.mdx; then
            echo "documented=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already documented; nothing to draft."
          else
            echo "documented=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.stable == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1

      - name: Gather release facts
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        id: facts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PUBLISHED_AT_EVENT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail

          if ! git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null; then
            echo "Release tag $TAG does not exist in the fetched repository." >&2
            exit 1
          fi

          PREV="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -x -B1 "$TAG" | head -n1)"
          if [[ -z "$PREV" || "$PREV" == "$TAG" ]]; then
            echo "Could not determine the stable release immediately before $TAG." >&2
            exit 1
          fi

          PUBLISHED_AT="$PUBLISHED_AT_EVENT"
          if [[ -z "$PUBLISHED_AT" ]]; then
            PUBLISHED_AT="$(gh release view "$TAG" --json publishedAt -q .publishedAt)"
          fi
          if [[ -z "$PUBLISHED_AT" ]]; then
            echo "Could not determine the published-at timestamp for $TAG." >&2
            exit 1
          fi

          COMMIT8="$(git rev-list -n1 "$TAG" | cut -c1-8)"
          SHORTSTAT="$(git diff --shortstat "$PREV".."$TAG")"
          INSERTIONS="$(grep -oE '[0-9]+ insertion' <<< "$SHORTSTAT" | grep -oE '[0-9]+' || true)"
          DELETIONS="$(grep -oE '[0-9]+ deletion' <<< "$SHORTSTAT" | grep -oE '[0-9]+' || true)"
          INSERTIONS="${INSERTIONS:-0}"
          DELETIONS="${DELETIONS:-0}"
          TOTAL=$((INSERTIONS + DELETIONS))
          LOC_LINE="$TOTAL lines changed since \`$PREV\` ($INSERTIONS insertions, $DELETIONS deletions)."

          IFS=$'\t' read -r DATE_LABEL TRACKER_FILE < <(node -e '
            const publishedAt = new Date(process.argv[1]);
            if (Number.isNaN(publishedAt.valueOf())) throw new Error("Invalid published-at timestamp");
            const day = publishedAt.getUTCDate();
            const mod100 = day % 100;
            const suffix = mod100 >= 11 && mod100 <= 13 ? "th" : ({ 1: "st", 2: "nd", 3: "rd" }[day % 10] || "th");
            const month = publishedAt.toLocaleString("en-US", { month: "long", timeZone: "UTC" });
            const date = publishedAt.toISOString().slice(0, 10);
            process.stdout.write(month + " " + day + suffix + "\tchangelog/release-tracker-" + date + ".md\n");
          ' "$PUBLISHED_AT")

          # PR descriptions, sorted by who they affect, are the agent's source of
          # truth. The file lives under .opencode/ so the agent can read it; it
          # is not one of the drafted files, so it never leaves this job.
          FACTS_MD=".opencode/release-facts/$TAG.md"
          mkdir -p .opencode/release-facts
          node scripts/release/collect-release-prs.mjs "$PREV" "$TAG" --markdown "$FACTS_MD"

          cat > /tmp/changelog_prompt.txt <<PROMPT_EOF
          Document OpenWork release $TAG in the changelog. Use these facts exactly; do not invent or recompute any of them.

          - version: $TAG
          - previous version: $PREV
          - release commit (short): $COMMIT8
          - published at (UTC): $PUBLISHED_AT
          - docs date label: $DATE_LABEL
          - tracker file: $TRACKER_FILE
          - loc line (copy verbatim into the tracker): $LOC_LINE
          - compare url: https://github.com/different-ai/openwork/compare/$PREV...$TAG
          - release facts file (read this first): $FACTS_MD
          PROMPT_EOF

      - name: Install opencode
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        run: |
          version="$(node -e "const fs=require('fs'); const parsed=JSON.parse(fs.readFileSync('constants.json','utf8')); process.stdout.write(String(parsed.opencodeVersion||'').trim().replace(/^v/,''));")"
          curl -fsSL https://opencode.ai/install | bash -s -- --version "$version" --no-modify-path

      - name: Draft changelog entries
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # The agent pins openai/gpt-6-luna. If that model is unavailable to this
        # key, discard any partial output and retry once on gpt-5.6-luna.
        run: |
          if ! opencode run --agent changelog "$(cat /tmp/changelog_prompt.txt)"; then
            echo "::warning::Changelog agent failed on its pinned model; retrying with openai/gpt-5.6-luna."
            git checkout -- packages/docs/changelog.mdx changelog/
            git clean -fd changelog/
            opencode run --agent changelog -m openai/gpt-5.6-luna "$(cat /tmp/changelog_prompt.txt)"
          fi

      - name: Upload drafted files
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: changelog-draft
          path: |
            packages/docs/changelog.mdx
            changelog/release-tracker-*.md
          if-no-files-found: error
          retention-days: 1

  # Everything that can write runs here, from a fresh checkout the agent never
  # touched: this job takes only the drafted changelog and tracker files, checks
  # them with the repository's own copy of the verifier, and then commits, opens
  # the pull request and updates the release.
  changelog:
    needs: draft
    if: github.repository == 'different-ai/openwork'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    # Only for the automation App's key (release tags and dev may use it).
    environment: warden-clearance
    env:
      HAS_AUTOMATION_APP: ${{ secrets.AUTOMATION_PRIVATE_KEY != '' }}
      BASE_BRANCH: dev
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      BRANCH_NAME: automation/changelog-${{ github.event.release.tag_name || inputs.tag }}-${{ github.run_id }}

    steps:
      - name: Validate tag
        id: guard
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "Skipping changelog automation because $TAG is not a stable release tag."
          fi

      - name: Checkout
        if: steps.guard.outputs.stable == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Skip if already documented
        if: steps.guard.outputs.stable == 'true'
        id: dedupe
        run: |
          if grep -Fq "[$TAG](https://github.com/different-ai/openwork/compare/" packages/docs/changelog.mdx; then
            echo "documented=true" >> "$GITHUB_OUTPUT"
            echo "$TAG is already documented; skipping docs generation and only refreshing the release notes."
          else
            echo "documented=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.stable == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1

      # Collected again here, by this checkout's script, so the check below does
      # not rely on anything the drafting job produced.
      - name: Gather release facts
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PREV="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | grep -x -B1 "$TAG" | head -n1)"
          if [[ -z "$PREV" || "$PREV" == "$TAG" ]]; then
            echo "Could not determine the stable release immediately before $TAG." >&2
            exit 1
          fi

          node scripts/release/collect-release-prs.mjs "$PREV" "$TAG" --json "$RUNNER_TEMP/release-facts.json"
          echo "PREV=$PREV" >> "$GITHUB_ENV"

      - name: Download drafted files
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: changelog-draft
          path: ${{ runner.temp }}/changelog-draft

      # The draft is data from a job this one does not trust. Take the changelog
      # page and release tracker files as plain files and refuse anything else.
      - name: Apply drafted files
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        env:
          BASE_SHA: ${{ needs.draft.outputs.base_sha }}
          MAX_DRAFT_BYTES: 1048576
        run: |
          set -euo pipefail

          draft="$RUNNER_TEMP/changelog-draft"

          # The draft holds whole files, so it only applies to the revision it
          # was written against.
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "The draft does not name a commit of this repository." >&2
            exit 1
          fi
          if ! git diff --quiet "$BASE_SHA" HEAD -- packages/docs/changelog.mdx changelog/; then
            echo "The changelog on $BASE_BRANCH changed while $TAG was being drafted. Run this workflow again for $TAG." >&2
            exit 1
          fi

          applied=0
          while IFS= read -r -d '' entry; do
            path="${entry#"$draft"/}"
            if [[ -L "$entry" ]]; then
              :
            elif [[ -d "$entry" ]]; then
              case "$path" in
                packages | packages/docs | changelog) continue ;;
              esac
            elif [[ -f "$entry" ]] \
              && [[ "$path" == "packages/docs/changelog.mdx" || "$path" =~ ^changelog/release-tracker-[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$ ]] \
              && (( $(wc -c < "$entry") <= MAX_DRAFT_BYTES )); then
              cp -- "$entry" "$path"
              applied=$((applied + 1))
              continue
            fi
            printf 'Unexpected or oversized entry in the changelog draft: %q\n' "$path" >&2
            exit 1
          done < <(find "$draft" -mindepth 1 -print0)

          if (( applied == 0 )); then
            echo "The changelog draft is empty." >&2
            exit 1
          fi

      - name: Verify generated output
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        run: node scripts/check-changelog-output.mjs "$TAG" "$PREV" --facts "$RUNNER_TEMP/release-facts.json"

      - name: Commit release notes
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        env:
          COMMIT_SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_KEY }}
        run: |
          set -euo pipefail

          signing_key="$RUNNER_TEMP/commit-signing-key"
          trap 'rm -f "$signing_key"' EXIT
          umask 077
          printf '%s\n' "$COMMIT_SIGNING_KEY" > "$signing_key"
          chmod 600 "$signing_key"

          git config --local user.email "11430621+benjaminshafii@users.noreply.github.com"
          git config --local user.name "benjaminshafii"
          git config --local gpg.format ssh
          git config --local user.signingkey "$signing_key"
          git switch -c "$BRANCH_NAME"
          git add packages/docs/changelog.mdx changelog/
          git commit -S -m "docs(changelog): release notes for $TAG"

      # Opened by the automation App once it is configured (AUTOMATION_APP_ID
      # and AUTOMATION_PRIVATE_KEY in the warden-clearance environment), so the
      # repository can turn off "Allow GitHub Actions to create and approve
      # pull requests". Not diff-warden: it approves this PR, and an App can't
      # approve its own. Falls back to GITHUB_TOKEN until then.
      - name: Mint PR token
        id: automation
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false' && env.HAS_AUTOMATION_APP == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      - name: Open pull request
        if: steps.guard.outputs.stable == 'true' && steps.dedupe.outputs.documented == 'false'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_TOKEN: ${{ steps.automation.outputs.token || github.token }}
        run: |
          set -euo pipefail

          git push --set-upstream origin "$BRANCH_NAME"
          printf '%s\n\n%s\n' \
            "These release notes were auto-generated from the pull request descriptions between \`$PREV\` and \`$TAG\` by the changelog agent and verified by \`scripts/check-changelog-output.mjs\`. The tracker's Pull requests table records why each change was included or left out." \
            "This is a docs-only change with no runtime surface." > /tmp/pr_body.txt
          pr_url="$(GH_TOKEN="$PR_TOKEN" gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH_NAME" \
            --title "docs(changelog): release notes for $TAG" \
            --body-file /tmp/pr_body.txt)"
          gh pr merge "$pr_url" --auto --squash --delete-branch

      # Runs for already-documented tags too, so a manual dispatch can repair a
      # release whose notes were hand-written or whose original dispatch failed.
      - name: Update GitHub Release notes
        if: steps.guard.outputs.stable == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release view "$TAG" --json body -q .body > /tmp/existing_release_body.md
          node scripts/release/release-notes-from-changelog.mjs "$TAG" \
            --existing-body /tmp/existing_release_body.md > /tmp/release_notes.md
          gh release edit "$TAG" --notes-file /tmp/release_notes.md
          echo "Replaced the static release body of $TAG with the generated changelog entry."
