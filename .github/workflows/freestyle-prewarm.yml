name: Freestyle preview prewarm

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      soak_runs:
        description: "After the normal checks, repeat the full ACME verification this many times against the same snapshot (0 = off, max 60). Fails unless every run passes."
        type: number
        default: 0
      soak_concurrency:
        description: "How many soak runs launch at once (1-10)."
        type: number
        default: 5

permissions:
  contents: read

jobs:
  prewarm:
    # Repository secrets are never supplied to fork or Dependabot PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.soak_runs > 0 && 50 || 16 }}
    strategy:
      fail-fast: false
      matrix:
        world: [app-web, acme-web, desktop]
    concurrency:
      group: freestyle-prewarm-${{ github.event.pull_request.head.sha || github.sha }}-${{ matrix.world }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Trusted, reviewed controller only. PR source is fetched inside the
          # credential-free guest VM; never checked out on this runner.
          # Update this pin only after reviewing controller/dependency changes.
          ref: b657b383e4af654f88480ef86676477aae499b43
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install snapshot controller only
        run: pnpm --filter @openwork/freestyle... install --frozen-lockfile --ignore-scripts
      - name: Prepare reusable snapshot
        id: prepare
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          # Only the pinned host controller reads public Git tree metadata.
          # Neither this token nor the Freestyle key enters any guest VM.
          OPENWORK_PREVIEW_GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_WORLD: ${{ matrix.world }}
        run: |
          node scripts/prepare-freestyle-preview.ts "$PREVIEW_SHA" "$PREVIEW_WORLD"
          echo "Prepared $PREVIEW_WORLD snapshot for $PREVIEW_SHA. Every launch still creates a separate VM." >> "$GITHUB_STEP_SUMMARY"
      - name: Save sanitized snapshot preparation timings
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freestyle-build-proof-${{ matrix.world }}
          path: freestyle-build-proof-${{ matrix.world }}.json
          retention-days: 7
          if-no-files-found: error
      - name: Measure and verify two independent running clones
        if: matrix.world == 'acme-web'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-freestyle-preview.ts "$PREVIEW_SHA"
      - name: Measure and verify a restored OpenWork web clone
        if: matrix.world == 'app-web'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-freestyle-fast-app.ts "$PREVIEW_SHA"
      - name: Verify two independent signed-out desktop-only clones
        if: matrix.world == 'desktop'
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/verify-freestyle-desktop.ts "$PREVIEW_SHA"
      - name: Save sanitized desktop-only measurements
        if: matrix.world == 'desktop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freestyle-desktop-launch-proof
          path: freestyle-desktop-launch-proof.json
          retention-days: 7
          if-no-files-found: error
      - name: Save sanitized OpenWork web measurements
        if: matrix.world == 'app-web'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freestyle-app-launch-proof
          path: freestyle-app-launch-proof.json
          retention-days: 7
          if-no-files-found: error
      - name: Save sanitized launch measurements
        if: matrix.world == 'acme-web'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freestyle-launch-proof
          path: freestyle-launch-proof.json
          retention-days: 7
          if-no-files-found: error
      # Manual only: `gh workflow run freestyle-prewarm.yml --ref <branch> -f soak_runs=30`.
      # Runs even when the single verification above failed, so a soak measures
      # the snapshot rather than stopping at the first flake.
      - name: Soak the ACME snapshot with repeated independent launches
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && matrix.world == 'acme-web' && github.event_name == 'workflow_dispatch' && inputs.soak_runs > 0 }}
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          PREVIEW_SHA: ${{ github.sha }}
          SOAK_RUNS: ${{ inputs.soak_runs }}
          SOAK_CONCURRENCY: ${{ inputs.soak_concurrency }}
        run: node scripts/soak-freestyle-preview.ts "$PREVIEW_SHA" "$SOAK_RUNS" "$SOAK_CONCURRENCY"
      - name: Save sanitized soak results
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && matrix.world == 'acme-web' && github.event_name == 'workflow_dispatch' && inputs.soak_runs > 0 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freestyle-soak-proof
          path: freestyle-soak-proof.json
          retention-days: 7
          if-no-files-found: warn
