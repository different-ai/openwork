name: Build Organization Installer Bundle

# Packages the unchanged signed generic installer, the unchanged signed desktop
# release, and an explicit organization config. It never compiles or signs a
# customer-specific executable.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Exact signed OpenWork release (for example v0.18.0)"
        required: true
        type: string
      app_name:
        description: "Application display name shown to end users"
        required: false
        type: string
        default: "OpenWork"
      client_name:
        description: "Organization name shown before installation"
        required: true
        type: string
      web_url:
        description: "Organization Den web origin (HTTPS)"
        required: true
        type: string
      api_url:
        description: "Organization Den API origin (HTTPS)"
        required: true
        type: string
      client_logo_url:
        description: "Optional organization wordmark URL (HTTPS)"
        required: false
        type: string
        default: ""
      client_icon_url:
        description: "Optional square organization icon URL (HTTPS)"
        required: false
        type: string
        default: ""
      require_signin:
        description: "Require organization sign-in"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-organization-installer-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  package:
    name: Package organization installers
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write organization config
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          APP_NAME: ${{ inputs.app_name }}
          CLIENT_NAME: ${{ inputs.client_name }}
          WEB_URL: ${{ inputs.web_url }}
          API_URL: ${{ inputs.api_url }}
          LOGO_URL: ${{ inputs.client_logo_url }}
          ICON_URL: ${{ inputs.client_icon_url }}
          REQUIRE_SIGNIN: ${{ inputs.require_signin }}
        run: |
          mkdir -p "$RUNNER_TEMP/openwork-enterprise"
          node -e '
            const config = {
              schemaVersion: 1,
              appName: process.env.APP_NAME?.trim() || "OpenWork",
              appVersion: process.env.RELEASE_TAG?.trim().replace(/^v/i, ""),
              clientName: process.env.CLIENT_NAME?.trim(),
              webUrl: process.env.WEB_URL?.trim(),
              apiUrl: process.env.API_URL?.trim(),
              requireSignin: process.env.REQUIRE_SIGNIN === "true",
              logoUrl: process.env.LOGO_URL?.trim() || null,
              iconUrl: process.env.ICON_URL?.trim() || null,
            }
            require("node:fs").writeFileSync(
              process.env.RUNNER_TEMP + "/openwork-enterprise/openwork-installer.json",
              JSON.stringify(config, null, 2) + "\n",
              { mode: 0o600 },
            )
          '

      - name: Build deterministic organization bundle
        run: |
          for platform in mac-arm64 mac-x64 win-x64; do
            pnpm enterprise-installer:build -- \
              --config "$RUNNER_TEMP/openwork-enterprise/openwork-installer.json" \
              --platform "$platform" \
              --output "$RUNNER_TEMP/openwork-enterprise/output"
          done

      - name: Upload private organization bundle
        uses: actions/upload-artifact@v4
        with:
          name: organization-installer-bundles
          path: |
            ${{ runner.temp }}/openwork-enterprise/output/*.zip
            ${{ runner.temp }}/openwork-enterprise/output/*.sha256
          if-no-files-found: error
          retention-days: 30
