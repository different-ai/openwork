name: Generated Den SDK

on:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  scope:
    name: Select SDK inputs
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.inputs.outcome == 'success' && steps.inputs.outputs.fingerprint != '' && steps.inputs.outputs.affected || 'true' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Compare SDK build inputs
        id: inputs
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/build-inputs.mjs --target sdk --base "$BASE_SHA" --head "$HEAD_SHA"

  generated-sdk:
    needs: scope
    # Missing outputs, checkout/selection errors and unknown ranges must build.
    if: ${{ !cancelled() && needs.scope.outputs.affected != 'false' }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: openwork_sdk_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/openwork_sdk_ci
      DEN_DB_ENCRYPTION_KEY: local-dev-db-encryption-key-please-change-1234567890
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      # Contract generation builds the API workspace closure; the root supplies
      # shared tooling and the SDK supplies its generator/typechecker.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter "@openwork-ee/den-api..." --filter "@different-ai/openwork-workspace" --filter "@openwork/sdk"
      - run: pnpm sdk:check
      - run: pnpm sdk:build
