name: Quick check

# The one check every PR waits for (`openwork-tests-required`): the highest
# risks only, in about a minute. Everything else runs after merge: unit tests,
# full Den API security tests and the desktop build on every dev push ("Build
# and core checks"), core journeys on dev pushes and nightly, the packaged
# desktop before each alpha release ("Packaged desktop smoke"). See
# docs/ci-build-scopes.md for where each check runs.
on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: quick-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  quick-select:
    name: Select quick checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      den_quick: ${{ steps.classify.outputs.den_quick }}
    steps:
      # Classification reads only its scripts and the workspace manifests.
      - name: Checkout build inputs
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts/
            /apps/*/package.json
            /packages/*/package.json
            /ee/apps/*/package.json
            /ee/packages/*/package.json
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require("node:url")
            const scripts = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/`)
            const { isBuildAffected } = await import(new URL("build-inputs.mjs", scripts))
            const { classifyQuickChanges, pullRequestChanges } = await import(new URL("classify-ci-changes.mjs", scripts))
            let files = null
            let expectedCount = null
            if (context.eventName === "pull_request") {
              ;({ files, expectedCount } = await pullRequestChanges({
                github, ...context.repo,
                number: context.payload.pull_request.number,
                head: context.payload.pull_request.head.sha,
              }))
              if (files === null) core.warning("A complete changed-file comparison is unavailable; selecting every quick check.")
            }
            const selection = classifyQuickChanges({ eventName: context.eventName, files, expectedCount }, isBuildAffected)
            for (const [name, value] of Object.entries(selection)) core.setOutput(name, String(value))
            core.info(`Selected quick checks: ${JSON.stringify(selection)}`)

  # Source-only guards: CI selection and policy, outbound access, and the
  # feature registry with its Helm chart. No workspace install.
  quick-static:
    name: Static CI, outbound access and feature registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Test CI selection, fork and Warden policy, CodeQL scope and timing
        run: >-
          node --test
          .github/scripts/alpha-windows.test.mjs
          .github/scripts/contributor-pr.test.mjs
          .github/scripts/contributor-screen.test.mjs
          .github/scripts/warden-check.test.mjs
          .github/scripts/warden-report.test.mjs
          .github/scripts/warden-fast.test.mjs
          .github/scripts/warden-fixer.test.mjs
          .github/scripts/warden-model-proxy.test.mjs
          .github/scripts/evidence-presentation.test.mjs
          .github/scripts/evidence-preview-card.test.mjs
          .github/scripts/setup-browser.test.mjs
          .github/scripts/pr-proof-review-build.test.mjs
          .github/scripts/pr-proof-selection.test.mjs
          .github/scripts/ci-time-to-green.test.mjs
          evals/scripts/engine-parity-binaries.test.mjs
          evals/scripts/run-parity-proof.test.mjs
          .github/scripts/build-inputs.test.mjs
          .github/scripts/classify-ci-changes.test.mjs
          .github/scripts/typecheck-shipped.test.mjs
          .github/scripts/docs-validation.test.mjs
          .github/scripts/ee-image-inputs.test.mjs
          .github/scripts/render-build-filters.test.mjs
          .github/scripts/runtime-scope.test.mjs
          .github/scripts/build-boundaries-native.test.mjs
          .github/scripts/build-boundaries-codeql.test.mjs
          scripts/ci/codeql-config.test.mjs
          scripts/ci/check-codeql-results.test.mjs
      - name: Check outbound access manifest
        run: node scripts/check-outbound-access.mjs
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      # pnpm's own record of verified lockfiles: an unchanged lockfile is not re-verified.
      - name: Cache pnpm's lockfile policy check
        uses: actions/cache@v5
        continue-on-error: true
        with:
          path: ~/.cache/pnpm/lockfile-verified.jsonl
          key: ${{ runner.os }}-pnpm-lockfile-verified-${{ hashFiles('pnpm-lock.yaml', 'evals/pnpm-lock.yaml', 'pnpm-workspace.yaml', 'evals/pnpm-workspace.yaml') }}
      - name: Install the feature registry's dependencies
        run: pnpm install --frozen-lockfile --prefer-offline --filter "@openwork/features"
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Test the feature resolver
        run: pnpm --filter @openwork/features test
      - name: Check the feature registry, Helm chart and guard rules
        run: pnpm features:check

  # Shipped code (tests left out) of every changed package and every package
  # that depends on it, plus Electron main when the desktop is affected.
  quick-typecheck:
    name: Typecheck shipped code
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The PR merge commit and its base parent, or the pushed range's tip.
          fetch-depth: 2
      - name: Setup dependencies
        uses: ./.github/actions/setup-tests
        with:
          engine: "false"
          evals: "false"
      - name: Typecheck changed packages and their dependents
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            node .github/scripts/typecheck-shipped.mjs --base HEAD^1 --head HEAD
          elif [ "$EVENT_NAME" = push ] && [ -n "${PUSH_BASE:-}" ] && ! [[ "$PUSH_BASE" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 origin "$PUSH_BASE" || true
            node .github/scripts/typecheck-shipped.mjs --base "$PUSH_BASE" --head HEAD
          else
            node .github/scripts/typecheck-shipped.mjs --all
          fi

  # Security-critical Den API rules (roles, tenants, API keys, sessions, OAuth,
  # audit secrets, feature rollouts) against the real app and MySQL, plus audit
  # route coverage, when Den API inputs change. The full suite runs in six
  # shards on every dev push ("Build and core checks").
  den-quick:
    name: Den API auth and permission tests
    needs: quick-select
    if: needs.quick-select.outputs.den_quick == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 10
    env:
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/openwork_den
      DEN_DB_ENCRYPTION_KEY: local-dev-db-encryption-key-please-change-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # MySQL boots while dependencies install; the tests wait for it below.
      - name: Start MySQL
        run: docker compose -p openwork-den-local -f packaging/docker/docker-compose.web-local.yml -f packaging/docker/docker-compose.ci-mysql.yml up -d mysql
      - name: Setup dependencies
        uses: ./.github/actions/setup-tests
        with:
          engine: "false"
          evals: "false"
      - name: Build the Den API's workspace dependencies
        run: pnpm --filter @openwork-ee/den-api build:workspace-dependencies
      - name: Wait for MySQL
        run: docker compose -p openwork-den-local -f packaging/docker/docker-compose.web-local.yml -f packaging/docker/docker-compose.ci-mysql.yml up -d --wait mysql
      - name: Run the security tests and check audit route coverage
        run: |
          set -euo pipefail
          # Route introspection imports the app, whose Better Auth registry needs
          # the schema; it runs beside the tests on its own database.
          (pnpm --filter @openwork-ee/den-db exec node --import tsx ./node_modules/drizzle-kit/bin.cjs push --force \
            && pnpm --filter @openwork-ee/den-api audit:coverage) > "$RUNNER_TEMP/audit-coverage.log" 2>&1 &
          coverage=$!
          tests=0
          pnpm --filter @openwork-ee/den-api test:api:security || tests=$?
          audit=0
          wait "$coverage" || audit=$?
          echo "::group::Audit route coverage"
          cat "$RUNNER_TEMP/audit-coverage.log"
          echo "::endgroup::"
          [ "$audit" -eq 0 ] || echo "::error::Audit route coverage failed"
          [ "$tests" -eq 0 ] && [ "$audit" -eq 0 ]

  # Single stable context for branch rulesets to require. Every always-run
  # quick check must succeed; the Den job must succeed when selected and be
  # skipped otherwise. Classification failure never green-skips the Den tests.
  openwork-tests-required:
    needs: [quick-select, quick-static, quick-typecheck, den-quick]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the policy module is needed; the runner's preinstalled Node runs it.
      - name: Checkout required-check policy
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts/classify-ci-changes.mjs
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Require every selected quick check to pass
        env:
          SELECT_RESULT: ${{ needs.quick-select.result }}
          STATIC_RESULT: ${{ needs.quick-static.result }}
          TYPECHECK_RESULT: ${{ needs.quick-typecheck.result }}
          DEN_QUICK: ${{ needs.quick-select.outputs.den_quick }}
          DEN_QUICK_RESULT: ${{ needs.den-quick.result }}
        run: |
          node --input-type=module <<'NODE'
          import { assertQuickChecks } from "./.github/scripts/classify-ci-changes.mjs"
          const { env } = process
          const checks = {
            classification: env.SELECT_RESULT,
            always: { static: env.STATIC_RESULT, typecheck: env.TYPECHECK_RESULT },
            selected: { den_quick: env.DEN_QUICK },
            results: { den_quick: env.DEN_QUICK_RESULT },
          }
          console.log(JSON.stringify(checks, null, 2))
          assertQuickChecks(checks)
          NODE
