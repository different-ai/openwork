name: PR change proof

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-change-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
      liveMatrix: ${{ steps.select.outputs.liveMatrix }}
      liveSelected: ${{ steps.select.outputs.liveSelected }}
      daytonaMatrix: ${{ steps.select.outputs.daytonaMatrix }}
      daytonaSelected: ${{ steps.select.outputs.daytonaSelected }}
      checkpointMatrix: ${{ steps.select.outputs.checkpointMatrix }}
      checkpointSelected: ${{ steps.select.outputs.checkpointSelected }}
      packagedMatrix: ${{ steps.select.outputs.packagedMatrix }}
      packagedSelected: ${{ steps.select.outputs.packagedSelected }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-proof-controller.mjs

  proof:
    needs: select
    if: needs.select.outputs.selected == 'true'
    # Same runner as the nightly local journey lane; hosted ubuntu-latest lacks
    # the setup Electron needs and every desktop proof died before CDP.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - uses: ./.github/actions/setup-browser
        with:
          oauth-handoff: "true"
      - name: Build local Den dependencies and the review app
        shell: bash
        run: |
          pnpm --filter @openwork/types build
          pnpm --filter @openwork-ee/den-db build
          pnpm --filter @openwork/email build
          pnpm --filter @openwork/review-app build
          pnpm dev:den:mysql
      - name: Run the selected changed spec on the PR head
        timeout-minutes: 20
        env:
          PROOF_SPEC: ${{ matrix.spec }}
          # CI runners cannot use Chromium's SUID sandbox (the pnpm-store helper
          # is not root-owned). The testkit's container mode launches Electron
          # with --no-sandbox, as it already does on Daytona.
          OPENWORK_EVAL_CONTAINER_ELECTRON: "1"
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if [ "$PROOF_SPEC" = 'evals/specs/opencode-v2-session-home.e2e.test.ts' ]; then
            xvfb-run -a node evals/bin/evals.mjs "${PROOF_SPEC#evals/}" --local --engine v2 --surface web
          elif node evals/scripts/run-parity-proof.mjs --supports "$PROOF_SPEC"; then
            xvfb-run -a node evals/scripts/run-parity-proof.mjs "$PROOF_SPEC"
          else
            xvfb-run -a node evals/bin/evals.mjs "${PROOF_SPEC#evals/}" --local
          fi
      - name: Save selected native testkit and Vitest records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-proof-${{ github.run_attempt }}-${{ matrix.key }}
          path: |
            evals/results/test-runs/
            evals/results/.testkit/cli-run-*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # Packaged specs need a packaged desktop binary. Build the same Linux
  # artifacts as the packaged smoke gate and run only the changed journey.
  packaged-proof:
    needs: select
    if: needs.select.outputs.packagedSelected == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.packagedMatrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Cache Electron and pinned sidecars
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            apps/desktop/resources/sidecars
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-smoke-${{ hashFiles('constants.json', 'pnpm-lock.yaml', 'apps/desktop/scripts/prepare-sidecar.mjs') }}
      - uses: ./.github/actions/setup-tests
      - name: Bundle the server plugins the way packaged builds do
        run: |
          rm -rf packages/types/dist
          pnpm --filter openwork-server build
      - name: Run the selected packaged spec against the packaged desktop
        timeout-minutes: 20
        env:
          PROOF_JOURNEY: ${{ matrix.journey }}
          OPENWORK_PACKAGED_SMOKE_DIR: ${{ runner.temp }}/openwork-packaged-smoke
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Same Chromium SUID-sandbox constraint as the proof job above.
          OPENWORK_EVAL_CONTAINER_ELECTRON: "1"
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          node apps/desktop/scripts/packaged-smoke.mjs --server-built --journey "$PROOF_JOURNEY"
      - name: Save selected native testkit and Vitest records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-proof-${{ github.run_attempt }}-${{ matrix.key }}
          path: |
            evals/results/test-runs/
            evals/results/.testkit/cli-run-*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  live-proof:
    needs: select
    if: >-
      needs.select.outputs.liveSelected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.base.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.triggering_actor != 'dependabot[bot]'
    environment: pr-slow-specs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.liveMatrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - uses: ./.github/actions/setup-browser
        with:
          oauth-handoff: "true"
      - name: Build local app dependencies without live credentials
        run: |
          pnpm --filter @openwork/types build
          pnpm --filter @openwork-ee/den-db build
          pnpm --filter @openwork/email build
          pnpm --filter @openwork/review-app build
          pnpm dev:den:mysql
      - name: Run the whole selected live spec with real inference
        timeout-minutes: 45
        env:
          PROOF_SPEC: ${{ matrix.spec }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWORK_EVAL_LIVE_OPENAI: "1"
          OPENWORK_EVAL_OPENAI_MODEL: gpt-5.4
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if [ "$PROOF_SPEC" != 'evals/specs/live-stream-continuity.e2e.test.ts' ] && [ "$PROOF_SPEC" != 'evals/specs/engine-live-chat.e2e.test.ts' ]; then
            printf '%s\n' '::error::Unsupported live proof selection. Add an explicit reviewed live-spec policy before running another file.' >&2
            exit 1
          fi
          if [[ -z "${OPENAI_API_KEY//[[:space:]]/}" ]]; then
            printf '%s\n' '::error::OPENAI_API_KEY is required for selected live proof. Configure repository/environment access and approve pr-slow-specs; this proof cannot be skipped.' >&2
            exit 1
          fi
          if [ "$PROOF_SPEC" = 'evals/specs/engine-live-chat.e2e.test.ts' ]; then
            OPENWORK_LIVE_PROVIDER=OpenAI OPENWORK_LIVE_KEY_ENV=OPENAI_API_KEY \
              OPENWORK_LIVE_MODELS=gpt-5.4,gpt-4.1-mini OPENWORK_EVAL_CONTAINER_ELECTRON=1 \
              xvfb-run -a node evals/scripts/run-parity-proof.mjs "$PROOF_SPEC"
          else
            xvfb-run -a node evals/bin/evals.mjs "${PROOF_SPEC#evals/}" --local --engine v1 --surface web
          fi
      - name: Save selected native testkit and Vitest records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-proof-${{ github.run_attempt }}-${{ matrix.key }}
          path: |
            evals/results/test-runs/
            evals/results/.testkit/cli-run-*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  checkpoint-proof:
    needs: select
    if: >-
      needs.select.outputs.checkpointSelected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.base.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]'
    environment: pr-slow-specs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.checkpointMatrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - uses: ./.github/actions/setup-browser
      - name: Build this branch's review app
        run: pnpm --filter @openwork/review-app build
      - name: Prove live memory and internal stream restoration
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          CHECKPOINT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/prove-freestyle-checkpoints.ts
      - name: Prepare this branch's isolated web world
        timeout-minutes: 35
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          OPENWORK_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          OPENWORK_PREVIEW_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-evidence-web.ts
      - name: Prove screenshot to saved browser on this head
        id: proof
        timeout-minutes: 15
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          OPENWORK_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          OPENWORK_PREVIEW_GITHUB_TOKEN: ${{ github.token }}
          PROOF_SPEC: ${{ matrix.spec }}
        run: |
          test "$PROOF_SPEC" = 'evals/specs/web-checkpoint-fork.e2e.test.ts'
          xvfb-run -a pnpm evals:e2e web-checkpoint-fork --local --engine v1 --surface web --checkpoints
      - name: Save the platform prerequisite receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-memory-${{ github.run_attempt }}
          path: results/checkpoint-probe/report.json
          retention-days: 7
          if-no-files-found: error
      - name: Save selected native testkit and Vitest records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-proof-${{ github.run_attempt }}-${{ matrix.key }}
          path: |
            evals/results/test-runs/
            evals/results/.testkit/cli-run-*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Publish the branch-format report
        if: always() && steps.proof.outcome != 'skipped'
        id: report
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.OPENWORK_REVIEW_BLOB_TOKEN }}
          OPENWORK_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/publish-checkpoint-evidence.ts
      - name: Deploy a separate protected review preview from this head
        if: always() && steps.report.outcome == 'success'
        id: preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.OPENWORK_REVIEW_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.OPENWORK_REVIEW_VERCEL_PROJECT_ID }}
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.OPENWORK_REVIEW_BLOB_TOKEN }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_PROJECT_ID" && test -n "$VERCEL_ORG_ID"
          url="$(pnpm dlx vercel@48 deploy --target preview --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --meta githubCommitSha="$SOURCE_SHA" --env FREESTYLE_API_KEY="$FREESTYLE_API_KEY" --env BLOB_READ_WRITE_TOKEN="$BLOB_READ_WRITE_TOKEN")"
          case "$url" in https://*.vercel.app) ;; *) echo 'Unexpected review deployment URL' >&2; exit 1;; esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # Never move the shared review alias. This PR keeps its own deployment.
      - name: Verify anonymous access is blocked and link the branch report
        if: always() && steps.preview.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.OPENWORK_REVIEW_VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.OPENWORK_REVIEW_VERCEL_PROJECT_ID }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          REPORT_ID: ${{ steps.report.outputs.report_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_STATE: ${{ steps.proof.outcome == 'success' && 'success' || 'failure' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          for path in "/r/$REPORT_ID" "/r/$REPORT_ID/assets/report.json"; do
            headers="$(curl -sS -o /dev/null -D - --max-time 30 "$PREVIEW_URL$path")"
            status="$(printf '%s' "$headers" | head -n1 | awk '{print $2}')"
            location="$(printf '%s' "$headers" | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')"
            if [ "$status" != 401 ]; then
              test "$status" = 302 && [[ "$location" == https://vercel.com/sso-api* ]]
            fi
          done
          # vercel curl consumes VERCEL_TOKEN from env; --token is forwarded to curl.
          pnpm dlx vercel@59.24.0 curl "/r/$REPORT_ID" --deployment "$PREVIEW_URL" --scope "$VERCEL_ORG_ID" -- --fail --silent --output /dev/null
          printf '## Interactive checkpoint evidence\n\n[Open this branch’s report](%s/r/%s). This protected preview runs the PR code; nothing needs to merge first. Checkpoints expire after 24 hours.\n' "$PREVIEW_URL" "$REPORT_ID" >> "$GITHUB_STEP_SUMMARY"
          # A distinct entry point avoids the shared reviewer's older, static-only UI.
          gh api --silent --method POST "repos/$GITHUB_REPOSITORY/statuses/$SOURCE_SHA" \
            -f state="$PROOF_STATE" -f context='OpenWork Checkpoints' \
            -f target_url="$PREVIEW_URL/r/$REPORT_ID" \
            -f description='Interactive browser checkpoints; see report for test verdict'
          gh pr comment "$PR_NUMBER" --body "<!-- web-checkpoint-preview -->
          **[Open saved browsers from this PR]($PREVIEW_URL/r/$REPORT_ID)**
          Use the **OpenWork Checkpoints** check for this interactive report. Pictures with **Open from here** restore a private copy of the app; **New copy** restores that same checkpoint again. Review-page images and UI-state examples are screenshot-only. Checkpoints expire after 24 hours. The report records the actual test verdict."

  windows-proof:
    needs: select
    if: >-
      needs.select.outputs.daytonaSelected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.base.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.triggering_actor != 'dependabot[bot]'
    environment: pr-slow-specs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.daytonaMatrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - name: Install reviewed Daytona CLI
        env:
          GH_TOKEN: ${{ github.token }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          DAYTONA_CLI_TAG: v0.216.1
          DAYTONA_CLI_SHA256: 8ee3a1f8bd5ef307b906cbb48a6888673a3a2221854e11f2cbbf9785e7fc2385
        run: |
          set -euo pipefail
          test -n "${DAYTONA_API_KEY//[[:space:]]/}"
          gh release download "$DAYTONA_CLI_TAG" --repo daytona/clients --pattern daytona-linux-amd64 --output /tmp/daytona --clobber
          echo "$DAYTONA_CLI_SHA256  /tmp/daytona" | sha256sum -c -
          sudo install -m 0755 /tmp/daytona /usr/local/bin/daytona
          daytona login --api-key "$DAYTONA_API_KEY"
      - name: Prove the published Windows desktop on the PR head
        timeout-minutes: 40
        env:
          PROOF_SPEC: ${{ matrix.spec }}
          OPENWORK_EVAL_REF: ${{ github.event.pull_request.head.sha }}
          OPENWORK_EVAL_MODEL: big-pickle
        run: |
          set -euo pipefail
          test "$PROOF_SPEC" = 'evals/specs/windows-published-preview.e2e.test.ts'
          pnpm evals:e2e windows-published-preview --daytona --strict-ref
      - name: Save selected native testkit and Vitest records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-proof-${{ github.run_attempt }}-${{ matrix.key }}
          path: |
            evals/results/test-runs/
            evals/results/.testkit/cli-run-*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
