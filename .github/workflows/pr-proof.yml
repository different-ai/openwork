name: PR change proof

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-change-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      internalContributor: ${{ steps.select.outputs.internalContributor }}
      coreMatrix: ${{ steps.select.outputs.coreMatrix }}
      coreSelected: ${{ steps.select.outputs.coreSelected }}
      matrix: ${{ steps.select.outputs.matrix }}
      selected: ${{ steps.select.outputs.selected }}
      checkpointMatrix: ${{ steps.select.outputs.checkpointMatrix }}
      checkpointSelected: ${{ steps.select.outputs.checkpointSelected }}
      packagedMatrix: ${{ steps.select.outputs.packagedMatrix }}
      packagedSelected: ${{ steps.select.outputs.packagedSelected }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/pr-proof-controller.mjs

  # Core journeys: the app, Den, gateway and model run in a Freestyle world built
  # from this commit. The runner installs only the test tools and drives it.
  # The end-state checkpoint is the PR's preview.
  core:
    name: Core journey
    needs: select
    if: >-
      needs.select.outputs.coreSelected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.base.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]'
    environment:
      name: >-
        ${{ github.event.repository.owner.type == 'Organization' &&
            github.event.pull_request.user.type == 'User' &&
            contains(fromJSON('["MEMBER", "OWNER"]'), github.event.pull_request.author_association) &&
            needs.select.outputs.internalContributor == 'true' &&
            'pr-internal-specs' || 'pr-slow-specs' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Sandbox provider for evidence worlds: a repository variable, Freestyle when unset.
      OPENWORK_EVIDENCE_PROVIDER: ${{ vars.OPENWORK_EVIDENCE_PROVIDER || 'freestyle' }}
      # Disposable Core PR worlds skip template saves; dev warm-up is unchanged.
      OPENWORK_DAYTONA_EPHEMERAL_WORLD: '1'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.coreMatrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - id: store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore the pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.store.outputs.path }}
          key: ${{ runner.os }}-pnpm-core-${{ hashFiles('pnpm-lock.yaml', 'evals/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-core-
      - name: Install only the test tools
        run: |
          pnpm --filter @openwork/freestyle... --filter @openwork/daytona-evidence... --filter @openwork/review... --filter @openwork/world... --filter @openwork/types... --filter @openwork/sdk... install --frozen-lockfile --ignore-scripts --prefer-offline
          pnpm --dir evals install --frozen-lockfile --ignore-scripts --prefer-offline
      - name: Prepare this commit's evidence world
        timeout-minutes: 35
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENWORK_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          OPENWORK_PREVIEW_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-evidence-web.ts
      - name: Run the core journey and save its end state as the preview
        timeout-minutes: 15
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENWORK_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          OPENWORK_PREVIEW_GITHUB_TOKEN: ${{ github.token }}
          PROOF_SPEC: ${{ matrix.spec }}
        run: node evals/bin/evals.mjs "${PROOF_SPEC#evals/}" --local --engine v1 --surface web --checkpoints
      - name: Save testkit and Vitest records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-proof-${{ github.run_attempt }}-${{ matrix.key }}
          path: |
            evals/results/test-runs/
            evals/results/.testkit/cli-run-*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  proof:
    needs: select
    if: needs.select.outputs.selected == 'true'
    # Same runner as the nightly local journey lane; hosted ubuntu-latest lacks
    # the setup Electron needs and every desktop proof died before CDP.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - uses: ./.github/actions/setup-browser
        with:
          oauth-handoff: "true"
      # Electron 43 installs its executable lazily rather than in postinstall.
      # Keep that download outside the native world's CDP startup deadline.
      - name: Install and verify the locked Electron runtime
        timeout-minutes: 5
        run: |
          pnpm --filter @openwork/desktop exec install-electron
          pnpm --filter @openwork/desktop exec node -e 'const fs = require("node:fs"); const binary = require("electron"); fs.accessSync(binary, fs.constants.X_OK); console.log("Electron executable is ready")'
      - name: Build local Den dependencies
        uses: ./.github/actions/den-deps
      - name: Run the selected changed spec on the PR head
        timeout-minutes: 20
        env:
          PROOF_SPEC: ${{ matrix.spec }}
          # Review worlds build production output on first use; other worlds
          # need no review app. No shared build output or credentials involved.
          OPENWORK_EVAL_BUILD_REVIEW_APP: "1"
          # CI runners cannot use Chromium's SUID sandbox (the pnpm-store helper
          # is not root-owned). The testkit's container mode launches Electron
          # with --no-sandbox, as it already does on Daytona.
          OPENWORK_EVAL_CONTAINER_ELECTRON: "1"
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if node evals/scripts/run-parity-proof.mjs --supports "$PROOF_SPEC"; then
            xvfb-run -a node evals/scripts/run-parity-proof.mjs "$PROOF_SPEC"
          else
            xvfb-run -a node evals/bin/evals.mjs "${PROOF_SPEC#evals/}" --local
          fi
      - name: Save selected native testkit and Vitest records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-proof-${{ github.run_attempt }}-${{ matrix.key }}
          path: |
            evals/results/test-runs/
            evals/results/.testkit/cli-run-*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # Packaged specs need a packaged desktop binary. Build the same artifacts as
  # the packaged smoke gate for the spec's platform and run only that journey.
  packaged-proof:
    needs: select
    if: needs.select.outputs.packagedSelected == 'true'
    runs-on: ${{ matrix.os == 'macos' && 'blacksmith-12vcpu-macos-15' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: ${{ matrix.os == 'macos' && 45 || 30 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.packagedMatrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Cache Electron and pinned sidecars
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            apps/desktop/resources/sidecars
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-smoke-${{ hashFiles('constants.json', 'pnpm-lock.yaml', 'apps/desktop/scripts/prepare-sidecar.mjs') }}
      - uses: ./.github/actions/setup-tests
      - name: Bundle the server plugins the way packaged builds do
        run: |
          rm -rf packages/types/dist
          pnpm --filter openwork-server build
      - name: Run the selected packaged spec against the packaged desktop
        timeout-minutes: ${{ matrix.os == 'macos' && 30 || 20 }}
        env:
          PROOF_JOURNEY: ${{ matrix.journey }}
          PROOF_OS: ${{ matrix.os }}
          OPENWORK_PACKAGED_SMOKE_DIR: ${{ runner.temp }}/openwork-packaged-smoke
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          if [ "$PROOF_OS" = macos ]; then
            node apps/desktop/scripts/packaged-smoke-macos.mjs --server-built --journey "$PROOF_JOURNEY"
          else
            # Same Chromium SUID-sandbox constraint as the proof job above.
            OPENWORK_EVAL_CONTAINER_ELECTRON=1 node apps/desktop/scripts/packaged-smoke.mjs --server-built --journey "$PROOF_JOURNEY"
          fi
      - name: Save selected native testkit and Vitest records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-proof-${{ github.run_attempt }}-${{ matrix.key }}
          path: |
            evals/results/test-runs/
            evals/results/.testkit/cli-run-*.json
            ${{ runner.temp }}/openwork-packaged-smoke/timing.json
            ${{ runner.temp }}/openwork-packaged-smoke/logs/**
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  checkpoint-proof:
    needs: select
    if: >-
      needs.select.outputs.checkpointSelected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.base.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.base.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]'
    # Check GitHub's event identity as well as the fresh API result from select.
    # A PR-controlled selector cannot exempt an outside collaborator.
    environment:
      name: >-
        ${{ github.event.repository.owner.type == 'Organization' &&
            github.event.pull_request.user.type == 'User' &&
            contains(fromJSON('["MEMBER", "OWNER"]'), github.event.pull_request.author_association) &&
            needs.select.outputs.internalContributor == 'true' &&
            'pr-internal-specs' || 'pr-slow-specs' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Sandbox provider for evidence worlds: a repository variable, Freestyle when unset.
      OPENWORK_EVIDENCE_PROVIDER: ${{ vars.OPENWORK_EVIDENCE_PROVIDER || 'freestyle' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.select.outputs.checkpointMatrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-tests
      - uses: ./.github/actions/setup-browser
      - name: Build this branch's review app
        run: pnpm --filter @openwork/review-app build
      - name: Prepare this branch's isolated web world
        timeout-minutes: 35
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENWORK_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          OPENWORK_PREVIEW_GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/prepare-evidence-web.ts
      # Specs tagged "checkpoints" run here because the Freestyle credential is
      # protected. Their records join this PR's normal evidence report; the shared
      # review app opens the checkpoints. Checkpoint worlds are web worlds on v1.
      - name: Run the tagged spec with checkpoints on this head
        id: proof
        timeout-minutes: 20
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          OPENWORK_EVIDENCE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          OPENWORK_PREVIEW_GITHUB_TOKEN: ${{ github.token }}
          PROOF_SPEC: ${{ matrix.spec }}
        run: xvfb-run -a node evals/bin/evals.mjs "${PROOF_SPEC#evals/}" --local --engine v1 --surface web --checkpoints
      - name: Save selected native testkit and Vitest records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-proof-${{ github.run_attempt }}-${{ matrix.key }}
          path: |
            evals/results/test-runs/
            evals/results/.testkit/cli-run-*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
