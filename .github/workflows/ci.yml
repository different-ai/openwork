name: CI

on:
  push:
    branches:
      - dev
      - fix/openwrk-react-shim
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-web:
    name: Build Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @different-ai/openwork build:web

  build-openwrk-binary:
    name: Build openwrk binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck openwrk
        run: pnpm --filter openwrk typecheck

      - name: Build openwrk binary
        run: pnpm --filter openwrk build:bin

      - name: Validate compiled binary
        run: |
          ./packages/headless/dist/bin/openwrk --version
          if strings ./packages/headless/dist/bin/openwrk | grep -q "React is not defined"; then
            echo "Compiled openwrk binary still contains a React runtime error string"
            exit 1
          fi
