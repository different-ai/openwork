name: Den DB Migrate

# Temporary, read-only CI credential diagnostics. No migration or safety toggles.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only PlanetScale CI access checks
    if: github.repository == 'different-ai/openwork'
    runs-on: blacksmith-4vcpu-ubuntu-2204
    environment:
      name: den-database
      deployment: false
    env:
      DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
      PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.PLANETSCALE_SERVICE_TOKEN_ID }}
      PLANETSCALE_SERVICE_TOKEN: ${{ secrets.PLANETSCALE_SERVICE_TOKEN }}
    steps:
      - name: Setup pscale CLI
        uses: planetscale/setup-pscale-action@v1
      - name: Check configured target without revealing secrets
        run: |
          set -euo pipefail
          for name in DATABASE_NAME PLANETSCALE_SERVICE_TOKEN_ID PLANETSCALE_SERVICE_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done
          if [ "$DATABASE_NAME" = "openwork-den" ]; then
            echo "DATABASE_NAME matches the MCP-confirmed database slug."
          else
            echo "::warning::DATABASE_NAME does not match the MCP-confirmed database slug."
          fi
      - name: Check authentication
        continue-on-error: true
        run: pscale auth check --format json
      - name: Read configured branch
        continue-on-error: true
        run: |
          set -euo pipefail
          pscale branch show "$DATABASE_NAME" main --org different-ai --format json |
            jq '{name, safe_migrations, production, status, error, issues, next_steps}'
      - name: Read MCP-confirmed branch with CI credentials
        continue-on-error: true
        run: |
          set -euo pipefail
          pscale branch show openwork-den main --org different-ai --format json |
            jq '{name, safe_migrations, production, status, error, issues, next_steps}'
