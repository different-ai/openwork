name: Build Electron Open Coworker

on:
  workflow_dispatch:
  push:
    branches:
      - electron-coworker-notary-test
    paths:
      - apps/coworker/**
      - apps/server/**
      - packages/headless-threads/**
      - packages/automations/**
      - constants.json
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/build-electron-coworker.yml

permissions:
  contents: read

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
          - os: windows-latest
            artifact: windows
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm before setup-node so setup-node finds it on PATH (same bootstrap as the desktop workflow).
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck and unit tests
        run: |
          pnpm --filter @openwork/coworker typecheck
          pnpm --filter @openwork/coworker test

      - name: Package Open Coworker (unpacked)
        run: pnpm --filter @openwork/coworker package:electron:dir

      - name: Upload Open Coworker artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-coworker-electron-${{ matrix.artifact }}
          path: apps/coworker/dist-electron/**

  electron-macos-notarization-smoke:
    name: Open Coworker macOS notarization smoke
    runs-on: macos-14
    # Signing and notarization need the Apple secrets the desktop already uses; the job is manual until they are granted to this workflow.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write notary API key
        env:
          APPLE_NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          chmod 600 "$NOTARY_KEY_PATH"
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      - name: Package Open Coworker (signed + notarized, no publish)
        env:
          CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
          MACOS_NOTARIZE: true
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          APPLE_API_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
        run: |
          set -euo pipefail
          pnpm --filter @openwork/coworker run build:electron
          pnpm --dir apps/coworker exec electron-builder --config electron-builder.yml --mac dmg zip --publish never

      - name: Upload signed macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: open-coworker-macos-signed
          path: |
            apps/coworker/dist-electron/*.dmg
            apps/coworker/dist-electron/*.zip
