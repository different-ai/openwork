# Fails when packaging/docker/docker-compose.eval.yml (the documented pull-only
# evaluation stack) pins den-api/den-web to anything but the highest stable v*
# tag, or when the docs that download it carry a checksum for another revision.
# The Publish EE Artifacts workflow opens the pin PR after each release; this
# check catches that PR failing to land. On pull requests it only runs for the
# files it guards, so unrelated PRs are not red during the release-to-merge
# window; the daily run reports through Test alerts.
name: Compose pins drift

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/compose-pins-drift.yml
      - packaging/docker/README.md
      - packaging/docker/docker-compose.eval.yml
      - packages/docs/self-host/evaluate-with-docker-compose.mdx
      - scripts/release/check-compose-pins.mjs
      - scripts/release/pin-compose-images.mjs
      - scripts/release/pin-compose-images.test.mjs
      - scripts/release/versions.mjs
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-compose-pins:
    name: Compare compose pins with the released version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Run pin script tests
        run: node --test scripts/release/pin-compose-images.test.mjs

      - name: Check compose pins against the highest stable tag
        run: node scripts/release/check-compose-pins.mjs
