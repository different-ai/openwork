name: opencode-openwork

on:
  pull_request:
    paths:
      - "packages/opencode-plugin/**"
      - ".github/workflows/ci-opencode-openwork.yml"
      - ".github/workflows/publish-opencode-plugin.yml"
  push:
    branches: [dev]
    paths:
      - "packages/opencode-plugin/**"
      - ".github/workflows/ci-opencode-openwork.yml"
      - ".github/workflows/publish-opencode-plugin.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/opencode-plugin

jobs:
  check:
    name: Test, typecheck & dry-run publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter opencode-openwork

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Dry-run pack
        run: npm pack --dry-run

