name: Build and core checks
run-name: ${{ github.event_name == 'schedule' && 'Full regression — component checks' || 'Build and core checks' }}

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

# A later unrelated push may select no product checks. Do not let it replace a
# pending relevant dev run; only PR updates share a cancellation group.
concurrency:
  group: openwork-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      core: ${{ steps.classify.outputs.core }}
      desktop_smoke: ${{ steps.classify.outputs.desktop_smoke }}
      den_api: ${{ steps.classify.outputs.den_api }}
      snapshot: ${{ steps.classify.outputs.snapshot }}
      docs: ${{ steps.classify.outputs.docs }}
      den_contract: ${{ steps.classify.outputs.den_contract }}
    steps:
      # Classification reads only its scripts and the workspace manifests.
      - name: Checkout build inputs
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts/
            /apps/*/package.json
            /packages/*/package.json
            /ee/apps/*/package.json
            /ee/packages/*/package.json
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            const { pathToFileURL } = require("node:url")
            const { execFileSync } = require("node:child_process")
            const scripts = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/.github/scripts/`)
            const { changedFiles, isBuildAffected } = await import(new URL("build-inputs.mjs", scripts))
            const { classifyCiChanges, pullRequestChanges, pushChanges } = await import(new URL("classify-ci-changes.mjs", scripts))
            let files = null
            let expectedCount = null
            if (context.eventName === "pull_request") {
              ;({ files, expectedCount } = await pullRequestChanges({
                github, ...context.repo,
                number: context.payload.pull_request.number,
                head: context.payload.pull_request.head.sha,
              }))
            } else if (context.eventName === "push") {
              files = pushChanges({
                base: context.payload.before,
                head: context.sha,
                readDiff: changedFiles,
                // Fetch endpoint objects, not the last commit's file list. A
                // multi-commit dev push must include every changed input.
                fetchBase: (base) => execFileSync("git", ["fetch", "--no-tags", "--no-recurse-submodules", "--depth=1", "origin", base], { stdio: "pipe", timeout: 60000 }),
              })
            }
            if (files === null && ["pull_request", "push"].includes(context.eventName)) {
              core.warning("A complete changed-file comparison is unavailable; selecting full regression.")
            }
            const selection = classifyCiChanges({ eventName: context.eventName, files, expectedCount }, isBuildAffected)
            for (const [name, value] of Object.entries(selection)) core.setOutput(name, String(value))
            core.info(`Selected checks: ${JSON.stringify(selection)}`)

  # These checks read source only. They must not wait for installs, generated
  # packages, MySQL, pinned engines, or the packaged desktop they help guard.
  static-checks:
    name: Static CI and outbound access checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Test fork authorization and free screening policy
        run: node --test .github/scripts/contributor-pr.test.mjs .github/scripts/contributor-screen.test.mjs .github/scripts/warden-check.test.mjs .github/scripts/warden-report.test.mjs .github/scripts/warden-fast.test.mjs .github/scripts/setup-browser.test.mjs
      - name: Test on-demand PR proof review builds and CI timing
        run: node --test .github/scripts/pr-proof-review-build.test.mjs .github/scripts/pr-proof-selection.test.mjs .github/scripts/ci-time-to-green.test.mjs evals/scripts/engine-parity-binaries.test.mjs evals/scripts/run-parity-proof.test.mjs
      - name: Test build inputs, publication recovery and deployment boundaries
        run: >-
          node --test
          .github/scripts/build-inputs.test.mjs
          .github/scripts/classify-ci-changes.test.mjs
          .github/scripts/docs-validation.test.mjs
          .github/scripts/ee-image-inputs.test.mjs
          .github/scripts/render-build-filters.test.mjs
          .github/scripts/runtime-scope.test.mjs
          .github/scripts/build-boundaries-native.test.mjs
          .github/scripts/build-boundaries-codeql.test.mjs
      - name: Test CodeQL scope and coverage accounting
        run: node --test scripts/ci/codeql-config.test.mjs scripts/ci/check-codeql-results.test.mjs
      - name: Check outbound access manifest
        run: node scripts/check-outbound-access.mjs

  # Unit tests run as parallel jobs of about 25s of work each, so the slowest
  # finishes in about the time one step group takes. Every job keeps its
  # original steps and assertions; openwork-tests-required requires each one
  # whenever `core` is selected.
  openwork-tests-app:
    name: Unit tests (app, server and desktop)
    needs: classify-changes
    if: needs.classify-changes.outputs.core == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      - name: Boot the app provider tree
        run: pnpm test:boot
      - name: Test native dictation focus and draft boundaries
        run: |
          node --test apps/desktop/test/native-dictation.test.mjs
          # Load Lexical's synchronous development exports for the DOM editor tests.
          pnpm --filter @openwork/app exec bun --conditions=development test --isolate ./tests/native-dictation.test.tsx ./tests/browser-dictation.test.ts ./tests/composer-caret-refocus.test.tsx
      - name: Test follow-ups sent while a chat is starting
        run: pnpm --filter @openwork/app exec bun test --isolate ./tests/starting-thread-follow-ups.test.ts
      - name: Test settling finished sessions
        run: pnpm --filter @openwork/app exec bun test --isolate ./tests/session-settle.test.ts
      - name: Test the sidebar Feed view
        run: pnpm --filter @openwork/app exec bun test --isolate ./tests/session-feed.test.ts
      - name: Test the OpenCode v2 session lifecycle mapping
        run: pnpm --filter @openwork/app exec bun test --isolate ./tests/opencode-v2-session-lifecycle.test.ts
      - name: Test the chat Working line and run time across follow-ups
        run: pnpm --filter @openwork/app exec bun --conditions=development test --isolate ./tests/message-list-working-line.test.tsx ./tests/run-working-time.test.ts
      - name: Test where a new task goes (workspace and group list)
        run: pnpm --filter @openwork/app exec bun test --isolate ./tests/new-task-destination-options.test.ts
      - name: Test chat file links resolve to real files
        run: |
          pnpm --filter @openwork/app exec bun test --isolate ./tests/chat-file-links.test.ts
          bun test apps/server/test/artifact-resolve-search.test.ts
      - name: Check desktop links open real Den pages
        run: pnpm --filter @openwork/app test:den-links
      - name: Test Library connector setup and translated placeholders
        run: pnpm --filter @openwork/app exec bun test --isolate ./tests/library-connector-setup.test.tsx ./tests/connection-sign-in-problem.test.ts ./tests/i18n-placeholders.test.ts
      - name: Test sub-agent completion notices live and after reload
        run: pnpm --filter @openwork/app exec bun --conditions=development test --isolate ./tests/subagent-notices.test.tsx
      - name: Test remote tasks in the Agents list across turns and follow-ups
        run: pnpm --filter @openwork/app exec bun test --isolate ./tests/composer-remote-follow-up.test.tsx ./tests/composer-subagent-tracker-remote.test.tsx
      - name: Test the shared Calendar logic
        run: pnpm --filter @openwork/calendar test
      - name: Test that a streaming reply keeps its place in the chat
        run: pnpm --filter @openwork/app exec bun --conditions=development test --isolate ./tests/reply-keeps-its-place.test.ts
      - name: Test desktop and cloud computer access and interruption
        run: |
          pnpm --filter @openwork/computer-use build
          node --test ee/packages/headless-computer/src/viewer-tickets.test.mjs
          node --test apps/desktop/electron/computer-control.test.mjs apps/desktop/electron/computer-remote.test.mjs apps/desktop/electron/computer-windows.test.mjs packages/computer-use/cloud.test.mjs packages/computer-use/browser-task-privacy.test.mjs packages/computer-use/browser-task-viewport.test.mjs packages/computer-use/browser-task-attach.test.mjs packages/browser-tabs/index.test.mjs packages/computer-use/chromium.test.mjs apps/desktop/electron/computer-program.test.mjs apps/desktop/electron/floating-view-window.test.mjs apps/desktop/electron/window-state.test.mjs apps/desktop/electron/keep-awake.test.mjs
          python3 ee/packages/headless-computer/scripts/desktop-bridge.test.py
          python3 ee/packages/headless-computer/scripts/app-scripting.test.py
          python3 ee/packages/headless-computer/scripts/configure-desktop-files.test.py
          python3 ee/packages/headless-computer/scripts/cloud-desktop.test.py
          python3 ee/packages/headless-computer/scripts/vnc-stdio.test.py
          python3 packages/computer-use/computer-x11-worker.test.py
          pnpm --dir evals exec vitest run --config vitest.config.ts --project pr ../apps/server/test/computer-use-tools.vitest.test.ts ../apps/server/test/cloud-computer-lifecycle.vitest.test.ts
      - name: Test packaged smoke engine diagnosis and kept logs
        run: |
          bun test apps/server/test/opencode-plugin-deps.test.ts
          node --test apps/desktop/test/engine-diagnosis.test.mjs apps/server/scripts/build-opencode-plugin-deps.test.mjs apps/desktop/scripts/electron-after-sign.test.cjs apps/server/test/inference-node-export.test.mjs
          pnpm --dir evals exec vitest run --config vitest.config.ts --project pr packages/hosts/src/local-surface-log.test.ts
      - name: Test the OpenCode engine new installs start on
        run: |
          node --test apps/desktop/test/fresh-install-engine.test.mjs
          pnpm --filter openwork-server test:fresh-install-engine
          bun test apps/server/test/engine-auto-upgrade-boot.test.ts apps/server/test/engine-auto-upgrade.test.ts apps/server/test/engine-auto-upgrade-safety.test.ts
      - name: Test providers reaching OpenCode v2 and the organization's provider rule
        run: bun test apps/server/test/engine-v2-provider-mapping.test.ts apps/server/test/opencode-v2-local-auth.test.ts
      - name: Test OpenCode v2 starting again after it fails or exits
        run: bun test apps/server/test/engine-v2-restart.test.ts
      - name: Test v2 chat lists survive unreadable and migrated chats
        run: bun --conditions=development test apps/server/test/opencode-v2-session-list.test.ts
      - name: Test the self-hosted web UI stays on its own origin
        run: bun --conditions=development test apps/server/test/web-ui-origin.test.ts
      - name: Test OneDrive and SharePoint pulls and saves
        run: bun --conditions=development test apps/server/test/drive-files-microsoft.test.ts
      - name: Test old workspaces drop the retired browser plugin
        run: bun test apps/server/test/workspace-init-legacy-browser-plugin.test.ts
      - name: Test Windows environment variable names match in any case
        run: |
          node --test packages/paths/env.test.mjs apps/desktop/test/runtime-env.test.mjs
          bun test apps/server/test/windows-env-names.test.ts
      - name: Test the desktop reads Apps as large as Den builds them
        run: bun test apps/server/test/mcp-app-resource-cache.test.ts
      - name: Test the agent's Automation listing reads every schedule kind
        run: bun test apps/server/test/connect-automation-catalog.test.ts
      - name: Test native MCP readiness and Stop ownership
        run: pnpm --filter openwork-server test:readiness

  openwork-tests-headless:
    name: Unit tests (headless computer and runner)
    needs: classify-changes
    if: needs.classify-changes.outputs.core == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      - name: Build the shared headless protocol
        run: pnpm --filter @openwork-ee/headless-protocol build
      - name: Typecheck the headless runner
        run: pnpm --filter @openwork-ee/headless-runner typecheck
      - name: Test shared headless computer and configuration
        run: |
          pnpm --filter @openwork-ee/headless-computer build
          pnpm --filter @openwork-ee/headless-computer test
          pnpm --filter @openwork-ee/headless-runner test:computer-config
          pnpm --filter @openwork-ee/workbot exec tsx --conditions=development --test scripts/computer.test.ts scripts/browser-teaching.test.ts
      - name: Test headless conversations (follow-ups, read-only lookups, waiting messages, bounded reads, moving to Node)
        run: |
          pnpm --filter @openwork-ee/headless-runner test:conversation
          pnpm --filter @openwork-ee/headless-runner test:transfer

  openwork-tests-workbot:
    name: Unit tests (Workbot, Den web and sandboxes)
    needs: classify-changes
    if: needs.classify-changes.outputs.core == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      - name: Check Den web hook order
        run: pnpm --filter @openwork-ee/den-web lint
      # Workbot and the runner's non-development tests import these builds.
      - name: Build the shared headless protocol and computer
        run: |
          pnpm --filter @openwork-ee/headless-protocol build
          pnpm --filter @openwork-ee/headless-computer build
      - name: Test Workbot sign-in and adoption boundary
        run: |
          pnpm --filter @openwork-ee/workbot test:auth
          pnpm --filter @openwork-ee/workbot test:activation
      - name: Test Workbot live events (relay and page reconnects)
        run: pnpm --filter @openwork-ee/workbot test:events
      - name: Test opt-in error reporting (runner and Workbot)
        run: |
          pnpm --filter @openwork-ee/headless-runner test:error-reporting
          pnpm --filter @openwork-ee/workbot test:error-reporting
      - name: Test service health authentication and readiness presentation
        run: |
          pnpm --filter @openwork-ee/headless-runner test:service-health
          pnpm --filter @openwork-ee/workbot test:service-readiness
          # Den web does not install tsx in CI; keep its JSX config with the API-owned loader.
          TSX_TSCONFIG_PATH=../den-web/tsconfig.json pnpm --filter @openwork-ee/den-api exec node --conditions=development --import tsx --test '../den-web/components/diagnostics/*.test.ts' '../den-web/components/diagnostics/*.test.tsx' '../den-web/components/admin/services/*.test.ts' '../den-web/components/admin/feature-change.test.ts' '../den-web/components/admin/admin-organization-feature-usage.test.ts' '../den-web/components/admin/features/feature-usage-model.test.ts' '../den-web/components/admin/control-center/control-center-model.test.ts' '../den-web/components/services/*.test.tsx' '../den-web/app/(den)/dashboard/_lib/diagnostics-access.test.ts' '../den-web/app/(den)/_lib/service-readiness.test.ts' '../den-web/app/(den)/dashboard/_components/workbot-proactive-section.test.tsx' '../den-web/app/(den)/dashboard/_components/my-agent.test.tsx' '../den-web/app/(den)/dashboard/_components/slack-connector-setup.test.tsx' '../den-web/app/(den)/dashboard/_components/provider-removal-usage-limits.test.tsx' '../den-web/app/(den)/dashboard/_components/connector-discovery-checks.test.tsx' '../den-web/app/(den)/dashboard/_components/connector-discovery-stream.test.ts' '../den-web/app/(den)/dashboard/_components/oauth-app-draft.test.ts' '../den-web/app/(den)/dashboard/_components/connector-setup-fields.test.tsx' '../den-web/app/(den)/dashboard/_components/connector-oauth-access.test.ts' '../den-web/app/(den)/dashboard/_components/tool-tester/result-presentation.test.ts' '../den-web/app/(den)/dashboard/_components/tool-tester/tool-call-inspector.test.tsx' '../den-web/app/(den)/dashboard/_components/auto-router-model.test.ts' '../den-web/app/(den)/_components/ui/chips-combobox.test.tsx'
          bun test apps/app/tests/deployment-service-readiness.test.ts apps/app/tests/opencode-zen-removal.test.ts apps/app/tests/activation-card-model.test.ts apps/app/tests/connector-readiness.test.ts apps/app/tests/control-undeclared-args.test.ts apps/app/tests/composer-session-references.test.ts apps/app/tests/session-title-marquee.test.ts
      - name: Check sandbox contracts and adapters (no cloud resources)
        run: |
          pnpm --filter @openwork/sandbox build
          pnpm --filter @openwork/sandbox test
          pnpm --filter @openwork/sandbox-daytona typecheck
          pnpm --filter @openwork/sandbox-daytona test
          pnpm --filter @openwork/sandbox-freestyle typecheck
          pnpm --filter @openwork/sandbox-freestyle test
          pnpm --filter @openwork/sandbox-differently typecheck
          pnpm --filter @openwork/sandbox-differently test
          pnpm --filter @openwork/evidence-provider typecheck
          pnpm --filter @openwork/evidence-provider test
          pnpm --filter @openwork/daytona-evidence typecheck
          pnpm --filter @openwork/daytona-evidence test
          pnpm --filter @openwork/review-app test
      - name: Test shared Workbot world transports (no cloud resources)
        run: |
          pnpm --filter @openwork/sandbox-freestyle build
          pnpm --filter @openwork/sandbox-daytona build
          pnpm --dir evals exec vitest run --config vitest.config.ts --project pr packages/hosts/src/sandbox-daytona.test.ts packages/env/src/freestyle-sandbox-preview.test.ts packages/env/src/workbot-oauth-url.test.ts

  openwork-tests-den:
    name: Unit tests (Den providers)
    needs: classify-changes
    if: needs.classify-changes.outputs.core == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      # Uses the pinned OpenCode that Setup tests put on PATH.
      - name: Run Den provider unit tests
        run: |
          pnpm --filter @openwork-ee/utils test
          pnpm --filter @openwork/automations test
          pnpm --filter @openwork-ee/den-api test
          pnpm --filter @openwork-ee/den-api exec node --conditions=development --import tsx --test "../den-web/app/(den)/dashboard/_components/manual-oauth-draft.test.ts" "../den-web/app/(den)/dashboard/_components/connector-route.test.ts" "../den-web/app/(den)/dashboard/_components/connector-readiness.test.ts" "../den-web/app/(den)/dashboard/_components/my-agent-availability.test.ts" "../den-web/app/(den)/dashboard/_components/mcp-account-authorization-state.test.ts" "../den-web/app/(den)/dashboard/_components/mcp-authorization-url.test.ts" "../den-web/app/(den)/dashboard/_components/connector-picker-sign-in-note.test.ts" "../den-web/app/(den)/dashboard/_components/gateway-provider-models.test.ts" "../den-web/app/(den)/dashboard/_lib/workbot-entry.test.ts" "../den-web/app/(den)/_lib/billing-checkout.test.ts" "../den-web/app/(den)/_lib/plan-display.test.ts" "../den-web/app/(den)/_lib/org-boot-requests.test.ts" "../den-web/app/(den)/dashboard/_lib/workbot-team-link.test.ts" "../den-web/app/(den)/_lib/member-auth-routing.test.ts" "../den-web/app/(den)/_lib/last-sign-in.test.ts" "../den-web/app/api/_lib/signed-client-ip.test.ts"
          pnpm --filter @openwork-ee/workbot test:model

  openwork-tests-evals:
    name: Unit tests (test framework and contract tooling)
    needs: classify-changes
    if: needs.classify-changes.outputs.core == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      - name: Setup headless Chrome for locator regression
        uses: ./.github/actions/setup-browser
      - name: Run eval framework tests (spec lint and its fixtures)
        run: |
          pnpm --dir evals run test:framework
          pnpm --dir evals exec vitest run --config vitest.config.ts --project pr scripts/input-dialog.live.test.ts
          pnpm --dir evals exec vitest run --config vitest.config.ts --project pr ../apps/server/test/session-title-sigv4.vitest.test.ts
      - name: Check contract generation and commit-hook safety
        run: pnpm test:contracts

  openwork-tests-evals-lint:
    name: Unit tests (test framework lint and spec lint)
    needs: classify-changes
    if: needs.classify-changes.outputs.core == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      # About 20s. Runs on every PR so spec lint cannot drift;
      # it used to run only nightly, and debt piled up unnoticed.
      - name: Check the test framework (lint and spec lint)
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev
          pnpm evals:check

  # Security rules (roles, tenants, keys, OAuth, audit) against the real den-api
  # app and a throwaway database per test file on MySQL (root:password). PRs run
  # them when Den API inputs change (build-inputs.mjs "den-api-tests"); every
  # dev push that runs unit tests runs them too. Node's --test-shard splits the
  # files across jobs; every file runs in exactly one shard.
  den-api-security:
    name: Den API security tests (${{ matrix.shard }}/6)
    needs: classify-changes
    if: needs.classify-changes.outputs.den_api == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # MySQL boots while dependencies install; the tests wait for it below.
      - name: Start MySQL
        run: docker compose -p openwork-den-local -f packaging/docker/docker-compose.web-local.yml -f packaging/docker/docker-compose.ci-mysql.yml up -d mysql redis
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      - name: Run Den API security tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm --filter @openwork-ee/den-api build:workspace-dependencies
          pnpm ci:den:mysql
          DEN_API_TEST_SHARD="$SHARD/6" pnpm --filter @openwork-ee/den-api test:api:shard

  # Cheap "does the desktop build" checks for every non-docs PR.
  openwork-tests-desktop-build:
    name: Build the desktop app (Electron typecheck and server bundle)
    needs: classify-changes
    if: needs.classify-changes.outputs.core == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      # Test source resolution differs from packaged Node plugin resolution.
      - name: Bundle the server plugins the way packaged builds do
        run: |
          rm -rf packages/types/dist
          pnpm --filter openwork-server build
      - name: Typecheck Electron main against the IPC contract
        run: pnpm --filter @openwork/desktop typecheck:electron

  # Packages and boots the real desktop. PRs run it when the desktop shell, its
  # embedded server, engine pins, dependencies, embedded docs or the app-smoke
  # harness change (build-inputs.mjs "desktop-package"). Dev pushes run it for
  # every packaged input, including app UI and shared packages ("desktop-smoke").
  openwork-tests-build:
    name: Build and boot the desktop app
    needs: classify-changes
    if: needs.classify-changes.outputs.desktop_smoke == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      # Bootstrap before checkout or any action can execute repository code.
      - name: Prepare virtual display
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C
          unset APT_CONFIG
          . /etc/os-release
          if [[ "${ID:-}" != ubuntu || "${VERSION_ID:-}" != 22.04 || "${VERSION_CODENAME:-}" != jammy ]] \
            || [[ "$(/usr/bin/dpkg --print-architecture)" != amd64 ]] \
            || [[ ! -r /usr/share/keyrings/ubuntu-archive-keyring.gpg || ! -s /usr/share/keyrings/ubuntu-archive-keyring.gpg ]]; then
            echo 'Virtual display bootstrap requires Ubuntu 22.04/jammy amd64 and its archive keyring.' >&2
            exit 1
          fi
          if command -v xvfb-run >/dev/null && command -v xdpyinfo >/dev/null; then
            echo 'Virtual display commands already installed; skipping APT.'
            exit 0
          fi

          umask 077
          apt_dir=$(mktemp -d /tmp/openwork-apt.XXXXXXXX)
          trap 'rm -rf -- "$apt_dir"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          mkdir "$apt_dir/sourceparts"
          printf '%s\n' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu jammy-updates main universe' \
            'deb [signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu jammy-security main universe' \
            > "$apt_dir/sources.list"
          chmod 0755 "$apt_dir" "$apt_dir/sourceparts"
          chmod 0644 "$apt_dir/sources.list"
          # Keep trusted image APT settings, but select only these signed Ubuntu sources.
          apt_options=(-o "Dir::Etc::sourcelist=$apt_dir/sources.list" -o "Dir::Etc::sourceparts=$apt_dir/sourceparts"
            -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=1)

          retryable_update() {
            local line pending_error=false saw_transport=false
            local transport='TLSWaitFd|Could not wait for server fd|Connection timed out|Connection failed|Could not connect to|Unable to connect to|Connection refused|Connection reset by peer|Temporary failure resolving|Could not resolve|Network is unreachable'
            local fatal='[Cc]ertificate|[Ss]ignature|NO_PUBKEY|BADSIG|EXPKEYSIG|REVKEYSIG|[Nn]ot signed|[Rr]elease file|[Hh]ash [Ss]um mismatch|[Cc]onflicting values|[Mm]alformed|[Ss]yntax error|[Ii]nvalid operation|[Pp]ermission denied'
            [[ "$status" == 100 || "$status" == 124 || "$status" == 137 ]] || return 1
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ ! "$line" =~ $fatal ]] || return 1
              if [[ "$pending_error" == true ]]; then
                [[ "$line" =~ $transport ]] || return 1
                pending_error=false
                saw_transport=true
                continue
              fi
              case "$line" in
                ''|Hit:*|Get:*|Ign:*|'Reading package lists...'*|'Fetched '*) ;;
                Err:*) pending_error=true ;;
                'E: Some index files failed to download. They have been ignored, or old ones used instead.') ;;
                E:*|W:*|'  '*)
                  [[ "$line" =~ $transport ]] || return 1
                  saw_transport=true
                  ;;
                *) return 1 ;;
              esac
            done < "$apt_dir/update.log"
            [[ "$pending_error" == false ]] && { [[ "$saw_transport" == true ]] || [[ "$status" == 124 || "$status" == 137 ]]; }
          }

          updated=false
          source_mode=security
          for attempt in 1 2 3; do
            if [[ "$attempt" == 2 ]]; then sleep 5; fi
            if [[ "$attempt" == 3 ]]; then
              sleep 10
              # Same signed jammy-security pocket; DNS may still select the same backend.
              sources=$(<"$apt_dir/sources.list")
              printf '%s\n' "${sources/security.ubuntu.com/archive.ubuntu.com}" > "$apt_dir/sources.list"
              source_mode=archive-security-fallback
            fi
            echo "APT update attempt $attempt/3 source=$source_mode"
            if sudo /usr/bin/timeout --signal=TERM --kill-after=5s 60s /usr/bin/apt-get "${apt_options[@]}" update --error-on=any > "$apt_dir/update.log" 2>&1; then
              status=0
            else
              status=$?
            fi
            cat "$apt_dir/update.log"
            echo "APT update attempt $attempt/3 source=$source_mode status=$status"
            if [[ "$status" == 0 ]]; then
              updated=true
              break
            fi
            if ! retryable_update || [[ "$attempt" == 3 ]]; then
              echo 'APT update failed; refusing to install from stale or unverified indexes.' >&2
              exit "$status"
            fi
          done
          [[ "$updated" == true ]] || exit 1
          sudo /usr/bin/timeout --signal=TERM --kill-after=5s 120s /usr/bin/apt-get "${apt_options[@]}" install -y xvfb x11-utils
          command -v xvfb-run >/dev/null && command -v xdpyinfo >/dev/null || {
            echo 'Virtual display installation did not provide both required commands.' >&2
            exit 1
          }
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Cache Electron and pinned sidecars
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            apps/desktop/resources/sidecars
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-smoke-${{ hashFiles('constants.json', 'pnpm-lock.yaml', 'apps/desktop/scripts/prepare-sidecar.mjs') }}
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      # Test source resolution differs from packaged Node plugin resolution.
      - name: Bundle the server plugins the way packaged builds do
        run: |
          rm -rf packages/types/dist
          pnpm --filter openwork-server build
      - name: Package and smoke-test the installed desktop
        timeout-minutes: 7
        env:
          OPENWORK_PACKAGED_SMOKE_DIR: ${{ runner.temp }}/openwork-packaged-smoke
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node apps/desktop/scripts/packaged-smoke.mjs --server-built
      - name: Upload packaged smoke evidence and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-desktop-smoke-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openwork-packaged-smoke/timing.json
            ${{ runner.temp }}/openwork-packaged-smoke/profiles/**/electron.log
            ${{ runner.temp }}/openwork-packaged-smoke/logs/**
            evals/results/test-runs/**
          include-hidden-files: true
          retention-days: 7

  # Broad journeys, source-layout guards, and test-framework checks remain visible
  # here without blocking unrelated PRs. No retries or ignored failures.
  openwork-tests-extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-16vcpu-ubuntu-2204, blacksmith-12vcpu-macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      # The test framework and its PR lane run on Linux only: some specs boot a
      # local Den, which needs MySQL in Docker, and the desktop's bundled
      # OpenCode binary. macOS keeps the platform builds below.
      - name: Run test-framework checks
        if: (success() || failure()) && steps.setup.outcome == 'success' && runner.os == 'Linux'
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev
          pnpm evals:check
      - name: Start MySQL and prepare the bundled OpenCode binary
        id: lane
        if: (success() || failure()) && steps.setup.outcome == 'success' && runner.os == 'Linux'
        run: |
          pnpm --filter @openwork/types build
          pnpm --filter @openwork-ee/den-db build
          pnpm --filter @openwork/email build
          pnpm ci:den:mysql
          pnpm --filter @openwork/desktop prepare:sidecar
      # One file at a time: every local Den boot resets den-web's shared .next/dev
      # build directory, so parallel Den specs crash each other's Den web.
      - name: Run all PR specs
        if: (success() || failure()) && steps.lane.outcome == 'success'
        run: pnpm --dir evals exec vitest run --config vitest.config.ts --project pr --no-file-parallelism
      - name: Run engine smoke tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm test:e2e
      - name: Build server plugins
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter openwork-server build
      - name: Typecheck Electron
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter @openwork/desktop typecheck:electron

  # The Linux packaged smoke boots an unpacked directory, which cannot install
  # an update. This lane builds real signed enterprise .app bundles so
  # packaged-update-install proves download -> install on quit -> relaunch.
  packaged-desktop-macos:
    name: Packaged desktop on macOS
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-12vcpu-macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache Electron and pinned sidecars
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            apps/desktop/resources/sidecars
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-smoke-${{ hashFiles('constants.json', 'pnpm-lock.yaml', 'apps/desktop/scripts/prepare-sidecar.mjs') }}
      - name: Setup tests
        uses: ./.github/actions/setup-tests
      # Test source resolution differs from packaged Node plugin resolution.
      - name: Bundle the server plugins the way packaged builds do
        run: |
          rm -rf packages/types/dist
          pnpm --filter openwork-server build
      - name: Package, sign, and run the macOS packaged update journey
        timeout-minutes: 30
        env:
          OPENWORK_PACKAGED_SMOKE_DIR: ${{ runner.temp }}/openwork-packaged-smoke-macos
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node apps/desktop/scripts/packaged-smoke-macos.mjs --server-built
      - name: Upload macOS packaged evidence and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-desktop-macos-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openwork-packaged-smoke-macos/timing.json
            ${{ runner.temp }}/openwork-packaged-smoke-macos/profiles/**/electron.log
            evals/results/test-runs/**
          include-hidden-files: true
          retention-days: 7

  validate-models-snapshot:
    needs: classify-changes
    if: needs.classify-changes.outputs.snapshot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Validate models snapshot
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises"

          const path = "ee/apps/gateway/src/models/base.json"
          const fail = (message) => { throw new Error(`${path}: ${message}`) }
          const isRecord = (value) => Boolean(value)
            && typeof value === "object"
            && !Array.isArray(value)
          const isStringArray = (value) => Array.isArray(value)
            && value.length > 0
            && value.every((item) => typeof item === "string")

          const parsed = JSON.parse(await readFile(path, "utf8"))
          if (!isRecord(parsed)) fail("expected a JSON object")

          const providers = Object.entries(parsed)
          if (providers.length === 0) fail("expected at least one provider")

          for (const [providerId, provider] of providers) {
            if (!isRecord(provider)) fail(`provider ${providerId} was not an object`)
            if (provider.id !== providerId) fail(`provider ${providerId} was missing a matching id`)
            if (typeof provider.name !== "string" || provider.name.length === 0) {
              fail(`provider ${providerId} was missing a name`)
            }
            if (!isRecord(provider.models) || Object.keys(provider.models).length === 0) {
              fail(`provider ${providerId} did not include models`)
            }

            for (const [modelId, model] of Object.entries(provider.models)) {
              if (!isRecord(model)) fail(`model ${providerId}.${modelId} was not an object`)
              if (model.id !== modelId) fail(`model ${providerId}.${modelId} was missing a matching id`)
              if (typeof model.name !== "string" || model.name.length === 0) {
                fail(`model ${providerId}.${modelId} was missing a name`)
              }
              if (!isRecord(model.modalities)) {
                fail(`model ${providerId}.${modelId} was missing modalities`)
              }
              if (!isStringArray(model.modalities.input)) {
                fail(`model ${providerId}.${modelId} was missing input modalities`)
              }
              if (!isStringArray(model.modalities.output)) {
                fail(`model ${providerId}.${modelId} was missing output modalities`)
              }
              if (!isRecord(model.limit)) fail(`model ${providerId}.${modelId} was missing limits`)
            }
          }
          NODE

  # Validate docs independently of the desktop smoke: images are site-only,
  # while MD/MDX and docs.json also feed the desktop's embedded agent docs.
  validate-docs:
    needs: classify-changes
    if: needs.classify-changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    env:
      # Uses native fetch instead of the old is-online/got cancellation probe.
      MINT_VERSION: "4.2.1126"
    defaults:
      run:
        working-directory: packages/docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - name: Validate the docs build
        run: pnpm dlx "mint@$MINT_VERSION" validate
      - name: Check for broken links and images
        run: pnpm dlx "mint@$MINT_VERSION" broken-links

  # Pull requests that change Den API routes or schemas generate and validate
  # OpenAPI and SDK artifacts directly from their source. Pushes to dev keep the
  # dedicated Generated Den SDK and API Contract workflows.
  # MySQL stays: importing the live app initializes Better Auth's OAuth resource
  # registry, which writes to the database, and den:contract pushes the schema
  # into a disposable database first. The audit route coverage check imports
  # the same app, so it shares this database rather than moving to dev pushes.
  den-contract:
    needs: classify-changes
    if: needs.classify-changes.outputs.den_contract == 'true'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    env:
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/openwork_den
      DEN_DB_ENCRYPTION_KEY: local-dev-db-encryption-key-please-change-1234567890
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # MySQL boots while dependencies install; generation waits for it below.
      - name: Start MySQL
        run: docker compose -p openwork-den-local -f packaging/docker/docker-compose.web-local.yml -f packaging/docker/docker-compose.ci-mysql.yml up -d mysql
      - name: Setup tests
        uses: ./.github/actions/setup-tests
      - name: Test contract generation guards
        run: node --test scripts/tests/den-contract-hook.test.mjs scripts/tests/den-contract-database.test.mjs scripts/tests/den-contract-cache.test.mjs scripts/tests/den-contract-format.test.mjs
      - name: Wait for MySQL
        run: docker compose -p openwork-den-local -f packaging/docker/docker-compose.web-local.yml -f packaging/docker/docker-compose.ci-mysql.yml up -d --wait mysql
      # den:contract owns schema preparation and cleanup, just as locally.
      - name: Regenerate the OpenAPI snapshot and SDK
        run: pnpm den:contract
      - name: Upload generated API contract and SDK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: den-api-contract
          path: |
            packages/docs/openapi.json
            packages/sdk/src/gen/**/*.ts
          if-no-files-found: error
      # den:contract drops its own disposable database. Route introspection below
      # uses DATABASE_URL instead, and importing Better Auth seeds oauthResource.
      - name: Prepare the CI database for audit route introspection
        run: pnpm --filter @openwork-ee/den-db exec node --import tsx ./node_modules/drizzle-kit/bin.cjs push --force
      # Every den-api route and better-auth endpoint must carry an audit
      # declaration (src/audit/routes); validate it without a generated report.
      - name: Check audit route coverage
        run: pnpm --filter @openwork-ee/den-api audit:coverage
      - name: Lint the contract and typecheck the SDK
        run: pnpm api:lint && pnpm --filter @openwork/sdk typecheck

  # Single stable context for branch rulesets to require. Each selected check
  # must succeed, every unselected check must be skipped, and static guards
  # always run. Classification failure/cancellation must never green-skip a gate.
  openwork-tests-required:
    needs: [classify-changes, static-checks, openwork-tests-app, openwork-tests-headless, openwork-tests-workbot, openwork-tests-den, openwork-tests-evals, openwork-tests-evals-lint, openwork-tests-desktop-build, openwork-tests-build, den-api-security, validate-models-snapshot, validate-docs, den-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Only the policy module is needed; the runner's preinstalled Node runs it.
      - name: Checkout required-check policy
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts/classify-ci-changes.mjs
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Require every selected check to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          STATIC_RESULT: ${{ needs.static-checks.result }}
          CORE: ${{ needs.classify-changes.outputs.core }}
          DESKTOP_SMOKE: ${{ needs.classify-changes.outputs.desktop_smoke }}
          DEN_API: ${{ needs.classify-changes.outputs.den_api }}
          SNAPSHOT: ${{ needs.classify-changes.outputs.snapshot }}
          DOCS: ${{ needs.classify-changes.outputs.docs }}
          DEN_CONTRACT: ${{ needs.classify-changes.outputs.den_contract }}
          CORE_APP_RESULT: ${{ needs.openwork-tests-app.result }}
          CORE_HEADLESS_RESULT: ${{ needs.openwork-tests-headless.result }}
          CORE_WORKBOT_RESULT: ${{ needs.openwork-tests-workbot.result }}
          CORE_DEN_RESULT: ${{ needs.openwork-tests-den.result }}
          CORE_EVALS_RESULT: ${{ needs.openwork-tests-evals.result }}
          CORE_EVALS_LINT_RESULT: ${{ needs.openwork-tests-evals-lint.result }}
          DESKTOP_BUILD_RESULT: ${{ needs.openwork-tests-desktop-build.result }}
          BUILD_RESULT: ${{ needs.openwork-tests-build.result }}
          DEN_API_RESULT: ${{ needs.den-api-security.result }}
          SNAPSHOT_RESULT: ${{ needs.validate-models-snapshot.result }}
          DOCS_RESULT: ${{ needs.validate-docs.result }}
          DEN_CONTRACT_RESULT: ${{ needs.den-contract.result }}
        run: |
          node --input-type=module <<'NODE'
          import { assertSelectedChecks } from "./.github/scripts/classify-ci-changes.mjs"
          const { env } = process
          const checks = {
            classification: env.CLASSIFY_RESULT,
            staticChecks: env.STATIC_RESULT,
            selected: {
              core: env.CORE,
              desktop_smoke: env.DESKTOP_SMOKE,
              den_api: env.DEN_API,
              snapshot: env.SNAPSHOT,
              docs: env.DOCS,
              den_contract: env.DEN_CONTRACT,
            },
            results: {
              core_app: env.CORE_APP_RESULT,
              core_headless: env.CORE_HEADLESS_RESULT,
              core_workbot: env.CORE_WORKBOT_RESULT,
              core_den: env.CORE_DEN_RESULT,
              core_evals: env.CORE_EVALS_RESULT,
              core_evals_lint: env.CORE_EVALS_LINT_RESULT,
              desktop_build: env.DESKTOP_BUILD_RESULT,
              desktop_smoke: env.BUILD_RESULT,
              den_api: env.DEN_API_RESULT,
              snapshot: env.SNAPSHOT_RESULT,
              docs: env.DOCS_RESULT,
              den_contract: env.DEN_CONTRACT_RESULT,
            },
          }
          console.log(JSON.stringify(checks, null, 2))
          assertSelectedChecks(checks)
          NODE
