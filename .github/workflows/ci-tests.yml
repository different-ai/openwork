name: OpenWork Tests

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

concurrency:
  group: openwork-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify-changes:
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
    steps:
      - name: Classify changed files
        id: classify
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("lane", "full")
              core.info("Selected lane: full")
              return
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            })
            const snapshotOnly = files.length === 1
              && files[0].filename === "ee/apps/inference/src/models/base.json"
            const docsOnly = files.length > 0
              && files.every((file) => file.filename.startsWith("packages/docs/"))
            const lane = snapshotOnly ? "snapshot" : docsOnly ? "docs" : "full"
            core.setOutput("lane", lane)
            core.info(`Selected lane: ${lane}`)

  openwork-tests-core:
    needs: classify-changes
    if: needs.classify-changes.outputs.lane == 'full'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      - name: Run core product regressions
        run: pnpm test:core

  native-google-refresh:
    needs: classify-changes
    if: needs.classify-changes.outputs.lane == 'full'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-tests
      - name: Prepare native Google refresh boundary
        run: |
          pnpm --filter @openwork/types build
          pnpm --filter @openwork-ee/den-db build
          pnpm --filter @openwork/email build
          pnpm dev:den:mysql
      - name: Verify native Google refresh recovery
        env:
          OPENWORK_EVAL_NATIVE_GOOGLE_REFRESH: '1'
        run: |
          pnpm evals:pr specs/native-google-refresh-recovery.test.ts
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from "node:fs";
          const root = "evals/results/test-runs";
          const runs = readdirSync(root).filter(name => name.includes("native-google-refresh")).map(name =>
            JSON.parse(readFileSync(`${root}/${name}/test-run.json`, "utf8")));
          if (runs.length !== 1 || runs[0].outcome !== "passed") throw new Error("Native Google refresh proof must execute and pass; skips are not proof.");
          NODE
      - name: Upload native Google refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-google-refresh-${{ github.run_attempt }}
          path: evals/results/test-runs/**
          retention-days: 7

  openwork-tests-build:
    needs: classify-changes
    if: needs.classify-changes.outputs.lane == 'full'
    runs-on: blacksmith-16vcpu-ubuntu-2204
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Cache Electron and pinned sidecars
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            apps/desktop/resources/sidecars
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-smoke-${{ hashFiles('constants.json', 'pnpm-lock.yaml', 'apps/desktop/scripts/prepare-sidecar.mjs') }}
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      - name: Check outbound access manifest
        run: pnpm check:outbound-access
      # Test source resolution differs from packaged Node plugin resolution.
      - name: Bundle the server plugins the way packaged builds do
        run: |
          rm -rf packages/types/dist
          pnpm --filter openwork-server build
      - name: Typecheck Electron main against the IPC contract
        run: pnpm --filter @openwork/desktop typecheck:electron
      - name: Prepare virtual display
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xdpyinfo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb x11-utils
          fi
      - name: Package and smoke-test the installed desktop
        timeout-minutes: 7
        env:
          OPENWORK_PACKAGED_SMOKE_DIR: ${{ runner.temp }}/openwork-packaged-smoke
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node apps/desktop/scripts/packaged-smoke.mjs --server-built
      - name: Upload packaged smoke evidence and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-desktop-smoke-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openwork-packaged-smoke/timing.json
            ${{ runner.temp }}/openwork-packaged-smoke/profiles/**/electron.log
            evals/results/test-runs/**
          retention-days: 7

  # Broad tests, source-layout guards, and test-framework checks remain visible
  # here without blocking unrelated PRs. No retries or ignored failures.
  openwork-tests-extended:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-16vcpu-ubuntu-2204, blacksmith-12vcpu-macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      - name: Run all app tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter @openwork/app test
      - name: Run all server tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter openwork-server test
      - name: Run Den API tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter @openwork-ee/den-api test
      - name: Run all desktop tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter @openwork/desktop test
      - name: Run release script tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: node --test scripts/release/*.test.mjs
      - name: Run test-framework checks
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm test:eval-runner
      - name: Run all PR specs
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm sdk:build && pnpm evals:pr
      - name: Run engine smoke tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm test:e2e
      - name: Build server plugins
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter openwork-server build
      - name: Typecheck Electron
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter @openwork/desktop typecheck:electron

  validate-models-snapshot:
    needs: classify-changes
    if: needs.classify-changes.outputs.lane == 'snapshot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate models snapshot
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises"

          const path = "ee/apps/inference/src/models/base.json"
          const fail = (message) => { throw new Error(`${path}: ${message}`) }
          const isRecord = (value) => Boolean(value)
            && typeof value === "object"
            && !Array.isArray(value)
          const isStringArray = (value) => Array.isArray(value)
            && value.length > 0
            && value.every((item) => typeof item === "string")

          const parsed = JSON.parse(await readFile(path, "utf8"))
          if (!isRecord(parsed)) fail("expected a JSON object")

          const providers = Object.entries(parsed)
          if (providers.length === 0) fail("expected at least one provider")

          for (const [providerId, provider] of providers) {
            if (!isRecord(provider)) fail(`provider ${providerId} was not an object`)
            if (provider.id !== providerId) fail(`provider ${providerId} was missing a matching id`)
            if (typeof provider.name !== "string" || provider.name.length === 0) {
              fail(`provider ${providerId} was missing a name`)
            }
            if (!isRecord(provider.models) || Object.keys(provider.models).length === 0) {
              fail(`provider ${providerId} did not include models`)
            }

            for (const [modelId, model] of Object.entries(provider.models)) {
              if (!isRecord(model)) fail(`model ${providerId}.${modelId} was not an object`)
              if (model.id !== modelId) fail(`model ${providerId}.${modelId} was missing a matching id`)
              if (typeof model.name !== "string" || model.name.length === 0) {
                fail(`model ${providerId}.${modelId} was missing a name`)
              }
              if (!isRecord(model.modalities)) {
                fail(`model ${providerId}.${modelId} was missing modalities`)
              }
              if (!isStringArray(model.modalities.input)) {
                fail(`model ${providerId}.${modelId} was missing input modalities`)
              }
              if (!isStringArray(model.modalities.output)) {
                fail(`model ${providerId}.${modelId} was missing output modalities`)
              }
              if (!isRecord(model.limit)) fail(`model ${providerId}.${modelId} was missing limits`)
            }
          }
          NODE

  # Docs never reach a runtime path, so a docs-only PR only needs to prove the
  # Mintlify site still builds and has no broken pages, anchors, or images.
  validate-docs:
    needs: classify-changes
    if: needs.classify-changes.outputs.lane == 'docs'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate the docs build
        run: npx -y mint@4.2.868 validate
      - name: Check for broken links and images
        run: npx -y mint@4.2.868 broken-links

  # Single stable context for branch rulesets to require. Green only when
  # the lane selected by classification succeeds; always reports.
  openwork-tests-required:
    needs: [classify-changes, openwork-tests-core, openwork-tests-build, native-google-refresh, validate-models-snapshot, validate-docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected test lane to pass
        env:
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          LANE: ${{ needs.classify-changes.outputs.lane }}
          CORE_RESULT: ${{ needs.openwork-tests-core.result }}
          BUILD_RESULT: ${{ needs.openwork-tests-build.result }}
          GOOGLE_REFRESH_RESULT: ${{ needs.native-google-refresh.result }}
          SNAPSHOT_RESULT: ${{ needs.validate-models-snapshot.result }}
          DOCS_RESULT: ${{ needs.validate-docs.result }}
        run: |
          echo "classification: $CLASSIFY_RESULT ($LANE)"
          echo "core product regressions: $CORE_RESULT"
          echo "packaging and IPC contract: $BUILD_RESULT"
          echo "native Google refresh: $GOOGLE_REFRESH_RESULT"
          echo "snapshot validation: $SNAPSHOT_RESULT"
          echo "docs validation: $DOCS_RESULT"

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "Changed-file classification did not succeed; blocking merge." >&2
            exit 1
          fi

          case "$LANE" in
            full)
              [ "$CORE_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ] && [ "$GOOGLE_REFRESH_RESULT" = "success" ] && [ "$SNAPSHOT_RESULT" = "skipped" ] && [ "$DOCS_RESULT" = "skipped" ] || exit 1
              ;;
            snapshot)
              [ "$SNAPSHOT_RESULT" = "success" ] && [ "$CORE_RESULT" = "skipped" ] && [ "$BUILD_RESULT" = "skipped" ] && [ "$GOOGLE_REFRESH_RESULT" = "skipped" ] && [ "$DOCS_RESULT" = "skipped" ] || exit 1
              ;;
            docs)
              [ "$DOCS_RESULT" = "success" ] && [ "$CORE_RESULT" = "skipped" ] && [ "$BUILD_RESULT" = "skipped" ] && [ "$GOOGLE_REFRESH_RESULT" = "skipped" ] && [ "$SNAPSHOT_RESULT" = "skipped" ] || exit 1
              ;;
            *)
              echo "Changed-file classification returned an unexpected value; blocking merge." >&2
              exit 1
              ;;
          esac
