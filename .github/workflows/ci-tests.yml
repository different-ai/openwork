name: Nightly regression

# Nightly and manual runs only. Nothing here gates a merge, a deploy or a
# release: the checks that do are the quick check (quick-check.yml), which
# runs on every PR and every dev push.
on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

env:
  OPENCODE_GITHUB_REPO: ${{ vars.OPENCODE_GITHUB_REPO || 'anomalyco/opencode' }}

permissions:
  contents: read

jobs:
  # Broad journeys, source-layout guards and test-framework checks. No retries
  # or ignored failures.
  openwork-tests-extended:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-16vcpu-ubuntu-2204, blacksmith-12vcpu-macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup tests
        id: setup
        uses: ./.github/actions/setup-tests
      # The test framework and its PR lane run on Linux only: some specs boot a
      # local Den, which needs MySQL in Docker, and the desktop's bundled
      # OpenCode binary. macOS keeps the platform builds below.
      - name: Run test-framework checks
        if: (success() || failure()) && steps.setup.outcome == 'success' && runner.os == 'Linux'
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev
          pnpm evals:check
      - name: Start MySQL and prepare the bundled OpenCode binary
        id: lane
        if: (success() || failure()) && steps.setup.outcome == 'success' && runner.os == 'Linux'
        run: |
          pnpm --filter @openwork/types build
          pnpm --filter @openwork-ee/den-db build
          pnpm --filter @openwork/email build
          pnpm ci:den:mysql
          pnpm --filter @openwork/desktop prepare:sidecar
      # One file at a time: every local Den boot resets den-web's shared .next/dev
      # build directory, so parallel Den specs crash each other's Den web.
      - name: Run all PR specs
        if: (success() || failure()) && steps.lane.outcome == 'success'
        run: pnpm --dir evals exec vitest run --config vitest.config.ts --project pr --no-file-parallelism
      - name: Run engine smoke tests
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm test:e2e
      - name: Build server plugins
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter openwork-server build
      - name: Typecheck Electron
        if: (success() || failure()) && steps.setup.outcome == 'success'
        run: pnpm --filter @openwork/desktop typecheck:electron

  # The Linux packaged smoke boots an unpacked directory, which cannot install
  # an update. This lane builds real signed enterprise .app bundles so
  # packaged-update-install proves download -> install on quit -> relaunch.
  packaged-desktop-macos:
    name: Packaged desktop on macOS
    runs-on: blacksmith-12vcpu-macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Cache Electron and pinned sidecars
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            apps/desktop/resources/sidecars
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-smoke-${{ hashFiles('constants.json', 'pnpm-lock.yaml', 'apps/desktop/scripts/prepare-sidecar.mjs') }}
      - name: Setup tests
        uses: ./.github/actions/setup-tests
      # Test source resolution differs from packaged Node plugin resolution.
      - name: Bundle the server plugins the way packaged builds do
        run: |
          rm -rf packages/types/dist
          pnpm --filter openwork-server build
      - name: Package, sign, and run the macOS packaged update journey
        timeout-minutes: 30
        env:
          OPENWORK_PACKAGED_SMOKE_DIR: ${{ runner.temp }}/openwork-packaged-smoke-macos
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node apps/desktop/scripts/packaged-smoke-macos.mjs --server-built
      - name: Upload macOS packaged evidence and timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-desktop-macos-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/openwork-packaged-smoke-macos/timing.json
            ${{ runner.temp }}/openwork-packaged-smoke-macos/profiles/**/electron.log
            evals/results/test-runs/**
          include-hidden-files: true
          retention-days: 7

  validate-models-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1

      - name: Validate models snapshot
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises"

          const path = "ee/apps/gateway/src/models/base.json"
          const fail = (message) => { throw new Error(`${path}: ${message}`) }
          const isRecord = (value) => Boolean(value)
            && typeof value === "object"
            && !Array.isArray(value)
          const isStringArray = (value) => Array.isArray(value)
            && value.length > 0
            && value.every((item) => typeof item === "string")

          const parsed = JSON.parse(await readFile(path, "utf8"))
          if (!isRecord(parsed)) fail("expected a JSON object")

          const providers = Object.entries(parsed)
          if (providers.length === 0) fail("expected at least one provider")

          for (const [providerId, provider] of providers) {
            if (!isRecord(provider)) fail(`provider ${providerId} was not an object`)
            if (provider.id !== providerId) fail(`provider ${providerId} was missing a matching id`)
            if (typeof provider.name !== "string" || provider.name.length === 0) {
              fail(`provider ${providerId} was missing a name`)
            }
            if (!isRecord(provider.models) || Object.keys(provider.models).length === 0) {
              fail(`provider ${providerId} did not include models`)
            }

            for (const [modelId, model] of Object.entries(provider.models)) {
              if (!isRecord(model)) fail(`model ${providerId}.${modelId} was not an object`)
              if (model.id !== modelId) fail(`model ${providerId}.${modelId} was missing a matching id`)
              if (typeof model.name !== "string" || model.name.length === 0) {
                fail(`model ${providerId}.${modelId} was missing a name`)
              }
              if (!isRecord(model.modalities)) {
                fail(`model ${providerId}.${modelId} was missing modalities`)
              }
              if (!isStringArray(model.modalities.input)) {
                fail(`model ${providerId}.${modelId} was missing input modalities`)
              }
              if (!isStringArray(model.modalities.output)) {
                fail(`model ${providerId}.${modelId} was missing output modalities`)
              }
              if (!isRecord(model.limit)) fail(`model ${providerId}.${modelId} was missing limits`)
            }
          }
          NODE

      # Builds both published catalogs (v1 /api.json and v2
      # /experimental/v2.0/api.json) from the snapshots with plain Node: it
      # checks base-v2.json and that the custom and OpenWork providers convert
      # to valid v2 entries.
      - name: Build v1 and v2 catalogs
        run: node ee/apps/gateway/scripts/build-models.mjs

  # Validate docs independently of the desktop smoke: images are site-only,
  # while MD/MDX and docs.json also feed the desktop's embedded agent docs.
  validate-docs:
    runs-on: ubuntu-latest
    env:
      # Uses native fetch instead of the old is-online/got cancellation probe.
      MINT_VERSION: "4.2.1126"
    defaults:
      run:
        working-directory: packages/docs
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0
      - name: Validate the docs build
        run: pnpm dlx "mint@$MINT_VERSION" validate
      - name: Check for broken links and images
        run: pnpm dlx "mint@$MINT_VERSION" broken-links
