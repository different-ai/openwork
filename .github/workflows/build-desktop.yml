name: Build Desktop (Electron)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Electron Build (Linux)
    runs-on: ${{ vars.OPENWORK_LINUX_X64_RUNNER_LABEL != '' && vars.OPENWORK_LINUX_X64_RUNNER_LABEL || 'ubuntu-22.04' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup desktop build environment
        uses: ./.github/actions/setup-desktop-build-env
        with:
          os-type: linux

      - name: Build unpacked Electron app
        run: pnpm --dir packages/desktop pack:electron

      - name: Upload Electron build directory
        uses: actions/upload-artifact@v4
        with:
          name: desktop-electron-linux-dir
          path: packages/desktop/release
          if-no-files-found: error
