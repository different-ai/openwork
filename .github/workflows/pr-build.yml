name: PR build

on:
  pull_request:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build server and bundled plugins
        run: pnpm --filter openwork-server build
      - name: Typecheck Electron main against the IPC contract
        run: pnpm --filter @openwork/desktop typecheck:electron
      - name: Build app renderer
        run: pnpm --filter @openwork/app build
