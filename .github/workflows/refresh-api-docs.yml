# The hosted docs (Mintlify) build the API tab from the live public contract at
# api.openworklabs.com/openapi.json?public=1, but Mintlify's Git integration
# only rebuilds when packages/docs changes. When the Den API contract sources
# change, this waits until production den-api serves the latest API deployment
# input commit (Render skips unrelated dev commits), then asks Mintlify to rebuild.
# A skipped or failed rebuild only warns: the next docs change rebuilds the API tab anyway.
name: Refresh API Docs

on:
  push:
    branches: [dev]

permissions:
  contents: read

env:
  OPENAPI_URL: https://api.openworklabs.com/openapi.json?public=1

jobs:
  scope:
    name: Select API docs inputs
    if: github.repository == 'different-ai/openwork' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    outputs:
      affected: ${{ steps.inputs.outcome == 'success' && steps.inputs.outputs.fingerprint != '' && steps.inputs.outputs.affected || 'true' }}
      deployment_sha: ${{ steps.deployment.outputs.deployment_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1
      - name: Compare API docs inputs
        id: inputs
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/build-inputs.mjs --target api-docs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Read API deployment history only for a selected refresh
        id: history
        if: steps.inputs.outcome != 'success' || steps.inputs.outputs.fingerprint == '' || steps.inputs.outputs.affected != 'false'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.sha }}
        run: |
          # History is needed to find the last API-input commit, not its old
          # blobs (screenshots and docs make a full clone unnecessarily large).
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --no-tags --filter=blob:none --unshallow origin "$HEAD_SHA"
          fi
      - name: Resolve the latest API deployment input commit
        id: deployment
        if: steps.history.outcome == 'success'
        continue-on-error: true
        env:
          HEAD_SHA: ${{ github.sha }}
        run: node .github/scripts/runtime-scope.mjs "$HEAD_SHA"

  refresh:
    needs: scope
    # The Mintlify key is only for dev's own workflow code: no manual runs, and
    # never from another ref. Selection errors refresh instead of silently skipping.
    if: ${{ !cancelled() && github.repository == 'different-ai/openwork' && github.ref == 'refs/heads/dev' && needs.scope.outputs.affected != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Scope jobs can finish out of order. A late older selector (or an
    # unrelated push) must not cancel the refresh for the newest API input.
    concurrency:
      group: ${{ github.workflow }}-${{ github.sha }}
      cancel-in-progress: false

    steps:
      - name: Wait for den-api to serve the API deployment input commit
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_SHA: ${{ needs.scope.outputs.deployment_sha || github.sha }}
        run: |
          set -uo pipefail

          # den-api reports its Render commit as info.version ("commit 0b73707").
          # The workflow/helper itself can change without an API deploy, so wait
          # for the newest commit in native-den-api's actual build input scope.
          # A newer deployed commit counts too. Old instances keep serving for a
          # few minutes after a deploy, so require matching reads in a row.
          deadline=$((SECONDS + 30 * 60))
          matches=0
          while [ "$SECONDS" -lt "$deadline" ]; do
            version="$(curl -fsS --compressed --max-time 60 "$OPENAPI_URL" | jq -r '.info.version // empty' 2> /dev/null)"
            status=""
            if [[ "$version" =~ ^commit\ [0-9a-f]{7,40}$ ]]; then
              status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEPLOYMENT_SHA...${version#commit }" --jq '.status' 2> /dev/null)"
            fi
            if [ "$status" = "identical" ] || [ "$status" = "ahead" ]; then
              matches=$((matches + 1))
              if [ "$matches" -ge 3 ]; then
                echo "den-api serves $version, which includes API deployment input $DEPLOYMENT_SHA (workflow commit $GITHUB_SHA)."
                echo "live=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            else
              matches=0
            fi
            sleep 20
          done

          echo "::warning title=API docs not refreshed::den-api did not serve API deployment input $DEPLOYMENT_SHA or a newer commit within 30 minutes (last seen: ${version:-no response}). The next packages/docs change rebuilds the API tab."
          echo "live=false" >> "$GITHUB_OUTPUT"

      - name: Rebuild the docs
        if: steps.live.outputs.live == 'true'
        env:
          MINTLIFY_PROJECT_ID: ${{ vars.MINTLIFY_PROJECT_ID }}
          MINTLIFY_API_KEY: ${{ secrets.MINTLIFY_API_KEY }}
        run: |
          set -uo pipefail

          if [ -z "$MINTLIFY_PROJECT_ID" ] || [ -z "$MINTLIFY_API_KEY" ]; then
            echo "::warning title=API docs not refreshed::Set the MINTLIFY_API_KEY secret (an admin API key) and MINTLIFY_PROJECT_ID variable to rebuild the docs when den-api deploys. The next packages/docs change rebuilds the API tab."
            exit 0
          fi

          response="$(curl -sS --max-time 30 --retry 3 \
            -X POST "https://api.mintlify.com/v1/project/update/$MINTLIFY_PROJECT_ID" \
            -H "Authorization: Bearer $MINTLIFY_API_KEY")"
          status_id="$(jq -r '.statusId // empty' <<< "$response" 2> /dev/null)"
          if [ -z "$status_id" ]; then
            echo "::warning title=API docs not refreshed::Mintlify did not queue a rebuild: ${response:-no response}"
            exit 0
          fi

          deadline=$((SECONDS + 10 * 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            update="$(curl -sS --max-time 30 \
              "https://api.mintlify.com/v1/project/update-status/$status_id" \
              -H "Authorization: Bearer $MINTLIFY_API_KEY")"
            case "$(jq -r '.status // empty' <<< "$update" 2> /dev/null)" in
              success)
                echo "Mintlify rebuilt the docs from the live API contract."
                exit 0
                ;;
              failure)
                echo "::warning title=API docs rebuild failed::$(jq -r '.summary // "Mintlify reported a failed update."' <<< "$update")"
                exit 0
                ;;
            esac
            sleep 15
          done

          echo "::warning title=API docs rebuild still running::Mintlify update $status_id did not finish within 10 minutes."
