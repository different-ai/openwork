name: Sentry integration audit

on:
  push:
    branches: [audit/sentry-combined-regressions-0905]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentry-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  combined-journeys:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-tests
      - name: Build dependencies for isolated Den
        run: |
          pnpm --filter @openwork/types build
          pnpm --filter @openwork-ee/den-db build
          pnpm --filter @openwork/email build
          pnpm dev:den:mysql
      - name: Run all six journeys sequentially on the combined commit
        env:
          OPENWORK_EVAL_NATIVE_GOOGLE_REFRESH: "1"
        shell: bash
        run: |
          mkdir -p integration-results
          verdict=0
          for spec in server-log-file workspace-file-catalog desktop-calendar-read mcp-oauth-response-issuer native-google-refresh-recovery den-db-transient-read-retry; do
            touch integration-results/start
            pnpm evals:pr "specs/$spec.test.ts" --reporter=default --reporter=json --outputFile.json="../integration-results/$spec-vitest.json" > "integration-results/$spec.log" 2>&1 && result=0 || result=$?
            cat "integration-results/$spec.log"
            SPEC="$spec" node --input-type=module <<'NODE' || result=1
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          const root = 'evals/results/test-runs';
          const start = fs.statSync('integration-results/start').mtimeMs;
          const sha = execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          const vitest = JSON.parse(fs.readFileSync(`integration-results/${process.env.SPEC}-vitest.json`, 'utf8'));
          const runs = fs.existsSync(root) ? fs.readdirSync(root).flatMap(dir => {
            const file = path.join(root, dir, 'test-run.json');
            return fs.existsSync(file) && fs.statSync(file).mtimeMs >= start ? [JSON.parse(fs.readFileSync(file, 'utf8'))] : [];
          }) : [];
          const summary = runs.map(({name, gitSha, outcome, summary, failure}) => ({name, gitSha, outcome, summary, failure}));
          fs.writeFileSync(`integration-results/${process.env.SPEC}.json`, JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          if (!vitest.success || !vitest.numTotalTests || vitest.numPassedTests !== vitest.numTotalTests
            || !runs.length || runs.some(run => run.gitSha !== sha || run.outcome !== 'passed')) {
            throw new Error('Missing, stale, failed, or skipped journey evidence');
          }
          NODE
            if [ "$result" != 0 ]; then verdict=1; fi
          done
          exit "$verdict"
      - name: Preserve combined evidence, including failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sentry-combined-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            integration-results/
            evals/results/test-runs/
          if-no-files-found: error
