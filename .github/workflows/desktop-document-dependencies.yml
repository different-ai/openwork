name: Desktop document dependency audit

on:
  pull_request:
    paths: &audit-inputs
      - ".nvmrc"
      - ".github/workflows/desktop-document-dependencies.yml"
      - "ee/packages/headless-computer/desktop-node-packages*.json"
      - "ee/packages/headless-computer/requirements-desktop.*"
      - "ee/packages/headless-computer/scripts/audit-desktop-locks.mjs"
  push:
    branches: [dev]
    paths: *audit-inputs
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node ee/packages/headless-computer/scripts/audit-desktop-locks.mjs
