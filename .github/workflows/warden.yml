name: Warden

# Trigger types must stay aligned with the warden.toml trigger actions:
# an event that runs this workflow but matches no warden trigger would
# produce findings_count=0 without analysis and wrongly grant clearance.
# Analyze drafts as they evolve, then refresh the review when they become ready.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]

permissions:
  # contents:write is required by GitHub to resolve review threads via
  # GraphQL; Warden auto-resolves its own findings once fixed, which the
  # ruleset's required_review_thread_resolution depends on.
  contents: write
  pull-requests: write
  checks: write

concurrency:
  group: warden-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  warden:
    # Fork PRs have no secrets, so analysis cannot run there (and clearance
    # is fork-blocked in warden-clearance.yml anyway). Drafts are reviewed too.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WARDEN_MODEL: ${{ secrets.WARDEN_MODEL }}
      WARDEN_OPENAI_API_KEY: ${{ secrets.WARDEN_OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Analyze
        id: analyze
        uses: getsentry/warden@8759014a14130cd2b82e59d3fb450a7385721221 # v0
        with:
          mode: analyze

      # Report mode overwrites the analyzer output and omits partial-analysis
      # metadata, so prepare the fail-closed, redacted receipt first.
      - name: Prepare review receipt
        env:
          FINDINGS_FILE: ${{ steps.analyze.outputs.findings-file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          node .github/scripts/warden-review.mjs prepare
          --findings "$FINDINGS_FILE"
          --repository "$GITHUB_REPOSITORY"
          --pr "$PR_NUMBER"
          --head "$HEAD_SHA"
          --base "$BASE_SHA"
          --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT"
          --output warden-summary.json

      - name: Report
        uses: getsentry/warden@8759014a14130cd2b82e59d3fb450a7385721221 # v0
        with:
          mode: report
          findings-file: ${{ steps.analyze.outputs.findings-file }}

      - name: Upload sanitized review receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warden-summary
          path: warden-summary.json
          retention-days: 90
