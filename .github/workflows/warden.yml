name: Warden

# Keep these actions aligned with warden.toml. The workflow remains disabled
# in GitHub until a maintainer explicitly enables it after rollout.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Analysis and run summaries need no review, approval, or check-write token.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: warden-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  warden:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start timing
        id: timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout source for analysis
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Only the immutable base supplies executable reporting code and policy.
      # The PR's source is inspected by Warden; no PR scripts or installs run.
      - name: Checkout trusted policy and reporter
        id: policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .warden-policy
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .warden

      # The WARDEN_MODEL repository variable swaps the model without a PR.
      # warden.toml models outrank the WARDEN_MODEL env var, so rewrite the
      # trusted policy copy; the committed model stays the fallback.
      - name: Apply model variable
        if: vars.WARDEN_MODEL != ''
        env:
          MODEL: ${{ vars.WARDEN_MODEL }}
        run: |
          if ! printf '%s' "$MODEL" | grep -Eq '^[a-z0-9-]+/[A-Za-z0-9._-]+$'; then
            echo "::error::WARDEN_MODEL must be provider/model-id, got: $MODEL"
            exit 1
          fi
          sed -i -E "s|^model = \".*\"$|model = \"$MODEL\"|" .warden-policy/warden.toml
          grep -n '^model = ' .warden-policy/warden.toml

      - name: Start analysis timing
        id: analysis-timing
        run: echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Analyze security
        id: analyze
        uses: getsentry/warden@8759014a14130cd2b82e59d3fb450a7385721221 # v0 (CLI 0.43.0)
        env:
          # Registers models newer than the pinned Warden's Pi catalog.
          PI_CODING_AGENT_DIR: ${{ github.workspace }}/.warden-policy/.warden/pi
          WARDEN_OPENAI_API_KEY: ${{ secrets.WARDEN_OPENAI_API_KEY }}
        with:
          mode: analyze
          base-config-path: .warden-policy/warden.toml
          base-skill-root: .warden-policy
          # Deliberately absent: load only the trusted base policy, with no
          # PR-controlled additional skills, tools, or model overrides.
          config-path: .warden-policy/.no-repo-config.toml
          report-on: "off"

      - name: Security summary and timing
        if: always() && steps.policy.outcome == 'success'
        env:
          FINDINGS_FILE: ${{ steps.analyze.outputs.findings-file }}
          ANALYSIS_OUTCOME: ${{ steps.analyze.outcome }}
          REVIEW_STARTED: ${{ steps.timing.outputs.started }}
          ANALYSIS_STARTED: ${{ steps.analysis-timing.outputs.started }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPORT_PATH: ${{ runner.temp }}/warden-summary.json
        run: node .warden-policy/.github/scripts/warden-report.mjs

      - name: Save review measurement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warden-summary
          path: ${{ runner.temp }}/warden-summary.json
          retention-days: 90
          if-no-files-found: warn
