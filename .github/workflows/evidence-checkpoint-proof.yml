name: Evidence checkpoint prerequisite

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/evidence-checkpoint-proof.yml
      - packages/freestyle/src/checkpoint-probe.ts
      - packages/freestyle/test/checkpoint-*.test.*
      - packages/freestyle/test/fixtures/checkpoint-stream.mjs
      - scripts/prove-freestyle-checkpoints.ts

permissions:
  contents: read

concurrency:
  group: evidence-checkpoint-prerequisite-${{ github.event.pull_request.number }}
  # Let teardown finish. A newer head must not kill cleanup on the older run.
  cancel-in-progress: false

jobs:
  unit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - run: pnpm --filter @openwork/freestyle... install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @openwork/freestyle test

  live-prerequisite:
    needs: unit
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.event.repository.id &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' && github.triggering_actor != 'dependabot[bot]'
    # Unlike prewarm's pinned controller, this intentionally executes PR code.
    # An existing protected environment makes that an explicit review boundary.
    environment: pr-slow-specs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install without credentials or lifecycle scripts
        run: pnpm --filter @openwork/freestyle... install --frozen-lockfile --ignore-scripts
      - name: Verify live RAM and in-VM streaming forks
        timeout-minutes: 12
        env:
          FREESTYLE_API_KEY: ${{ secrets.FREESTYLE_API_KEY }}
          CHECKPOINT_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/prove-freestyle-checkpoints.ts
      - name: Save sanitized prerequisite result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-checkpoint-prerequisite-${{ github.run_attempt }}
          path: results/checkpoint-probe/report.json
          retention-days: 7
          if-no-files-found: error
      - name: State the boundary of this proof
        if: always()
        run: |
          echo '## Checkpoint prerequisite (not an OpenWork E2E)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Tests live VM memory, an existing loopback HTTP stream, independent forks, and cleanup. No Chromium, screenshot, or click-to-fork UI is proven by this job. See the report artifact for its verdict and source SHA.' >> "$GITHUB_STEP_SUMMARY"
