name: Evidence checkpoint prerequisite

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/evidence-checkpoint-proof.yml
      - packages/freestyle/**

permissions:
  contents: read

concurrency:
  group: evidence-checkpoint-prerequisite-${{ github.event.pull_request.number }}
  # Unit-only. The live prerequisite shares checkpoint-proof's single protected gate.
  cancel-in-progress: true

jobs:
  unit:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - run: pnpm --filter @openwork/freestyle... install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @openwork/freestyle test
