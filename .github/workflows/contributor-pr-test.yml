name: Contributor PR checks

# Everything that costs money for a fork PR starts here, and only here.
#
# A maintainer reviews a fork PR, then comments `/test` (the head when they
# commented) or `/test <sha>` (exactly that commit). If the contributor pushed
# after the comment, or the free screen blocked the commit, it is refused.
#
# Once bound and allowed by the deterministic screen, approve the fork's
# waiting test runs. Maintainer authorization and exact-head binding remain
# required. Required tests and human approvals are unchanged.
#
# issue_comment always runs this file from dev. Nothing here runs PR code.
on:
  issue_comment:
    types: [created]

permissions: {}

# Serialize repeated /test commands for a PR instead of duplicating paid work.
concurrency:
  group: contributor-pr-test-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  authorize:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      statuses: read
      contents: read
      issues: write
      pull-requests: write
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - name: Checkout trusted gate script from dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Check the commenter and bind the reviewed commit
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: node .github/scripts/contributor-pr.mjs authorize

  # Proceed from maintainer authorization and the deterministic screen.
  start-tests:
    needs: authorize
    if: needs.authorize.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted gate script from dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Approve the fork's waiting test runs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.authorize.outputs.sha }}
        run: node .github/scripts/contributor-pr.mjs approve-runs
