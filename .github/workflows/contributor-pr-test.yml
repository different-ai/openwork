name: Contributor PR checks

# Everything that costs money for a fork PR starts here, and only here.
#
# A maintainer reviews a fork PR, then comments `/test` (the head when they
# commented) or `/test <sha>` (exactly that commit). If the contributor pushed
# after the comment, or the free screen blocked the commit, it is refused.
#
# Once bound, in order:
#   1. AI screen: Warden's contributor-screen skill, once per commit.
#   2. If it is clear, or the maintainer comments /test again to proceed
#      anyway: approve the fork's waiting test runs and run the Warden
#      security review (if it has not passed on that commit yet).
#   3. Pass `contributor-pr-required` when the free screen is not blocked,
#      Warden is clear and `openwork-tests-required` (ci-tests.yml, no
#      secrets) succeeds.
#
# issue_comment always runs this file from dev. Nothing here runs PR code.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test')
    runs-on: ubuntu-latest
    environment: warden-clearance
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
      needs_screen: ${{ steps.authorize.outputs.needs_screen }}
      needs_review: ${{ steps.authorize.outputs.needs_review }}
    steps:
      - name: Checkout trusted gate script from dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # contributor-pr-required must come from the diff-warden App: the dev
      # ruleset requires that source, and its key is only in this environment.
      - name: Mint the status token
        id: status-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.WARDEN_APP_ID }}
          private-key: ${{ secrets.WARDEN_PRIVATE_KEY }}
          permission-statuses: write
      - name: Check the commenter and bind the reviewed commit
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_CREATED_AT: ${{ github.event.comment.created_at }}
        run: node .github/scripts/contributor-pr.mjs authorize

  ai-screen:
    needs: authorize
    if: needs.authorize.outputs.sha != '' && needs.authorize.outputs.needs_screen == 'true'
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/contributor-warden.yml
    with:
      pr_number: ${{ github.event.issue.number }}
      head_sha: ${{ needs.authorize.outputs.sha }}
      stage: screen
    secrets:
      WARDEN_CONTRIBUTOR_OPENAI_API_KEY: ${{ secrets.WARDEN_CONTRIBUTOR_OPENAI_API_KEY }}

  # Proceed when the AI screen is clear on this run, or when it already ran
  # on this commit and the maintainer commented /test again.
  start-tests:
    needs: [authorize, ai-screen]
    if: >-
      always() && needs.authorize.outputs.sha != '' &&
      (needs.authorize.outputs.needs_screen == 'false' || needs.ai-screen.outputs.verdict == 'clean')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted gate script from dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Approve the fork's waiting test runs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.authorize.outputs.sha }}
        run: node .github/scripts/contributor-pr.mjs approve-runs

  review:
    needs: [authorize, ai-screen]
    if: >-
      always() && needs.authorize.outputs.sha != '' && needs.authorize.outputs.needs_review == 'true' &&
      (needs.authorize.outputs.needs_screen == 'false' || needs.ai-screen.outputs.verdict == 'clean')
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    uses: ./.github/workflows/contributor-warden.yml
    with:
      pr_number: ${{ github.event.issue.number }}
      head_sha: ${{ needs.authorize.outputs.sha }}
      stage: review
    secrets:
      WARDEN_CONTRIBUTOR_OPENAI_API_KEY: ${{ secrets.WARDEN_CONTRIBUTOR_OPENAI_API_KEY }}

  finalize:
    needs: [authorize, ai-screen, start-tests, review]
    if: >-
      always() && needs.authorize.outputs.sha != '' &&
      (needs.authorize.outputs.needs_screen == 'false' || needs.ai-screen.outputs.verdict == 'clean')
    runs-on: ubuntu-latest
    environment: warden-clearance
    timeout-minutes: 130
    # A newer /test on the same PR supersedes this one.
    concurrency:
      group: contributor-pr-test-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout trusted gate script from dev
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      # contributor-pr-required must come from the diff-warden App: the dev
      # ruleset requires that source, and its key is only in this environment.
      - name: Mint the status token
        id: status-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.WARDEN_APP_ID }}
          private-key: ${{ secrets.WARDEN_PRIVATE_KEY }}
          permission-statuses: write
      - name: Wait for tests and Warden on the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TOKEN: ${{ steps.status-token.outputs.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.authorize.outputs.sha }}
          REVIEW_JOB_RESULT: ${{ needs.review.result }}
          WAIT_MINUTES: "120"
        run: node .github/scripts/contributor-pr.mjs finalize
