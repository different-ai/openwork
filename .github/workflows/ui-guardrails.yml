name: UI guardrails

on:
  pull_request:
    paths:
      - "apps/app/src/**"
      - "ee/apps/den-web/**"
      - "ee/packages/workbot-ui/**"
      - "scripts/check-ui-guardrails*"
      - "scripts/ui-guardrails-baseline.json"
      - ".github/workflows/ui-guardrails.yml"
      - ".github/workflows/features-check.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-guardrails:
    name: UI guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.1

      - name: Check UI workflow independence
        run: node --test scripts/check-ui-guardrails-workflow.test.mjs

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - name: Install the scanner's dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --filter "@different-ai/openwork-workspace"

      - name: Test UI guardrails
        run: pnpm test:ui-guardrails

      - name: Ratchet UI guardrails
        run: pnpm check:ui-guardrails
